<script>
/* ==========================================================================
   GROUP — the member roster (with a mentor "all groups" overview).
   Entering this screen is handled by the bottom nav (app.goGroup in Core).
   ========================================================================== */

function groupScreen(){
  if (!DATA) return `<div class="screen"></div>`;
  const isMentor = DATA.user && DATA.user.role && DATA.user.role.toLowerCase() === "mentor";

  // Same page for both roles: a member sees only their own group's roster,
  // a mentor sees every group's roster, one section per group.
  const header = isMentor
    ? `<div class="serif" style="font-size:26px;font-weight:700;letter-spacing:-.4px;">SMALL GROUPS</div>`
    : `<div style="font-size:14px;color:#8f8a80;font-weight:500;">MY SMALL GROUP</div>
       <div class="serif" style="font-size:26px;font-weight:700;letter-spacing:-.4px;margin-top:2px;">${esc((DATA.group && DATA.group.name) || "Small Group")}</div>`;

  const sections = isMentor
    ? (DATA.allGroups || []).map(grp => ({ title: grp.name, members: grp.members || [] }))
    : [{ title: "Members", members: DATA.members || [] }];

  const sectionsHtml = sections.map(sec => {
    const memberRows = sec.members.map(x => `
      <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid #d1d1d1;">
        <div style="width:44px;height:44px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#ffffff;">${esc(x.initials)}</div>
        <div style="flex:1;">
          <div style="font-size:15px;font-weight:700;color:#111820;">${esc(x.name)}</div>
          <div style="font-size:12px;color:#8d8d8d;">${esc(x.role)} · ${esc(x.phone || 'No phone')}</div>
        </div>
      </div>`).join("");

    return `
      <div style="margin-bottom:20px;">
        <div class="serif" style="font-size:19px;font-weight:600;color:#111820;margin-bottom:12px;">${esc(sec.title)}</div>
        <div style="background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px -10px rgba(17,24,32,.2);">${memberRows || emptyRow("No members yet")}</div>
      </div>`;
  }).join("");

  return `<div class="screen" style="background:#ffffff;">
    <div id="scrollable-container" class="scr fill" onscroll="app.handleScroll(this)" style="flex:1;min-height:0;background:#f4f6f9;padding:0 0 140px;overflow-y:auto;">
      <div id="ptr-indicator"><div class="ptr-spinner"></div><span>Pull to refresh...</span></div>
      <div style="background:#ffffff;color:#2b2b2b;padding:calc(16px + env(safe-area-inset-top)) 22px 16px;display:flex;align-items:center;gap:14px;">
        <div onclick="app.backHome()" style="cursor:pointer;flex-shrink:0;width:38px;height:38px;border-radius:50%;background:#f4f6f9;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -8px rgba(17,24,32,.2);">${I.back}</div>
        <div>${header}</div>
      </div>
      <div style="padding:0 22px;margin-top:10px;">${sectionsHtml || emptyRow("No groups yet")}</div>
    </div>
  </div>`;
}

SCREENS.group = groupScreen;
</script>
