<script>
/* ==========================================================================
   GROUP & ATTENDANCE — the member roster (with a mentor "all groups"
   overview) and the take-attendance bottom sheet.
   Entering this screen is handled by the bottom nav (app.goGroup in Core).
   ========================================================================== */

function groupScreen(){
  if (!DATA) return `<div class="screen"></div>`;
  const isMentor = DATA.user && DATA.user.role && DATA.user.role.toLowerCase() === "mentor";

  if (isMentor && DATA.allGroups && DATA.allGroups.length > 0) {
    const groupsHtml = DATA.allGroups.map(grp => {
      const memberItems = grp.members.map(m => `
        <div style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #f2f2f2;">
          <div style="width:38px;height:38px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#ffffff;">${esc(m.initials)}</div>
          <div style="flex:1;">
            <div style="font-size:14px;font-weight:600;color:#111820;">${esc(m.name)}</div>
            <div style="font-size:12px;color:#8d8d8d;">${esc(m.role)} · ${esc(m.phone || 'No phone')}</div>
          </div>
        </div>`).join("");

      return `
        <div style="margin-bottom:20px;">
          <div class="serif" style="font-size:18px;font-weight:700;color:#1c3249;margin-bottom:8px;padding-left:4px;">${esc(grp.name)}</div>
          <div style="background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px -10px rgba(17,24,32,.15);">${memberItems || '<div style="padding:20px;text-align:center;color:#8d8d8d;">No members in this group</div>'}</div>
        </div>`;
    }).join("");

    return `<div class="screen" style="background:#f2f2f2;">
      <div style="flex-shrink:0;background:#f2f2f2;color:#111820;padding:calc(16px + env(safe-area-inset-top)) 22px 16px;display:flex;align-items:center;gap:14px;">
      <div onclick="app.backHome()" style="cursor:pointer;width:38px;height:38px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -8px rgba(17,24,32,.2);">${I.back}</div>
      <div>
        <div style="font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#8d8d8d;">MENTOR OVERVIEW</div>
        <div class="serif" style="font-size:24px;font-weight:600;color:#111820;">All Life Groups</div>
      </div>
    </div>
      <div id="scrollable-container" class="scr fill" onscroll="app.handleScroll(this)" style="padding:0 22px 140px;overflow-y:auto;-webkit-overflow-scrolling:touch;">
        <div id="ptr-indicator"><div class="ptr-spinner"></div><span>Pull to refresh...</span></div>
        <div style="margin-top:10px;">${groupsHtml}</div>
      </div>
    </div>`;
  }

  const g = DATA.group;
  const memberRows = (DATA.members || []).map(x => `
    <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid #d1d1d1;">
      <div style="width:44px;height:44px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#ffffff;">${esc(x.initials)}</div>
      <div style="flex:1;">
        <div style="font-size:15px;font-weight:600;color:#111820;">${esc(x.name)}</div>
        <div style="font-size:13px;color:#8d8d8d;">${esc(x.role)} · ${esc(x.phone || 'No phone')}</div>
      </div>
    </div>`).join("");

  return `<div class="screen" style="background:#f2f2f2;">
    <div style="flex-shrink:0;background:#f2f2f2;color:#111820;padding:calc(16px + env(safe-area-inset-top)) 22px 20px;">
      <div style="font-size:13px;color:#8d8d8d;font-weight:500;">MY LIFE GROUP</div>
      <div class="serif" style="font-size:28px;font-weight:600;letter-spacing:-.5px;margin-top:2px;">${esc(g.name || "Life Group")}</div>
    </div>
    <div id="scrollable-container" class="scr fill" onscroll="app.handleScroll(this)" style="padding:0 0 140px;overflow-y:auto;-webkit-overflow-scrolling:touch;">
      <div id="ptr-indicator"><div class="ptr-spinner"></div><span>Pull to refresh...</span></div>
      <div style="padding:0 22px;margin-top:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div class="serif" style="font-size:19px;font-weight:600;color:#111820;">Members</div>
          <div onclick="app.openAttendance()" style="cursor:pointer;font-size:13px;font-weight:600;color:#ffffff;background:#2563eb;padding:8px 14px;border-radius:100px;box-shadow:0 4px 12px rgba(37,99,235,0.3);">Take attendance</div>
        </div>
        <div style="background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px -10px rgba(17,24,32,.2);">${memberRows || emptyRow("No members yet")}</div>
      </div>
    </div>
  </div>`;
}

function attendanceSheet(){ if (!S.attendanceOpen) return ""; return `<div class="sheet-backdrop"><div class="sheet" style="padding-bottom:calc(30px + env(safe-area-inset-bottom));"><div class="grab"></div><div onclick="app.closeAttendance()" style="cursor:pointer;color:#8d8d8d;margin-bottom:10px;">Cancel</div><div onclick="app.saveAttendance()" style="margin-top:10px;height:48px;background:#2563eb;color:#ffffff;display:flex;align-items:center;justify-content:center;border-radius:14px;cursor:pointer;font-weight:600;box-shadow:0 8px 20px rgba(37,99,235,0.4);">Save Attendance</div></div></div>`; }

SCREENS.group = groupScreen;

Object.assign(window.app, {
  openAttendance: () => { S.attendanceOpen = true; S.attMarks = {}; DATA.members.forEach(m => S.attMarks[m.name] = !!m.present); render(); },
  closeAttendance: () => { S.attendanceOpen = false; render(); },
  toggleAtt: (name) => { S.attMarks[name] = !S.attMarks[name]; render(); },
  saveAttendance: () => {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.saveAttendance(S.attMarks);
    }
    DATA.members.forEach(m => { m.present = !!S.attMarks[m.name]; });
    S.attendanceOpen = false; render();
  }
});
</script>
