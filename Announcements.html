<script>
/* ==========================================================================
   ANNOUNCEMENTS — the horizontal carousel on Home, the full list ("See All"),
   the single-announcement detail view, and its share sheet.
   Kept as its own module so announcement markup lives in one place.
   ========================================================================== */

function announcementImage(a, unavailableFontSize){
  return a.imgUrl
    ? `<img src="${esc(a.imgUrl)}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" alt="Announcement"/><div style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:${unavailableFontSize}px;color:#8d8d8d;background:#e2e2e2;">Image unavailable</div>`
    : `<span style="font-family:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:${unavailableFontSize}px;color:#8d8d8d;">No image</span>`;
}

function renderAnnouncements(){
  const annCards = (DATA.announcements || []).map((a, i) => {
    return `
      <div onclick="app.openAnnouncement(${i})" style="cursor:pointer;flex:0 0 210px;border-radius:16px;overflow:hidden;background:#ffffff;box-shadow:0 6px 20px -14px rgba(5,28,44,.4);">
        <div style="position:relative;aspect-ratio:16/10;background:#e6edf4;display:flex;align-items:center;justify-content:center;overflow:hidden;">
          ${announcementImage(a, 11)}
          <span style="position:absolute;top:10px;left:10px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#ffffff;background:#2f76f4;padding:4px 9px;border-radius:100px;z-index:2;">${esc(a.tag)}</span>
        </div>
        <div style="padding:12px 14px 14px;">
          <div style="font-size:14px;font-weight:600;color:#333d4a;line-height:1.3;">${esc(a.title)}</div>
          <div style="font-size:12px;color:#94a3af;margin-top:5px;">${esc(a.time)}</div>
        </div>
      </div>`;
  }).join("");

  return `<div style="margin-top:30px;">
      <div style="padding:0 22px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div class="serif" style="font-size:20px;font-weight:700;color:#333d4a;">Announcements</div>
        <div onclick="app.goAnnouncements()" style="cursor:pointer;font-size:14px;font-weight:600;color:#2f76f4;">See All</div>
      </div>
      <div class="scr" style="display:flex;gap:14px;overflow-x:auto;padding:0 22px 4px;">${annCards || '<div style="padding:10px 22px;color:#94a3af;font-size:14px;">No announcements</div>'}</div>
    </div>`;
}

function announcementsScreen(){
  if (!DATA) return `<div class="screen"></div>`;
  const cards = (DATA.announcements || []).map((a, i) => `
    <div onclick="app.openAnnouncement(${i})" style="cursor:pointer;background:#ffffff;border-radius:16px;padding:12px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px -12px rgba(17,24,32,.15);">
      <div style="position:relative;width:64px;height:64px;flex-shrink:0;border-radius:13px;background:#e2e2e2;display:flex;align-items:center;justify-content:center;overflow:hidden;">
        ${announcementImage(a, 8)}
      </div>
      <div style="flex:1;min-width:0;">
        <span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#2563eb;background:#eff6ff;padding:3px 9px;border-radius:100px;margin-bottom:6px;">${esc(a.tag)}</span>
        <div style="font-size:15px;font-weight:700;color:#111820;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(a.title)}</div>
        <div style="font-size:12px;color:#8d8d8d;margin-top:4px;">Posted ${esc(a.time)}</div>
      </div>
      <div style="flex-shrink:0;color:#8d8d8d;">${I.chev}</div>
    </div>`).join("");

  return `<div class="screen" style="background:#ffffff;">
    <div id="scrollable-container" class="scr fill" onscroll="app.handleScroll(this)" style="flex:1;min-height:0;background:#f4f6f9;padding:0 0 calc(30px + env(safe-area-inset-bottom));overflow-y:auto;">
      <div id="ptr-indicator"><div class="ptr-spinner"></div><span>Pull to refresh...</span></div>
      <div style="background:#ffffff;color:#2b2b2b;padding:calc(16px + env(safe-area-inset-top)) 22px 16px;display:flex;align-items:center;gap:14px;">
        <div onclick="app.backHome()" style="cursor:pointer;width:38px;height:38px;border-radius:50%;background:#f4f6f9;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -8px rgba(17,24,32,.2);flex-shrink:0;">${I.back}</div>
        <div>
          <div class="serif" style="font-size:26px;font-weight:700;letter-spacing:-.4px;">Announcement</div>
          <div style="font-size:14px;color:#8f8a80;margin-top:3px;">Keep track of important updates</div>
        </div>
      </div>
      <div style="padding:0 22px;display:flex;flex-direction:column;gap:10px;">${cards || emptyRow("No announcements yet")}</div>
    </div>
  </div>`;
}

function announcementDetailScreen(){
  const a = S.selectedAnnouncement || {};
  const paragraphs = String(a.detail || "No further details provided.")
    .split(/\n{2,}/)
    .map(p => `<div style="font-size:15px;color:#475569;line-height:1.55;white-space:pre-line;">${esc(p)}</div>`)
    .join("");

  return `<div class="screen" style="background:#f4f6f9;">
    <div id="announcementScroll" class="scr fill" onscroll="app.handleAnnouncementScroll(this)" style="background:#f4f6f9;overflow-y:auto;padding-bottom:calc(40px + env(safe-area-inset-bottom));">
      <div style="position:relative;aspect-ratio:16/10;background:#e2e2e2;display:flex;align-items:center;justify-content:center;overflow:hidden;">
        ${announcementImage(a, 13)}
        <div onclick="app.backAnnouncements()" style="cursor:pointer;position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px;width:38px;height:38px;border-radius:50%;background:rgba(17,24,32,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;">${I.back.replace('stroke="#111820"','stroke="#ffffff"')}</div>
        <div onclick="app.openAnnouncementShare()" style="cursor:pointer;position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;width:38px;height:38px;border-radius:50%;background:rgba(17,24,32,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>
        </div>
      </div>

      <div style="padding:0 22px;margin-top:-26px;position:relative;">
        <div style="background:#ffffff;border-radius:20px;padding:20px;box-shadow:0 10px 30px -16px rgba(17,24,32,.3);">
          <span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#2563eb;background:#eff6ff;padding:4px 11px;border-radius:100px;">${esc(a.tag || "Update")}</span>
          <div class="serif" style="font-size:22px;font-weight:700;line-height:1.25;color:#111820;margin-top:12px;">${esc(a.title)}</div>
          <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:#8d8d8d;margin-top:12px;padding-top:12px;border-top:1px solid #f2f2f2;">${I.cal.replace('stroke="#2563eb"','stroke="currentColor"')} Posted ${esc(a.time)}</div>
        </div>
      </div>

      <div style="padding:22px 42px 0;display:flex;flex-direction:column;gap:14px;">${paragraphs}</div>
    </div>
  </div>`;
}

/* Mounted globally by render() (see Core), like the other sheets — overlayAnim
   must run before the early return so the flag clears once the sheet closes. */
function announcementShareSheet(){
  const anim = overlayAnim("announcementShare", S.announcementShareOpen);
  if (!S.announcementShareOpen) return "";
  const a = S.selectedAnnouncement || {};

  return `<div class="sheet-backdrop${anim}" onclick="app.closeAnnouncementShare()">
    <div class="sheet${anim}" onclick="event.stopPropagation()" style="padding-bottom:calc(30px + env(safe-area-inset-bottom));">
      <div class="grab"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <div onclick="app.closeAnnouncementShare()" style="cursor:pointer;font-size:15px;color:#8d8d8d;">Cancel</div>
        <div class="serif" style="font-size:18px;font-weight:700;color:#111820;">Share</div>
        <div style="width:44px;"></div>
      </div>

      <div style="border:1px solid #d1d1d1;border-radius:18px;overflow:hidden;background:#f2f2f2;">
        <div style="position:relative;aspect-ratio:16/9;background:#e2e2e2;display:flex;align-items:center;justify-content:center;overflow:hidden;">${announcementImage(a, 12)}</div>
        <div style="padding:16px 18px 18px;">
          <div class="serif" style="font-size:18px;font-weight:600;color:#111820;">"${esc(a.title)}"</div>
          <div style="font-size:14px;color:#404040;line-height:1.55;margin-top:8px;">${esc(truncate(a.detail || "", 160))}</div>
        </div>
      </div>

      <div style="display:flex;gap:12px;margin-top:20px;">
        <div onclick="app.copyAnnouncementShare()" style="cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div style="width:54px;height:54px;border-radius:50%;background:#f2f2f2;display:flex;align-items:center;justify-content:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111820" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"></rect><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path></svg>
          </div>
          <span style="font-size:12px;color:#404040;">${S.announcementShareCopied ? "Copied!" : "Copy"}</span>
        </div>
        <div onclick="app.nativeShareAnnouncement()" style="cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div style="width:54px;height:54px;border-radius:50%;background:#eff6ff;display:flex;align-items:center;justify-content:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><path d="M8 7l4-4 4 4"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg>
          </div>
          <span style="font-size:12px;color:#404040;">More</span>
        </div>
      </div>
    </div>
  </div>`;
}

/* "<Image>\n\n"Title"\n\nDetails" — a plain-text clipboard can't carry a real
   image, so the image URL stands in for it when there is one. */
function buildAnnouncementShareText(a){
  const lines = [];
  if (a.imgUrl) lines.push(a.imgUrl);
  lines.push(`"${a.title || ""}"`);
  lines.push(a.detail || "");
  return lines.join("\n\n");
}

/* navigator.clipboard needs a secure, focused, top-level context that this
   Apps Script iframe can't reliably guarantee — falls back to the
   copy-via-offscreen-textarea trick, which works even where the async API is blocked. */
function copyTextFallback(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(ta);
}

SCREENS.announcements = announcementsScreen;
SCREENS.announcementDetail = announcementDetailScreen;

Object.assign(window.app, {
  goAnnouncements: () => go("announcements"),
  backAnnouncements: () => go("announcements"),

  openAnnouncement: (i) => {
    const ann = (DATA.announcements || [])[i];
    if (!ann) return;
    if (!S.selectedAnnouncement || S.selectedAnnouncement.id !== ann.id) {
      S.announcementScrollTop = 0;
    }
    S.selectedAnnouncement = ann;
    go("announcementDetail");
  },

  handleAnnouncementScroll: (el) => { S.announcementScrollTop = el.scrollTop; },

  openAnnouncementShare: () => { S.announcementShareCopied = false; S.announcementShareOpen = true; render(); },
  closeAnnouncementShare: () => { S.announcementShareOpen = false; render(); },

  copyAnnouncementShare: () => {
    const text = buildAnnouncementShareText(S.selectedAnnouncement || {});
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => copyTextFallback(text));
      } else {
        copyTextFallback(text);
      }
    } catch(e) {
      copyTextFallback(text);
    }
    S.announcementShareCopied = true;
    render();
    setTimeout(() => { S.announcementShareCopied = false; render(); }, 1800);
  },

  nativeShareAnnouncement: () => {
    const a = S.selectedAnnouncement || {};
    const text = buildAnnouncementShareText(a);
    if (navigator.share) {
      navigator.share({ title: a.title || "Announcement", text: text, url: a.imgUrl || undefined }).catch(() => {});
    } else {
      window.app.copyAnnouncementShare();
    }
  }
});
</script>
