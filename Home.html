<script>
/* ==========================================================================
   HOME — the dashboard: greeting, "now studying" hero, verse, quick actions,
   announcements (rendered by the Announcements module), and next session.
   ========================================================================== */

function quickAction(fn, label, badge, iconName){
  return `<div onclick="app.${fn}()" style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="position:relative;width:52px;height:52px;border-radius:16px;background:#ffffff;display:flex;align-items:center;justify-content:center;border:1px solid #d1d1d1;">
      ${micon(iconName, 26, "#2563eb")}
      ${badge ? `<div style="position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:100px;background:#ef4444;color:#ffffff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #f2f2f2;">!</div>` : ""}
    </div>
    <span style="font-size:11px;font-weight:500;color:#404040;text-align:center;line-height:1.2;">${label}</span>
  </div>`;
}

function homeScreen(){
  if (!DATA) return `<div class="screen"></div>`;
  const u = DATA.user, su = DATA.serviceUpdate, v = DATA.verse;

  const hero = su && su.enabled
    ? `<div onclick="app.goEvents()" style="cursor:pointer;position:relative;overflow:hidden;border-radius:20px;background:#1c3249;color:#ffffff;padding:22px;min-height:170px;">
        <div style="position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);"></div>
        <div style="font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#60a5fa;">Now studying</div>
        <div class="serif" style="font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.5px;margin-top:6px;">${esc(su.theme)}</div>
        <div style="font-size:14px;font-weight:600;margin-top:12px;">${esc(su.module)}</div>
        <div style="font-size:13px;color:#d1d1d1;margin-top:3px;line-height:1.4;">${esc(su.note)}</div>
      </div>`
    : `<div onclick="app.goEvents()" style="cursor:pointer;position:relative;overflow:hidden;border-radius:20px;background:#ffffff;border:1px solid #d1d1d1;padding:22px;min-height:120px;display:flex;align-items:center;gap:15px;">
        <div style="width:44px;height:44px;flex-shrink:0;border-radius:13px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8d8d8d" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9H4Z"/></svg></div>
        <div>
          <div style="font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#8d8d8d;">Now studying</div>
          <div class="serif" style="font-size:19px;font-weight:600;color:#404040;margin-top:5px;line-height:1.25;">No upcoming update</div>
        </div>
      </div>`;

  const verseCard = (v && (v.text || v.ref)) ? `<div style="padding:0 22px;margin-top:16px;"><div style="border-radius:16px;background:#ffffff;padding:16px 18px;box-shadow:0 4px 16px -12px rgba(17,24,32,.25); display:flex; gap:14px; align-items:flex-start;">
    <div style="width:40px;height:40px;border-radius:12px;background:#eff6ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#2563eb;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg>
    </div>
    <div>
      <div style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#2563eb;">${esc(v.label||"Verse of the month")}</div>
      <div class="serif" style="font-size:15px;color:#111820;line-height:1.5;margin-top:5px;">“${esc(v.text)}”</div>
      <div style="font-size:12px;font-weight:600;color:#2563eb;margin-top:6px;">${esc(v.ref)}</div>
    </div>
  </div></div>` : "";

  const ne = DATA.nextEvent || { title: "Life Group Gathering", date: "Upcoming", time: "Upcoming", location: "TBD", summary: "Check back for updates", badge: "UPCOMING" };
  const nextSection = `<div style="padding:0 22px;margin-top:28px;margin-bottom:20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div class="serif" style="font-size:20px;font-weight:700;color:#111820;">Next session</div>
        <div onclick="app.goEvents()" style="cursor:pointer;font-size:14px;font-weight:600;color:#2563eb;">See All</div>
      </div>
      <div onclick="app.openNextEvent()" style="cursor:pointer;position:relative;overflow:hidden;border-radius:20px;background:#1c3249;color:#ffffff;padding:22px;">
        <div style="position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);"></div>
        <span style="font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#1c3249;background:#f4d03f;padding:4px 10px;border-radius:100px;">${esc(ne.badge)}</span>
        <div class="serif" style="font-size:20px;font-weight:600;margin-top:12px;line-height:1.3;">${esc(ne.date)} · ${esc(ne.time)} · ${esc(ne.title)}</div>
        <div style="font-size:13px;color:#d1d1d1;margin-top:6px;line-height:1.4;">${esc(truncate(ne.summary||"Life Group Gathering", 150))}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;color:#60a5fa;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg> ${esc(ne.location)}</div>
      </div>
    </div>`;

  const hasUnsubmittedPulse = DATA.pulse && !DATA.pulse.submitted;

  const notifUnread = (DATA.notifications || []).filter(n => !n.read).length;
  const notifCountLabel = notifUnread > 9 ? "9+" : String(notifUnread);
  const notifBell = `<div onclick="app.goNotifications()" style="position:relative;cursor:pointer;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:#ffffff;">
      ${micon("notifications", 22)}
      ${notifUnread > 0 ? `<span style="position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:100px;background:#ef4444;color:#ffffff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #111820;">${notifCountLabel}</span>` : ""}
    </div>`;

  return `<div class="screen" style="background:#111820;">
    <div style="flex-shrink:0;background:#111820;color:#ffffff;padding:calc(16px + env(safe-area-inset-top)) 22px 20px;display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-size:13px;color:#8d8d8d;">${esc(u.greetingDate)}</div>
        <div style="font-size:23px;font-weight:700;letter-spacing:-.3px;margin-top:2px;">Hi ${esc(u.name)}</div>
      </div>
      ${notifBell}
    </div>
    <div id="scrollable-container" class="scr fill" onscroll="app.handleScroll(this)" style="background:#f2f2f2;padding:20px 0 120px;overflow-y:auto;-webkit-overflow-scrolling:touch;">
      <div id="ptr-indicator">
        <div class="ptr-spinner"></div>
        <span>Pull to refresh...</span>
      </div>
      <div style="padding:0 22px;">${hero}</div>
      ${verseCard}
      <div style="padding:0 22px;margin-top:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
        ${quickAction("goGroup", "My Group", false, "groups")}
        ${quickAction("openCommunity", "Prayer", false, "volunteer_activism")}
        ${quickAction("goPulse", "Pulse<br/>Check", hasUnsubmittedPulse, "monitor_heart")}
        ${quickAction("goResources", "Resources", false, "menu_book")}
      </div>
      ${renderAnnouncements()}
      ${nextSection}
    </div>
  </div>`;
}

SCREENS.home = homeScreen;
</script>
