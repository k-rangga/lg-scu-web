<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSG Internal Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff;font-family:'Geist',"Helvetica Neue",Helvetica,Arial,sans-serif;color:#333d4a;}
a{color:#2f76f4;text-decoration:none;}a:hover{color:#1d4ed8;}
input,textarea,button,select{font-family:inherit;}
input,textarea{box-sizing:border-box;}
input:focus,textarea:focus{outline:none;border-color:#2f76f4 !important;}
button{border:none;background:none;cursor:pointer;padding:0;color:inherit;}
button:disabled{cursor:not-allowed;}
.hov-soft:hover{background:#f4f6f9 !important;}
.hov-danger:hover{background:#fdecec !important;}
.hov-primary:hover{background:#1d4ed8 !important;}
.row-click:hover{background:#f9fbfd;}
.main{flex:1;min-width:0;padding:24px 40px 60px;box-sizing:border-box;}
@media (max-width:760px){.main{padding:20px 16px 48px;}}
.boot{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8b98ac;font-size:15px;}
</style>
</head>
<body>
<div id="root"><div class="boot">Loading…</div></div>
<script>
/* If anything stops the app from starting, say so instead of leaving "Loading…" up. */
window.__bootFail = function (msg) {
  var r = document.getElementById("root");
  if (r && !window.__appStarted) r.innerHTML = '<div class="boot" style="flex-direction:column;gap:8px;padding:24px;text-align:center;"><div style="color:#d94545;font-weight:600;">The console couldn\'t start.</div><div style="font-size:13px;max-width:560px;word-break:break-word;"></div></div>',
    r.querySelector("div div:last-child").textContent = String(msg);
};
setTimeout(function () {
  if (!window.__appStarted) window.__bootFail("Startup stalled — library: " + (typeof htmPreact) + ", app script ran: " + !!window.__appScriptRan + ", ready: " + document.readyState + (window.__appError ? ", error: " + window.__appError : ""));
}, 6000);
window.addEventListener("error", function (e) { window.__bootFail((e.message || "Script error") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "")); });
</script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js" onerror="window.__bootFail('Could not load the interface library from cdn.jsdelivr.net.')"></script>
<?!= include('AdminApp'); ?>
</body>
</html>
