<script>
/* ==========================================================================
   ADMIN CONSOLE — client
   A port of the "Admin Console" design prototype onto Preact (htm, no build
   step). State and derived values follow the prototype's renderVals(); the
   difference is that data comes from and goes to AdminServer.js instead of
   localStorage, and pulse answers are the real ones.
   ========================================================================== */
window.__appScriptRan = true;
(function () {
  if (typeof htmPreact === "undefined") return window.__bootFail("The interface library did not load.");
  const { html, render, Component } = htmPreact;
  const AUTH = "scu-admin-console-auth";

  const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  const run = (fn, ...args) => new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });

  /* ---- Time, always in the script's timezone ---------------------------- */
  function zparts(ms, tz, opts) {
    const o = {};
    new Intl.DateTimeFormat("en-US", Object.assign({ timeZone: tz }, opts)).formatToParts(new Date(ms)).forEach(p => { o[p.type] = p.value; });
    return o;
  }
  // "Mon, 22 Sep · 9:14 AM"
  function fmtMs(ms, tz) {
    if (!ms) return "Not set";
    const p = zparts(ms, tz, { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit", hour12: true });
    return `${p.weekday}, ${p.day} ${p.month} · ${p.hour}:${p.minute} ${p.dayPeriod}`;
  }
  function fmtDay(ymd) {
    const [y, m, d] = ymd.split("-").map(Number);
    const p = zparts(Date.UTC(y, m - 1, d, 12), "UTC", { weekday: "short", day: "numeric", month: "short" });
    return `${p.weekday}, ${p.day} ${p.month}`;
  }
  // "14 Sept – 27 Sept"
  function fmtRange(a, b) {
    const f = ymd => { const [y, m, d] = ymd.split("-").map(Number); return new Intl.DateTimeFormat("en-GB", { timeZone: "UTC", day: "numeric", month: "short" }).format(new Date(Date.UTC(y, m - 1, d, 12))); };
    return a && b ? `${f(a)} – ${f(b)}` : a ? f(a) : "Not set";
  }
  /* Mirrors moduleProblem_ in AdminServer.js so Save is disabled before the
     server would refuse. */
  function moduleProblem(d, others, today) {
    if (!d.theme.trim() || !d.module.trim()) return "";
    if (!d.start || !d.end) return "";
    if (d.end < d.start) return "The end date must be on or after the start date.";
    const clash = others.find(o => o.start && o.end && d.start <= o.end && o.start <= d.end);
    if (clash) return `Dates overlap with ${clash.module || clash.theme} (${fmtRange(clash.start, clash.end)}).`;
    if (d.enabled && !(d.start <= today && today <= d.end)) return "Show on Home is only possible while today is within the module's dates.";
    return "";
  }
  // "4 PM", "7:30 PM" for calendar chips.
  function fmtShort(t) {
    const [h, m] = String(t).split(":").map(Number);
    return `${h % 12 || 12}${m ? ":" + String(m).padStart(2, "0") : ""} ${h >= 12 ? "PM" : "AM"}`;
  }
  // "Mon 28 Sep" and the day-diff between two yyyy-MM-dd dates.
  function fmtDayShort(ymd) { return fmtDay(ymd).replace(",", ""); }
  function dayDiff(a, b) {
    const t = x => { const [y, m, d] = x.split("-").map(Number); return Date.UTC(y, m - 1, d); };
    return Math.round((t(b) - t(a)) / 86400000);
  }
  // Rendered width of a string, for sizing a column to its longest label.
  const measureCanvas = document.createElement("canvas").getContext("2d");
  function textWidth(text, font) { measureCanvas.font = font; return Math.ceil(measureCanvas.measureText(String(text)).width); }
  const isOnline = loc => /meet|zoom|https?:/i.test(String(loc || ""));
  const evKey = e => [e.title, e.date, e.start, e.location, e.group].join("|");
  const setKey = e => [e.title, e.date, e.start, e.location].join("|");
  function fmt12(t) {
    const [h, m] = String(t).split(":").map(Number);
    return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h >= 12 ? "PM" : "AM"}`;
  }
  function tzOffset(ms, tz) {
    const o = zparts(ms, tz, { hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric" });
    return Date.UTC(+o.year, +o.month - 1, +o.day, +o.hour % 24, +o.minute, +o.second) - Math.floor(ms / 1000) * 1000;
  }
  function wallMs(ymd, hm, tz) {
    if (!ymd) return NaN;
    const [y, m, d] = ymd.split("-").map(Number), [hh, mm] = (hm || "00:00").split(":").map(Number);
    const guess = Date.UTC(y, m - 1, d, hh, mm);
    return guess - tzOffset(guess - tzOffset(guess, tz), tz);
  }
  function todayYmd(ms, tz) {
    return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(ms));
  }

  function detect(url) {
    let u; try { u = new URL(url); } catch (e) { return ""; }
    const h = u.hostname.replace(/^www\./, ""), p = u.pathname;
    if (/\.pdf$/i.test(p)) return "PDF";
    if (/youtube\.com|youtu\.be/.test(h)) return "YouTube";
    if (h === "docs.google.com" && p.startsWith("/presentation")) return "Google Slides";
    if (h === "docs.google.com" && p.startsWith("/document")) return "Google Docs";
    if (h === "docs.google.com" && p.startsWith("/spreadsheets")) return "Google Sheets";
    if (h === "drive.google.com") return "Drive";
    if (/canva\.com/.test(h)) return "Canva";
    return "Website";
  }
  const host = url => { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return url; } };
  const primaryBtn = (off, full) => ({ height: full ? 52 : 44, padding: "0 20px", borderRadius: full ? 14 : 10, fontSize: full ? 16 : 14, fontWeight: 600, background: off ? "#e4ebf2" : "#2f76f4", color: off ? "#8b98ac" : "#ffffff", cursor: off ? "not-allowed" : "pointer" });
  const chip = on => ({ height: 32, padding: "0 14px", borderRadius: 100, fontSize: 13, fontWeight: 600, background: on ? "#2f76f4" : "#f4f6f9", color: on ? "#ffffff" : "#5b6b86" });
  const empty = {
    ann: { title: "", tag: "", time: "", imgUrl: "", detail: "" },
    res: { title: "", group: "", fileUrl: "" },
    ev: { title: "", group: "", date: "", start: "19:00", end: "", location: "", detail: "", link: "" },
    q: { text: "", type: "scale" },
  };
  const SC = ["#d94545", "#f0a8a8", "#dfe5ec", "#8fbcff", "#2f76f4"], SCT = ["#ffffff", "#7a1f1f", "#333d4a", "#123a7a", "#ffffff"], SCL = ["1 · Not at all", "2", "3 · Somewhat", "4", "5 · Very"];
  // Built from parts: Apps Script strips slash-star comments when serving,
  // and would treat a literal image-slash-star as the start of one.
  const IMG_ACCEPT = "image/" + "*";
  // Same image as the browser-tab icon (setFaviconUrl in AdminServer.js), 128px.
  const LOGO_URL = "https:" + "/" + "/lh3.googleusercontent.com/d/17-3NVNtoneKapt_mJMzMXEK7EVuRC_RE=s128";
  const INPUT = "height:46px;border:1.5px solid #e4ebf2;border-radius:10px;padding:0 14px;font-size:15px;color:#111820;background:#ffffff;";
  const AREA = "border:1.5px solid #e4ebf2;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5;color:#111820;resize:vertical;";

  /* ---- Icons -------------------------------------------------------------- */
  const NAV_ICONS = {
    module: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2z"></path><path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"></path></svg>`,
    verse: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"></path><path d="M12 6v8M8.5 9h7"></path></svg>`,
    ann: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"></path><path d="M15 9a3 3 0 0 1 0 6"></path><path d="M18 6a7 7 0 0 1 0 12"></path></svg>`,
    events: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>`,
    res: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>`,
    pulse: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5h3.4l1.9-5 3.4 10 2.4-7 1.3 2H21"></path></svg>`,
  };

  const Field = ({ label, children, style }) => html`
    <div style=${Object.assign({ display: "flex", flexDirection: "column", gap: 8 }, style || {})}>
      <div style="font-size:14px;font-weight:600;">${label}</div>
      ${children}
    </div>`;

  class App extends Component {
    constructor() {
      super();
      const a = lsGet(AUTH);
      this.token = a && a.token || "";
      this.offset = 0;
      this.state = {
        boot: !!this.token, authed: false, email: a && a.email || "", password: "", showPw: false, loginErr: "", signingIn: false,
        section: "ann", sub: "all", query: "", sort: null, sideOpen: true, drawer: null, toast: "", toastErr: false, pulseId: null,
        verseDraft: null, data: null, busy: false, evView: "list", calMonth: "", evAud: "all", evPulse: true, evPastOpen: null, evOpenSet: "", evPanel: "", pendingDel: null, delHidden: [], ovGroup: "all",
        grpOpen: false, grpQuery: "", imgDrag: false, tick: 0,
      };
    }

    componentDidMount() {
      if (this.token) {
        const early = window.__resume; window.__resume = null;
        (early || run("adminResume", this.token)).then(r => {
          if (r && r.success) this.setData(r.data, { authed: true, boot: false });
          else { this.token = ""; lsSet(AUTH, null); this.setState({ boot: false, loginErr: r && !r.expired ? r.message : "" }); }
        }).catch(() => this.setState({ boot: false, loginErr: "Couldn't reach the server. Check your connection and try again." }));
      }
      // Event Upcoming/Past labels; pulse status has its own exact-time timer.
      // Best effort: a delete still waiting on Undo is sent if the page closes.
      window.addEventListener("pagehide", () => this.commitDelete());
      this._iv = setInterval(() => this.setState(s => ({ tick: s.tick + 1 })), 30000);
    }
    componentWillUnmount() { clearInterval(this._iv); clearTimeout(this._flip); clearTimeout(this._t); }

    now() { return Date.now() + this.offset; }

    setData(data, extra) {
      this.offset = data.serverNow - Date.now();
      this.setState(Object.assign({ data }, extra || {}), () => this.scheduleFlip());
    }

    /* Re-renders at the next pulse open/close instant so the status flips on time. */
    scheduleFlip() {
      clearTimeout(this._flip);
      const d = this.state.data; if (!d) return;
      const n = this.now();
      const next = d.pulses.reduce((m, p) => [p.openMs, p.closeMs].reduce((mm, t) => (t > n && t < mm ? t : mm), m), Infinity);
      if (next === Infinity) return;
      this._flip = setTimeout(() => { this.setState(s => ({ tick: s.tick + 1 })); this.scheduleFlip(); }, Math.min(next - n + 50, 2147483000));
    }

    toastMsg(msg, err) {
      clearTimeout(this._t);
      this.setState({ toast: msg, toastErr: !!err });
      this._t = setTimeout(() => this.setState({ toast: "" }), err ? 6000 : 3000);
    }

    async mutate(fn, args, msg, patch) {
      if (this.state.busy) return;
      this.setState({ busy: true });
      try {
        const r = await run(fn, this.token, ...args);
        if (!r || !r.success) {
          if (r && r.expired) return this.signOut(r.message);
          this.setState({ busy: false });
          return this.toastMsg((r && r.message) || "Something went wrong.", true);
        }
        this.setData(r.data, Object.assign({ busy: false }, patch ? patch(r) : {}));
        this.toastMsg(msg);
      } catch (e) {
        this.setState({ busy: false });
        this.toastMsg("Couldn't save — " + ((e && e.message) || "network error"), true);
      }
    }

    signOut(msg) {
      if (this.token) run("adminLogout", this.token).catch(() => {});
      this.token = ""; lsSet(AUTH, null);
      this.setState({ authed: false, data: null, password: "", drawer: null, loginErr: msg || "", pulseId: null, section: "ann", sub: "all", busy: false, verseDraft: null });
    }

    open(kind, idx, draft, expect) { this.setState({ drawer: { kind, idx, draft, expect }, grpOpen: false, grpQuery: "" }); }

    /* ---- Events page ------------------------------------------------------
       Copies of one event (same title, date, start and location, one per
       group) are shown as a single "set". Pulse check periods are listed and
       drawn alongside; they ignore the audience filter but not search. */
    eventsModel(D0, tz, NOW, ro, fmtDt) {
      const S = this.state, today = todayYmd(NOW, tz), q = S.query.trim().toLowerCase();
      const kelompok = D0.groups.map(g => g.name);
      const hidden = new Set(S.delHidden || []);
      const aud = S.evAud;
      const evs = D0.events.filter(e => !hidden.has(evKey(e)))
        .filter(e => aud === "all" || e.group === aud)
        .filter(e => !q || [e.title, e.detail, e.location, e.group].join(" ").toLowerCase().includes(q));
      const byKey = {}, sets = [];
      evs.forEach(e => { const k = setKey(e); if (!byKey[k]) { byKey[k] = { key: k, copies: [] }; sets.push(byKey[k]); } byKey[k].copies.push(e); });
      sets.forEach(st => {
        st.copies.sort((a, b) => a.group.localeCompare(b.group, undefined, { numeric: true }));
        const e = st.copies[0], n = st.copies.length;
        Object.assign(st, {
          type: "event", title: e.title, date: e.date, start: e.start, end: e.end, location: e.location, detail: e.detail, n,
          past: !!e.date && e.date < today,
          label: n === 1 ? e.group : kelompok.length && kelompok.every(k => st.copies.some(c => c.group === k)) ? `All ${kelompok.length} kelompok` : `${n} groups`,
          special: n === 1 && (e.group === "All groups" || e.group === "Mentors only"),
        });
      });
      const pulses = !S.evPulse ? [] : D0.pulses
        .filter(p => p.openDate && p.closeDate && (!q || p.windowTitle.toLowerCase().includes(q)))
        .map(p => {
          const state = p.openMs && NOW < p.openMs ? "sched" : p.closeMs && NOW > p.closeMs ? "closed" : "open";
          return { type: "pulse", key: "pulse:" + p.id, pulse: p, title: p.windowTitle, date: p.openDate, start: p.openTime, state, past: state === "closed" };
        });
      const items = sets.concat(pulses), at = i => i.date + (i.start || "");
      const openPulse = D0.pulses.find(p => p.openMs && p.openMs <= NOW && (!p.closeMs || NOW <= p.closeMs));
      return {
        today, tz, NOW, ro, fmtDt, kelompok, sets, pulses, openPulse,
        upcoming: items.filter(i => !i.past).sort((a, b) => at(a).localeCompare(at(b))),
        past: items.filter(i => i.past).sort((a, b) => at(b).localeCompare(at(a))),
        nUp: sets.filter(x => !x.past).length, nPast: sets.filter(x => x.past).length,
      };
    }

    /* Deletes hide the rows at once and reach the sheet 4 seconds later,
       unless Undo is pressed. A second delete commits the first right away. */
    startDelete(copies, label) {
      if (this.state.pendingDel) this.commitDelete();
      const keys = copies.map(evKey);
      const pd = { keys, label, copies: copies.map(c => ({ row: c.row, title: c.title, date: c.date, start: c.start, location: c.location, group: c.group })) };
      this._delTimer = setTimeout(() => this.commitDelete(), 4000);
      this.setState(s => ({ pendingDel: pd, delHidden: (s.delHidden || []).concat(keys), evPanel: "", evOpenSet: "" }));
    }
    undoDelete() {
      clearTimeout(this._delTimer);
      const pd = this.state.pendingDel; if (!pd) return;
      this.setState(s => ({ pendingDel: null, delHidden: (s.delHidden || []).filter(k => pd.keys.indexOf(k) === -1) }));
    }
    commitDelete() {
      clearTimeout(this._delTimer);
      const pd = this.state.pendingDel; if (!pd) return;
      this.setState({ pendingDel: null });
      const unhide = extra => this.setState(s => Object.assign({ delHidden: (s.delHidden || []).filter(k => pd.keys.indexOf(k) === -1) }, extra || {}));
      this._delChain = (this._delChain || Promise.resolve()).then(() => run("adminDeleteEvents", this.token, pd.copies).then(r => {
        if (r && r.success) { this.offset = r.data.serverNow - Date.now(); unhide({ data: r.data }); }
        else if (r && r.expired) this.signOut(r.message);
        else { unhide(); this.toastMsg((r && r.message) || "Couldn't delete the event.", true); }
      }).catch(() => { unhide(); this.toastMsg("Couldn't reach the server — nothing was deleted.", true); }));
    }

    renderEvents(M) {
      const S = this.state, today = M.today;
      const ymdParts = ymd => { const [y, m, d] = ymd.split("-").map(Number); return zparts(Date.UTC(y, m - 1, d, 12), "UTC", { weekday: "short", month: "short", day: "numeric" }); };
      const openSingle = c => this.open("ev", c.row, Object.assign({}, empty.ev, c), c.title);
      const openBulk = st => st.n > 1 ? this.setState({ evPanel: "", drawer: { kind: "ev", idx: -2, bulk: st.copies, draft: Object.assign({}, empty.ev, st.copies[0]) }, grpOpen: false }) : openSingle(st.copies[0]);
      const delSet = st => this.startDelete(st.copies, st.n > 1 ? `Deleted ${st.n} events` : "Event deleted");
      const openPulseEdit = p => this.open("pulse", p.id, { windowTitle: p.windowTitle, openDate: p.openDate, openTime: p.openTime || "08:00", closeDate: p.closeDate, closeTime: p.closeTime || "21:00" });
      const delPulse = p => { if (!this.state.busy && confirm(`Delete "${p.windowTitle}"?`)) this.mutate("adminDeletePulse", [p.id], "Pulse check deleted"); };

      const I = {
        clock: html`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>`,
        pin: html`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>`,
        video: html`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3z"></path></svg>`,
        pulse: html`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5h3.4l1.9-5 3.4 10 2.4-7 1.3 2H21"></path></svg>`,
        edit: html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg>`,
        trash: html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>`,
        chev: open => html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style=${{ transform: open ? "rotate(180deg)" : "none", transition: "transform .15s", flexShrink: 0 }}><path d="M6 9l6 6 6-6"></path></svg>`,
        list: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg>`,
        cal: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>`,
      };
      const chipCol = (kind, past) => past ? ["#f0f2f7", "#8b98ac"] : kind === "pulse" ? ["#e6f4ea", "#15803d"] : kind === "special" ? ["#fff4e0", "#b45309"] : ["#cae7ff", "#2f76f4"];
      const groupChip = (label, kind, past) => { const [bg, fg] = chipCol(kind, past); return html`<span title=${label} style=${{ display: "inline-block", maxWidth: 150, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontSize: 13, fontWeight: 600, background: bg, color: fg, borderRadius: 100, padding: "4px 12px" }}>${label}</span>`; };
      const copyKind = c => c.group === "All groups" || c.group === "Mentors only" ? "special" : "kelompok";
      const pill = (text, solid, tint) => html`<span style=${{ flexShrink: 0, fontSize: 12, fontWeight: 600, borderRadius: 100, padding: "2px 9px", whiteSpace: "nowrap", background: solid ? solid : tint[0], color: solid ? "#ffffff" : tint[1] }}>${text}</span>`;
      const iconBtn = (icon, title, danger, onClick) => html`<button class=${danger ? "ev-del" : "ev-edit"} title=${title} aria-label=${title} onClick=${e => { e.stopPropagation(); onClick(); }} style="width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#8b98ac;flex-shrink:0;">${icon}</button>`;
      const textBtn = (label, danger, onClick) => html`<button class=${danger ? "ev-del" : "ev-edit"} onClick=${e => { e.stopPropagation(); onClick(); }} style=${{ height: 30, padding: "0 10px", borderRadius: 8, fontSize: 13, fontWeight: 600, color: danger ? "#d94545" : "#2f76f4" }}>${label}</button>`;
      const dateBlock = (ymd, colors) => { const p = ymdParts(ymd); return html`<div style=${{ width: 56, height: 56, borderRadius: 12, background: colors[0], color: colors[1], display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
        <div style="font-size:11px;font-weight:600;letter-spacing:.04em;">${p.month.toUpperCase()}</div>
        <div style="font-size:22px;font-weight:600;line-height:1.1;">${p.day}</div></div>`; };
      const rowStyle = extra => Object.assign({ display: "flex", flexWrap: "wrap", alignItems: "center", columnGap: 20, rowGap: 10, padding: "14px 20px" }, extra || {});
      const metaLine = (icon, text, color) => html`<div style=${{ display: "flex", alignItems: "center", gap: 7, fontSize: 14, color: color || "#5b6b86", minWidth: 0 }}><span style="display:flex;flex-shrink:0;color:#8b98ac;">${icon}</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${text}</span></div>`;

      const eventRow = st => {
        const past = st.past, open = S.evOpenSet === st.key, p = st.date ? ymdParts(st.date) : null;
        const d = st.date ? dayDiff(today, st.date) : null;
        const rel = past || d === null ? null : d === 0 ? pill("Today", "#2f76f4") : d === 1 ? pill("Tomorrow", null, ["#e6f4ea", "#15803d"]) : d < 7 ? pill(`In ${d} days`, null, ["#e6f4ea", "#15803d"]) : null;
        return html`<div key=${st.key} style="border-top:1px solid #f0f2f7;">
          <div onClick=${() => st.n > 1 && this.setState({ evOpenSet: open ? "" : st.key })} class=${st.n > 1 ? "row-click" : ""} style=${rowStyle({ cursor: st.n > 1 ? "pointer" : "default" })}>
            ${st.date ? dateBlock(st.date, past ? ["#f4f6f9", "#8b98ac"] : ["#eef5ff", "#2f76f4"]) : html`<div style="width:56px;height:56px;border-radius:12px;background:#f4f6f9;flex-shrink:0;"></div>`}
            <div style="flex:1 1 240px;min-width:200px;display:flex;flex-direction:column;gap:4px;">
              <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                <div style=${{ fontSize: 16, fontWeight: 600, color: past ? "#5b6b86" : "#1c3249", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", minWidth: 0 }}>${st.title}</div>
                ${rel}
              </div>
              ${st.detail && html`<div style="font-size:14px;color:#8b98ac;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${st.detail}</div>`}
            </div>
            <div style="flex:0 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px;">
              ${metaLine(I.clock, p ? p.weekday + (st.start ? " · " + fmt12(st.start) : "") : "No date")}
              ${st.location && metaLine(isOnline(st.location) ? I.video : I.pin, st.location)}
            </div>
            <div style="flex:0 0 170px;display:flex;align-items:center;gap:6px;color:#8b98ac;min-width:0;">
              ${groupChip(st.label, st.special ? "special" : "kelompok", past)}
              ${st.n > 1 && I.chev(open)}
            </div>
            <div style="display:flex;gap:4px;margin-left:auto;">
              ${iconBtn(I.edit, st.n > 1 ? `Edit all ${st.n}` : "Edit", false, () => openBulk(st))}
              ${iconBtn(I.trash, st.n > 1 ? `Delete all ${st.n}` : "Delete", true, () => delSet(st))}
            </div>
          </div>
          ${open && html`<div style="background:#f9fbfd;border-top:1px solid #f0f2f7;padding:8px 20px 10px 96px;display:flex;flex-direction:column;">
            ${st.copies.map(c => html`<div key=${evKey(c)} style="display:flex;align-items:center;gap:10px;padding:5px 0;">
              ${groupChip(c.group, copyKind(c), past)}
              <div style="flex:1;"></div>
              ${textBtn("Edit", false, () => openSingle(c))}
              ${textBtn("Remove", true, () => this.startDelete([c], "Removed " + c.group))}
            </div>`)}
          </div>`}
        </div>`;
      };

      const pulseRow = it => {
        const p = it.pulse, st = it.state;
        const colors = st === "open" ? ["#e6f4ea", "#15803d"] : st === "sched" ? ["#eef5ff", "#2f76f4"] : ["#f4f6f9", "#8b98ac"];
        const untilOpen = dayDiff(today, p.openDate), untilClose = dayDiff(today, p.closeDate);
        const rel = st === "open" ? pill("Open now", "#15803d")
          : st === "sched" ? pill(untilOpen <= 0 ? "Opens today" : untilOpen === 1 ? "Opens tomorrow" : `Opens in ${untilOpen} days`, null, ["#eef5ff", "#2f76f4"]) : null;
        const second = st === "open" ? (untilClose <= 0 ? `Closes tonight, ${fmt12(p.closeTime || "23:59")}` : `Closes in ${untilClose} ${untilClose === 1 ? "day" : "days"} · ${fmt12(p.closeTime || "23:59")}`)
          : st === "sched" ? `Opens ${fmt12(p.openTime || "00:00")}` : "Closed";
        return html`<div key=${it.key} style=${{ borderTop: "1px solid #f0f2f7", background: st === "open" ? "#fbfefc" : "transparent" }}>
          <div style=${rowStyle()}>
            ${dateBlock(p.openDate, colors)}
            <div style="flex:1 1 240px;min-width:200px;display:flex;flex-direction:column;gap:4px;">
              <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                <div style=${{ fontSize: 16, fontWeight: 600, color: st === "closed" ? "#5b6b86" : "#1c3249", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", minWidth: 0 }}>${p.windowTitle}</div>
                ${rel}
              </div>
              <div style="font-size:14px;color:#8b98ac;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Members submit their weekly check-in</div>
            </div>
            <div style="flex:0 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px;">
              ${metaLine(I.clock, `${fmtDayShort(p.openDate)} → ${fmtDayShort(p.closeDate)}`)}
              ${metaLine(I.pulse, second, st === "open" ? "#15803d" : null)}
            </div>
            <div style="flex:0 0 170px;display:flex;align-items:center;">${groupChip("All members", "pulse", st === "closed")}</div>
            <div style="display:flex;gap:4px;margin-left:auto;">
              ${!M.ro && iconBtn(I.edit, "Edit pulse check", false, () => openPulseEdit(p))}
              ${!M.ro && iconBtn(I.trash, "Delete pulse check", true, () => delPulse(p))}
            </div>
          </div>
        </div>`;
      };
      const itemRow = it => it.type === "pulse" ? pulseRow(it) : eventRow(it);

      const countPill = n => html`<span style="font-size:12px;font-weight:600;color:#5b6b86;background:#f4f6f9;border-radius:100px;padding:2px 9px;">${n}</span>`;
      const sectionHead = (label, n, toggle, open) => html`<div onClick=${toggle} style=${{ display: "flex", alignItems: "center", gap: 10, padding: "14px 20px", cursor: toggle ? "pointer" : "default" }}>
        <div style="font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5b6b86;">${label}</div>${countPill(n)}
        ${toggle && html`<div style="margin-left:auto;display:flex;color:#8b98ac;">${I.chev(open)}</div>`}</div>`;
      const pastOpen = S.evPastOpen === null ? M.upcoming.length === 0 : S.evPastOpen;
      const card = "border:1px solid #e4ebf2;border-radius:16px;overflow:hidden;background:#ffffff;";
      const nothing = !M.upcoming.length && !M.past.length;

      // Calendar: Monday-first month grid; one chip per set; pulse periods as bars.
      const calView = (() => {
        if (S.evView !== "cal") return null;
        const month = S.calMonth || today.slice(0, 7), [cy, cm] = month.split("-").map(Number);
        const iso = (y, m, d) => new Date(Date.UTC(y, m - 1, d)).toISOString().slice(0, 10);
        const lead = (new Date(Date.UTC(cy, cm - 1, 1)).getUTCDay() + 6) % 7, daysIn = new Date(Date.UTC(cy, cm, 0)).getUTCDate();
        const weeks = Math.ceil((lead + daysIn) / 7), byDay = {};
        M.sets.forEach(st => { if (st.date) (byDay[st.date] = byDay[st.date] || []).push(st); });
        Object.keys(byDay).forEach(k => byDay[k].sort((a, b) => (a.start || "").localeCompare(b.start || "")));
        const shift = n => new Date(Date.UTC(cy, cm - 1 + n, 1)).toISOString().slice(0, 7);
        const barCol = { open: ["#d7f0de", "#15803d"], sched: ["#e3eefe", "#2f76f4"], closed: ["#eceff4", "#8b98ac"] };
        const stateWord = { open: "open", sched: "scheduled", closed: "closed" };
        const cells = [];
        for (let i = 0; i < weeks * 7; i++) { const date = iso(cy, cm, 1 - lead + i); cells.push({ date, i, day: Number(date.slice(8)), inMonth: date.slice(0, 7) === month }); }
        const legendDot = (bg, border) => html`<span style=${{ width: 12, height: 12, borderRadius: 3, background: bg, borderLeft: border ? "3px solid " + border : "none", display: "inline-block", boxSizing: "border-box" }}></span>`;
        return html`<div style=${card + "overflow-x:auto;"}>
          <div style="min-width:760px;">
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid #e4ebf2;">
              <div style="font-size:18px;font-weight:600;color:#1c3249;">${new Intl.DateTimeFormat("en-US", { timeZone: "UTC", month: "long", year: "numeric" }).format(new Date(Date.UTC(cy, cm - 1, 1)))}</div>
              <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:#5b6b86;">
                <span style="display:flex;align-items:center;gap:6px;white-space:nowrap;">${legendDot("#eef5ff", "#2f76f4")}Upcoming</span>
                <span style="display:flex;align-items:center;gap:6px;white-space:nowrap;">${legendDot("#f0f2f7", "#b4bfcd")}Past</span>
                <span style="display:flex;align-items:center;gap:6px;white-space:nowrap;">${legendDot("#d7f0de")}Pulse check open</span>
                <span style="display:flex;align-items:center;gap:6px;white-space:nowrap;"><span style="font-size:11px;font-weight:700;background:#ffffff;border:1px solid #e4ebf2;border-radius:100px;padding:0 6px;color:#1c3249;">×7</span>= same event for several groups</span>
              </div>
              <div style="flex:1;"></div>
              <button class="hov-soft" onClick=${() => this.setState({ calMonth: today.slice(0, 7) })} style="height:36px;padding:0 14px;border-radius:9px;border:1px solid #e4ebf2;font-size:14px;font-weight:600;color:#333d4a;">Today</button>
              <button class="hov-soft" onClick=${() => this.setState({ calMonth: shift(-1) })} aria-label="Previous month" style="width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333d4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
              <button class="hov-soft" onClick=${() => this.setState({ calMonth: shift(1) })} aria-label="Next month" style="width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333d4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #e4ebf2;">
              ${["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"].map(dn => html`<div key=${dn} style="padding:10px 12px;font-size:12px;font-weight:700;letter-spacing:.02em;color:#1c3249;">${dn}</div>`)}
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);">
              ${cells.map(c => {
                const bars = M.pulses.filter(it => it.pulse.openDate <= c.date && c.date <= it.pulse.closeDate);
                const isToday = c.date === today, isPast = c.date < today;
                return html`<div key=${c.date} onClick=${() => this.open("ev", -1, Object.assign({}, empty.ev, { date: c.date, group: S.evAud !== "all" ? S.evAud : "" }))} title=${"New event on " + fmtDay(c.date)} class="cal-cell"
                  style=${{ minHeight: 112, padding: "8px 8px 10px", boxSizing: "border-box", cursor: "pointer", borderTop: c.i >= 7 ? "1px solid #f0f2f7" : "none", borderLeft: c.i % 7 ? "1px solid #f0f2f7" : "none", background: c.inMonth ? "#ffffff" : "#f9fbfd", display: "flex", flexDirection: "column", gap: 4, minWidth: 0 }}>
                  <div style=${{ alignSelf: "flex-start", width: 28, height: 28, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 600, background: isToday ? "#2f76f4" : "transparent", color: isToday ? "#ffffff" : !c.inMonth || isPast ? "#b4bfcd" : "#333d4a" }}>${c.day}</div>
                  ${bars.map(it => {
                    const p = it.pulse, first = c.date === p.openDate, last = c.date === p.closeDate, [bg, fg] = barCol[it.state];
                    const showLabel = first || c.i % 7 === 0;
                    return html`<div key=${it.key} title=${`${p.windowTitle}: ${fmtMs(p.openMs, M.tz)} → ${fmtMs(p.closeMs, M.tz)}`}
                      onClick=${e => { e.stopPropagation(); this.setState({ section: "pulse", pulseId: p.id, sub: M.ro ? "overview" : "questions", query: "", sort: null, ovGroup: "all" }); }}
                      style=${{ height: 22, background: bg, color: fg, marginLeft: first ? 0 : -9, marginRight: last ? 0 : -8, borderRadius: first && last ? 6 : first ? "6px 0 0 6px" : last ? "0 6px 6px 0" : 0, display: "flex", alignItems: "center", gap: 5, padding: showLabel ? "0 8px" : 0, fontSize: 12, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", cursor: "pointer" }}>
                      ${showLabel && html`<span style="display:flex;flex-shrink:0;">${I.pulse}</span><span style="overflow:hidden;text-overflow:ellipsis;">Pulse · ${p.windowTitle} · ${stateWord[it.state]}</span>`}
                    </div>`;
                  })}
                  ${(byDay[c.date] || []).map(st => html`<button key=${st.key} onClick=${e => { e.stopPropagation(); this.setState({ evPanel: st.key }); }} title=${st.title + (st.n > 1 ? ` · ${st.label}` : "")}
                    style=${{ display: "flex", gap: 5, alignItems: "center", width: "100%", textAlign: "left", padding: "3px 6px", borderRadius: 6, fontSize: 12, background: st.past ? "#f0f2f7" : "#eef5ff", color: st.past ? "#8b98ac" : "#1c3249", borderLeft: "3px solid " + (st.past ? "#b4bfcd" : "#2f76f4"), overflow: "hidden", whiteSpace: "nowrap", boxSizing: "border-box" }}>
                    ${st.start && html`<span style="font-weight:700;flex-shrink:0;">${fmtShort(st.start)}</span>`}
                    <span style="overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;">${st.title}</span>
                    ${st.n > 1 && html`<span style="flex-shrink:0;font-size:11px;font-weight:700;background:#ffffff;border-radius:100px;padding:0 6px;color:#1c3249;">×${st.n}</span>`}
                  </button>`)}
                </div>`;
              })}
            </div>
          </div>
        </div>`;
      })();

      const audChip = (value, label) => { const on = S.evAud === value; return html`<button key=${value} onClick=${() => this.setState({ evAud: value, evOpenSet: "" })} style=${{ height: 36, padding: "0 14px", borderRadius: 100, fontSize: 14, fontWeight: 600, whiteSpace: "nowrap", background: on ? "#1c3249" : "#ffffff", color: on ? "#ffffff" : "#333d4a", border: "1px solid " + (on ? "#1c3249" : "#e4ebf2") }}>${label}</button>`; };
      const kOn = M.kelompok.indexOf(S.evAud) !== -1;
      const segBtn = (on, icon, label, onClick) => html`<button onClick=${onClick} style=${{ height: 34, padding: "0 12px", borderRadius: 8, display: "flex", alignItems: "center", gap: 6, fontSize: 14, fontWeight: 600, whiteSpace: "nowrap", background: on ? "#eef5ff" : "transparent", color: on ? "#2f76f4" : "#5b6b86" }}>${icon}${label}</button>`;

      return html`
        <div style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:4px 0 22px;">
          <div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px;">
            <div style="font-size:32px;font-weight:600;letter-spacing:-.6px;color:#1c3249;">Events</div>
            <div style="font-size:14px;color:#5b6b86;">${M.nUp} upcoming · ${M.nPast} past${M.openPulse ? ` · ${M.openPulse.windowTitle} is open` : ""}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="display:flex;gap:2px;padding:3px;border:1px solid #e4ebf2;border-radius:11px;height:42px;box-sizing:border-box;align-items:center;">
              ${segBtn(S.evView !== "cal", I.list, "List", () => this.setState({ evView: "list" }))}
              ${segBtn(S.evView === "cal", I.cal, "Calendar", () => this.setState({ evView: "cal" }))}
            </div>
            <button class="hov-primary" onClick=${() => this.open("ev", -1, Object.assign({}, empty.ev, { group: S.evAud !== "all" ? S.evAud : "" }))} style="height:42px;padding:0 16px;border-radius:10px;background:#2f76f4;color:#ffffff;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New event
            </button>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:18px;">
          ${audChip("all", "All events")}${audChip("All groups", "All groups")}${audChip("Mentors only", "Mentors only")}
          <select value=${kOn ? S.evAud : ""} onChange=${e => this.setState({ evAud: e.target.value || "all", evOpenSet: "" })}
            style=${{ height: 36, padding: "0 14px", borderRadius: 100, fontSize: 14, fontWeight: 600, whiteSpace: "nowrap", cursor: "pointer", background: kOn ? "#1c3249" : "#ffffff", color: kOn ? "#ffffff" : "#333d4a", border: "1px solid " + (kOn ? "#1c3249" : "#e4ebf2") }}>
            <option value="">Kelompok…</option>
            ${M.kelompok.map(k => html`<option key=${k} value=${k}>${k}</option>`)}
          </select>
          <button onClick=${() => this.setState({ evPulse: !S.evPulse })} style=${{ height: 36, padding: "0 14px", borderRadius: 100, fontSize: 14, fontWeight: 600, whiteSpace: "nowrap", display: "flex", alignItems: "center", gap: 6, background: S.evPulse ? "#e6f4ea" : "#ffffff", color: S.evPulse ? "#15803d" : "#5b6b86", border: "1px solid " + (S.evPulse ? "#15803d" : "#e4ebf2") }}>${I.pulse}Pulse check periods</button>
          <div style="margin-left:auto;display:flex;align-items:center;gap:8px;height:36px;width:280px;max-width:100%;border:1px solid #e4ebf2;border-radius:100px;padding:0 14px;box-sizing:border-box;background:#ffffff;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5b6b86" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            <input value=${S.query} onInput=${e => this.setState({ query: e.target.value })} placeholder="Search events" style="flex:1;min-width:0;border:none;font-size:14px;color:#111820;background:transparent;outline:none;" />
          </div>
        </div>

        ${calView || (nothing ? html`
          <div style="border:1.5px dashed #d5dde7;border-radius:16px;padding:70px 20px;text-align:center;display:flex;flex-direction:column;gap:6px;">
            <div style="font-size:16px;font-weight:600;color:#333d4a;">No events match</div>
            <div style="font-size:14px;color:#8b98ac;">Try another group or search term.</div>
          </div>` : html`
          <div style="display:flex;flex-direction:column;gap:16px;">
            <div style=${card}>${sectionHead("Upcoming", M.upcoming.length)}${M.upcoming.map(itemRow)}
              ${!M.upcoming.length && html`<div style="border-top:1px solid #f0f2f7;padding:18px 20px;font-size:14px;color:#8b98ac;">Nothing coming up.</div>`}</div>
            ${M.past.length > 0 && html`<div style=${card}>${sectionHead("Past", M.past.length, () => this.setState({ evPastOpen: !pastOpen }), pastOpen)}${pastOpen && M.past.map(itemRow)}</div>`}
          </div>`)}
      `;
    }

    /* Side panel for one event set, opened from a calendar chip. */
    renderEventPanel(M) {
      const S = this.state, st = M && M.sets.find(x => x.key === S.evPanel);
      if (!st) return null;
      const close = () => this.setState({ evPanel: "" });
      const p = st.date ? zparts(Date.UTC(...st.date.split("-").map((v, i) => i === 1 ? Number(v) - 1 : Number(v)), 12), "UTC", { weekday: "short", day: "numeric", month: "short" }) : null;
      const chip = c => { const special = c.group === "All groups" || c.group === "Mentors only"; return html`<span style=${{ fontSize: 13, fontWeight: 600, borderRadius: 100, padding: "4px 12px", whiteSpace: "nowrap", background: st.past ? "#f0f2f7" : special ? "#fff4e0" : "#cae7ff", color: st.past ? "#8b98ac" : special ? "#b45309" : "#2f76f4" }}>${c.group}</span>`; };
      const editOne = c => this.setState({ evPanel: "" }, () => this.open("ev", c.row, Object.assign({}, empty.ev, c), c.title));
      const editAll = () => st.n > 1
        ? this.setState({ evPanel: "", drawer: { kind: "ev", idx: -2, bulk: st.copies, draft: Object.assign({}, empty.ev, st.copies[0]) }, grpOpen: false })
        : editOne(st.copies[0]);
      return html`
        <div onClick=${close} style="position:fixed;inset:0;background:rgba(28,50,73,.28);z-index:10;"></div>
        <div style="position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;background:#ffffff;box-shadow:-20px 0 50px -20px rgba(5,28,44,.35);display:flex;flex-direction:column;z-index:11;">
          <div style="display:flex;align-items:flex-start;gap:12px;padding:22px 24px 18px;border-bottom:1px solid #e4ebf2;">
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;">
              <div style="font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8b98ac;">${st.n > 1 ? `Same event · ${st.n} groups` : st.copies[0].group}</div>

      ${S.toast && html`
        <div role="status" style=${{ position: "fixed", top: 16, right: 16, width: 340, maxWidth: "calc(100vw - 32px)", boxSizing: "border-box", background: "#ffffff", border: "1.5px solid " + (S.toastErr ? "#d94545" : "#2f76f4"), borderRadius: 12, padding: "16px 16px 16px 18px", display: "flex", alignItems: "flex-start", gap: 12, boxShadow: "0 10px 30px -12px rgba(5,28,44,.35)", zIndex: 20 }}>
          <div style=${{ width: 22, height: 22, borderRadius: "50%", background: S.toastErr ? "#d94545" : "#2f76f4", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            ${S.toastErr
              ? html`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"><path d="M12 6v8M12 18v.5"></path></svg>`
              : html`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>`}
          </div>
          <div style="flex:1;font-size:15px;font-weight:600;color:#111820;">${S.toast}</div>
          <button onClick=${() => this.setState({ toast: "" })} aria-label="Dismiss" style="width:22px;height:22px;display:flex;align-items:center;justify-content:center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333d4a" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>`}
      `;
    }
  }

  const root = document.getElementById("root");
  root.innerHTML = "";
  try { render(html`<${App} />`, root); window.__appStarted = true; }
  catch (err) { window.__appError = String(err && err.stack || err); window.__bootFail(window.__appError); }
})();
</script>
