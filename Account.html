<style>
/* ---------- Account screen animations ---------- */
@keyframes slideInRight {
  from { transform: translateX(100%); }
  to   { transform: translateX(0); }
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes spin { to { transform: rotate(360deg); } }

.acc-spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.35);
  border-top-color: #ffffff;
  animation: spin .7s linear infinite;
}
.acc-input::placeholder { color: #a9b4c4; }
.acc-input:focus { border-color: #2f76f4; outline: none; }

@media (prefers-reduced-motion: reduce) {
  .acc-anim, .acc-anim * { animation: none !important; }
}
</style>

<script>
/* ==========================================================================
   UI INTERACTION SYSTEM
   ========================================================================== */

function uiClick() {
  // Empty function to prevent errors on existing inline onclick attributes
}


/* ==========================================================================
   ACCOUNT — welcome, login, profile view, profile edit.
   Auth + the user's own account details.
   ========================================================================== */

var ATHEME = {
  blue:      "#2f76f4",
  blueDark:  "#1e5fd0",
  navy:      "#112378",
  ink:       "#333d4a",
  bg:        "#f4f6f9", // Updated to match new layout background
  card:      "#ffffff",
  muted:     "#8b98ac",
  line:      "#f0f2f7",
  border:    "#dfe4ee",
  tint:      "#cae7ff",
  danger:    "#ef4947",
  dangerLine:"#f2c4bb"
};

var A_EASE = "cubic-bezier(.22,1,.36,1)";
var A_BG   = "https://lh3.googleusercontent.com/d/1D0e7jPS0qPhrOsnsYLsPuith8EyM2LTF=s0";

var PROFILE_ICONS = {
  email: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f76f4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M4 6.5l8 6 8-6"></path></svg>`,
  phone: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f76f4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 14 10 20 18.5 20a1.5 1.5 0 0 0 1.5-1.3l.4-2.6a1.2 1.2 0 0 0-.8-1.3l-3-1a1.2 1.2 0 0 0-1.3.4l-.9 1.1a11 11 0 0 1-4.4-4.4l1.1-.9a1.2 1.2 0 0 0 .4-1.3l-1-3a1.2 1.2 0 0 0-1.3-.8L5.3 4A1.5 1.5 0 0 0 4 5.5Z"></path></svg>`,
  birthday: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f76f4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>`,
  church: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f76f4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v5"></path><path d="M9.5 4.5h5"></path><path d="M5 21V10l7-4 7 4v11"></path><path d="M5 21h14"></path><path d="M10 21v-4a2 2 0 0 1 4 0v4"></path></svg>`,
  occupation: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f76f4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"></rect><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7"></path><path d="M3 12h18"></path></svg>`,
  password: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f76f4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><path d="M12 15v2"></path></svg>`,
  back: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333d4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>`
};

/* Backend sends birthday as ISO yyyy-MM-dd (what <input type="date"> needs);
   the profile view instead shows it as DD-MM-YYYY. */
function formatBirthdayDisplay(iso) {
  if (!iso) return "";
  const parts = String(iso).split("-");
  if (parts.length !== 3) return iso;
  const [y, m, d] = parts;
  return `${d}-${m}-${y}`;
}

/* riseIn helper — returns the animation rule only on first mount of login. */
function riseIn(delay) {
  return S._loginAnim ? `animation:riseIn .55s ${delay}s both ${A_EASE};` : "";
}

/* ---------------------------------------------------------------- WELCOME */
function welcomeScreen(){
  const T = ATHEME;
  return `<div class="screen" style="background-color:${T.navy};background-image:url('${A_BG}');background-position:center top;background-size:cover;background-repeat:no-repeat;display:flex;flex-direction:column;justify-content:flex-end;padding:0 34px calc(46px + env(safe-area-inset-bottom));">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#ffffff;">
    </div>
    <button onclick="uiClick(); app.goLogin()"
      onmouseover="this.style.background='${T.blueDark}'"
      onmouseout="this.style.background='${T.blue}'"
      style="width:100%;height:54px;border:none;border-radius:14px;background:${T.blue};color:#ffffff;font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 14px 34px -10px rgba(47,118,244,.85);transition:background .25s;">Connect</button>
  </div>`;
}

function restoringScreen(){
  const T = ATHEME;
  return `<div class="screen" style="background-color:${T.navy};background-image:url('${A_BG}');background-position:center top;background-size:cover;background-repeat:no-repeat;display:flex;flex-direction:column;justify-content:flex-end;padding:0 34px calc(46px + env(safe-area-inset-bottom));">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#ffffff;">
    </div>
    <div style="text-align:center;font-size:15px;font-weight:500;color:rgba(255,255,255,.85);">Signing you in…</div>
  </div>`;
}

/* ------------------------------------------------------------------ LOGIN */
function loginScreen(){
  const T = ATHEME;

  const btnContent = S.isSigningIn
    ? `<span style="display:flex;align-items:center;justify-content:center;gap:10px;"><span class="acc-spinner"></span><span>Signing you in…</span></span>`
    : `Sign in`;

  const label = (t) => `<div style="font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:${T.muted};margin-bottom:8px;">${t}</div>`;
  const field = `width:100%;height:52px;border-radius:14px;border:1px solid ${T.border};background:#ffffff;color:${T.navy};font-size:16px;padding:0 16px;transition:border-color .2s;`;

  const slide = S._loginAnim ? `animation:slideInRight .5s ${A_EASE};` : "";

  const html = `<div class="screen" style="overflow:hidden;background:#f4f6f9;">
    <div class="acc-anim" style="position:absolute;inset:0;display:flex;flex-direction:column;padding:0 34px;background:#f4f6f9;color:${T.navy};${slide}">

      <div onclick="uiClick(); go('welcome')" style="position:absolute;top:calc(20px + env(safe-area-inset-top));left:24px;cursor:pointer;width:38px;height:38px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -8px rgba(5,28,44,.4);z-index:2;">${PROFILE_ICONS.back}</div>

      <div class="scr fill" style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:60px 0 0;">

        <div style="width:62px;height:62px;border-radius:19px;background:${T.blue};display:flex;align-items:center;justify-content:center;margin-bottom:28px;box-shadow:0 16px 34px -12px rgba(47,118,244,.5);${riseIn(".06")}">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 6c-2-2-5-2-7-1v13c2-1 5-1 7 1 2-2 5-2 7-1V5c-2-1-5-1-7 1"></path></svg>
        </div>

        <div style="font-family:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:34px;font-weight:600;line-height:1.1;letter-spacing:-.5px;color:${T.navy};${riseIn(".12")}">Welcome back</div>

        <div style="font-size:16px;color:#5b6b86;margin-top:10px;${riseIn(".18")}">Sign in to SCU Small Group</div>

        <div style="margin-top:38px;display:flex;flex-direction:column;gap:16px;${riseIn(".24")}">
          <div>
            ${label("Email")}
            <input type="email" class="acc-input" value="${esc(S.loginEmail)}" oninput="S.loginEmail=this.value" placeholder="you@church.sg" style="${field}"/>
          </div>
          <div>
            ${label("Password")}
            <input type="password" class="acc-input" value="${esc(S.loginPassword)}" oninput="S.loginPassword=this.value" placeholder="••••••••" style="${field}"/>
          </div>
        </div>

        <button onclick="!S.isSigningIn && (uiClick(), app.signIn())"
          style="margin-top:26px;width:100%;height:54px;border:none;border-radius:14px;background:${T.blue};color:#ffffff;font-size:17px;font-weight:600;cursor:${S.isSigningIn?'not-allowed':'pointer'};opacity:${S.isSigningIn?'.75':'1'};box-shadow:0 14px 30px -12px rgba(47,118,244,.55);${riseIn(".3")}">${btnContent}</button>

        <div onclick="uiClick(); app.forgotPassword()" style="text-align:center;margin-top:18px;font-size:14px;color:${T.muted};cursor:pointer;">Forgot password?</div>
      </div>

      <div style="flex-shrink:0;text-align:center;padding:0 0 calc(34px + env(safe-area-inset-bottom));font-size:14px;color:${T.muted};">
        New here? <span onclick="uiClick()" style="color:${T.blue};font-weight:600;cursor:pointer;">Ask your mentor for an invite</span>
      </div>
    </div>
  </div>`;

  S._loginAnim = false;   // animate on mount only
  return html;
}

/* ---------------------------------------------------------------- PROFILE */
function profileRow(label, value, action, isLast, iconSvg) {
  return `<div onclick="uiClick(); ${action}" style="display:flex;align-items:center;gap:14px;padding:14px 16px;${isLast?'':'border-bottom:1px solid #f3f4f8;'};cursor:pointer;background:#ffffff;transition:background .2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='#ffffff'">
    <div style="width:40px;height:40px;border-radius:11px;background:#cae7ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      ${iconSvg}
    </div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:12px;color:#94a3af;">${esc(label)}</div>
      <div style="font-size:15px;font-weight:600;color:#333d4a;">${esc(value)}</div>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c3d0dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 6l6 6-6 6"></path></svg>
  </div>`;
}

function profileScreen() {
  if (!DATA) return `<div class="screen"></div>`;
  const u = DATA.user;
  const email = S.currentUserEmail || u.email || "user@example.com";
  const groupName = DATA.group ? DATA.group.name : "Small Group";
  const role = u.role || "Member";
  const userInitials = getInitials(u.name);

  return `<div class="screen" style="background:#ffffff;">
    <div id="scrollable-container" class="scr fill" style="flex:1;min-height:0;overflow-y:auto;background:#f4f6f9;">
    <!-- header (kept consistent with Home: white bar, no title) -->
    <div style="background:#ffffff;padding:calc(16px + env(safe-area-inset-top)) 22px 16px;"></div>

    <div style="padding:20px 0 72px;border-radius:24px 24px 0 0;background:#f4f6f9;">
    <!-- name card -->
    <div style="padding:0 22px;">
      <div style="background:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 10px 30px -18px rgba(5,28,44,.4);display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;">
        <div style="width:88px;height:88px;border-radius:50%;background:#2f76f4;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:32px;font-weight:600;box-shadow:0 14px 30px -12px rgba(47,118,244,.7);">${esc(userInitials)}</div>
        <div style="width:100%;">
          <div style="font-family:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:24px;font-weight:600;letter-spacing:-.3px;color:#333d4a;">${esc(u.name)}</div>
          <div style="display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#2f76f4;background:#cae7ff;padding:6px 13px;border-radius:100px;">${esc(role)} · ${esc(groupName)}</div>
        </div>
      </div>
    </div>

    <!-- personal info -->
    <div style="padding:0 22px;margin-top:30px;">
      <div style="font-size:12px;font-weight:700;color:#7c8b98;letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px;">Personal info</div>
      <div style="background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px -12px rgba(5,28,44,.3);">
        ${profileRow("Email", email, "app.goProfileEdit()", false, PROFILE_ICONS.email)}
        ${profileRow("Phone", u.phone || "Add phone", "app.goProfileEdit()", false, PROFILE_ICONS.phone)}
        ${profileRow("Birthday", formatBirthdayDisplay(u.birthday) || "Add birthday", "app.goProfileEdit()", false, PROFILE_ICONS.birthday)}
        ${profileRow("Church", u.church || "Add church", "app.goProfileEdit()", false, PROFILE_ICONS.church)}
        ${profileRow("Occupation", u.occupation || "Add occupation", "app.goProfileEdit()", true, PROFILE_ICONS.occupation)}
      </div>
    </div>

    <!-- account -->
    <div style="padding:0 22px;margin-top:30px;">
      <div style="font-size:12px;font-weight:700;color:#7c8b98;letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px;">Account</div>
      <div style="background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px -12px rgba(5,28,44,.3);">
        <div onclick="uiClick(); app.goProfileEdit()" style="display:flex;align-items:center;gap:14px;padding:15px 16px;cursor:pointer;background:#fff;transition:background .2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='#fff'">
          <div style="width:40px;height:40px;border-radius:11px;background:#cae7ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            ${PROFILE_ICONS.password}
          </div>
          <div style="flex:1;"><div style="font-size:12px;color:#94a3af;">Password</div><div style="font-size:15px;font-weight:600;color:#333d4a;letter-spacing:2px;">••••••••</div></div>
          <span style="font-size:13px;font-weight:700;color:#2f76f4;">Change</span>
        </div>
      </div>
    </div>

    <!-- logout -->
    <div style="padding: 0 22px; margin-top: 36px; padding-bottom: 40px;">
      <div onclick="uiClick(); app.logout()" style="cursor:pointer;height:52px;border-radius:14px;background:#fff;border:1.5px solid #f2c4bb;color:#ef4947;display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:600;transition:background .2s;" onmouseover="this.style.background='#fffafa'" onmouseout="this.style.background='#fff'">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
        Log out
      </div>
      <div style="text-align:center;font-size:12px;color:#94a3af;margin-top:14px;">GKISCUMMERCAMP UNIVERSITY (SCU)</div>
    </div>
    </div>
    </div>
  </div>`;
}

/* ----------------------------------------------------------- PROFILE EDIT */
function profileEditRow(label, inputId, val, placeholder, isLast, iconSvg, type="text") {
  return `<div style="display:flex;align-items:center;gap:14px;padding:14px 16px;${isLast?'':'border-bottom:1px solid #f3f4f8;'}">
    <div style="width:40px;height:40px;border-radius:11px;background:#cae7ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      ${iconSvg}
    </div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:12px;color:#94a3af;">${esc(label)}</div>
      <input type="${type}" id="${inputId}" class="acc-input" value="${esc(val)}" oninput="S.${inputId}=this.value" placeholder="${esc(placeholder)}" style="width:100%;border:none;background:transparent;padding:0;font-size:15px;font-weight:600;color:#333d4a;outline:none;">
    </div>
  </div>`;
}

function profileEditScreen() {
  if (!DATA) return `<div class="screen"></div>`;
  const u = DATA.user;
  const userInitials = getInitials(S.editName || u.name);

  return `<div id="scrollable-container" class="screen scr" style="flex: 1; overflow-y: auto; padding: 0 0 72px; background: #f4f6f9; width: 100%; height: 100%;">
    <!-- header -->
    <div style="padding:calc(16px + env(safe-area-inset-top)) 22px 16px; display:flex; align-items:center; gap:14px;">
      <div onclick="uiClick(); app.backProfile()" style="cursor:pointer;width:38px;height:38px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -8px rgba(5,28,44,.4); transition:background .2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='#ffffff'">${PROFILE_ICONS.back}</div>
      <div style="font-family:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:26px;font-weight:700;letter-spacing:-.4px;color:#2b2b2b;">Edit details</div>
    </div>

    <!-- name card -->
    <div style="padding:0 22px;margin-top:6px;">
      <div style="background:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 10px 30px -18px rgba(5,28,44,.4);display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;">
        <div style="width:88px;height:88px;border-radius:50%;background:#2f76f4;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:32px;font-weight:600;box-shadow:0 14px 30px -12px rgba(47,118,244,.7);">${esc(userInitials)}</div>
        <div style="width:100%;">
          <input class="acc-input" id="editNameInput" value="${esc(S.editName)}" oninput="S.editName=this.value" placeholder="Your name" style="width:100%;min-width:0;border:none;background:transparent;padding:0;text-align:center;font-family:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:24px;font-weight:600;letter-spacing:-.3px;color:#333d4a;outline:none;">
        </div>
      </div>
    </div>

    <!-- personal info -->
    <div style="padding:0 22px;margin-top:30px;">
      <div style="font-size:12px;font-weight:700;color:#7c8b98;letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px;">Personal info</div>
      <div style="background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px -12px rgba(5,28,44,.3);">
        ${profileEditRow("Email", "editEmail", S.editEmail, "Add email", false, PROFILE_ICONS.email, "email")}
        ${profileEditRow("Phone", "editPhone", S.editPhone, "Add phone", false, PROFILE_ICONS.phone, "tel")}
        ${profileEditRow("Birthday", "editBirthday", S.editBirthday, "Add birthday", false, PROFILE_ICONS.birthday, "date")}
        ${profileEditRow("Church", "editChurch", S.editChurch, "Add church", false, PROFILE_ICONS.church, "text")}
        ${profileEditRow("Occupation", "editOccupation", S.editOccupation, "Add occupation", true, PROFILE_ICONS.occupation, "text")}
      </div>
    </div>

    <!-- account -->
    <div style="padding:0 22px;margin-top:30px;">
      <div style="font-size:12px;font-weight:700;color:#7c8b98;letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px;">Account</div>
      <div style="background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px -12px rgba(5,28,44,.3);">
        ${profileEditRow("New password", "editPassword", S.editPassword, "Leave blank to keep", true, PROFILE_ICONS.password, "password")}
      </div>
    </div>

    <!-- save -->
    <div style="padding: 0 22px; margin-top: 36px; padding-bottom: 40px;">
      <div onclick="uiClick(); app.saveProfileChanges()" style="cursor:pointer;height:52px;background:#2f76f4;color:#ffffff;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:16px;font-weight:600;box-shadow:0 10px 24px -12px rgba(47,118,244,.7);transition:background .2s;" onmouseover="this.style.background='#1e5fd0'" onmouseout="this.style.background='#2f76f4'">
        Save changes
      </div>
    </div>
  </div>`;
}

SCREENS.restoring   = restoringScreen;
SCREENS.welcome     = welcomeScreen;
SCREENS.login       = loginScreen;
SCREENS.profile     = profileScreen;
SCREENS.profileEdit = profileEditScreen;

Object.assign(window.app, {

  goLogin: () => {
    S._loginAnim = true;       // arm the mount animation
    go("login");
  },

  signIn: () => {
    const email = S.loginEmail.trim();
    const password = S.loginPassword.trim();

    if (!email || !password) {
      alert("Please enter both email and password.");
      return;
    }

    S.isSigningIn = true;
    render();

    // Verify credentials and load the full Home payload (including
    // notifications) in one call, so Home never renders before they're ready.
    google.script.run
      .withSuccessHandler((res) => {
        S.isSigningIn = false;

        if (res.success && res.data) {
          S.currentUserEmail = res.user.email;
          S.editName       = res.user.name;
          S.editEmail      = res.user.email;
          S.editPhone      = res.user.phone || "";
          S.editBirthday   = res.user.birthday || "";
          S.editChurch     = res.user.church || "";
          S.editOccupation = res.user.occupation || "";
          S.editPassword   = "";

          if (res.token) saveToken(res.token);

          DATA = res.data;
          noteServerClock(res.data);
          go("home", { skipRefresh: true });

        } else {
          alert(res.message || "Invalid email or password.");
          render();
        }
      })
      .withFailureHandler((err) => {
        S.isSigningIn = false;
        alert("Login error: " + err.message);
        render();
      })
      .verifyLogin(email, password);
  },

  forgotPassword: () => alert("Please contact your Small Group mentor to reset your password."),

  logout: () => {
    if (typeof google !== "undefined" && google.script && google.script.run) {
      const token = readToken();
      if (token) google.script.run.endSession(token);
    }
    clearToken();
    S.currentUserEmail = "";
    S.loginPassword    = "";
    S._loginAnim       = false;
    go("welcome");
  },

  goProfile: () => {
    S.editName       = DATA.user.name;
    S.editEmail      = S.currentUserEmail || DATA.user.email;
    S.editPhone      = DATA.user.phone || "";
    S.editBirthday   = DATA.user.birthday || "";
    S.editChurch     = DATA.user.church || "";
    S.editOccupation = DATA.user.occupation || "";
    S.editPassword   = "";
    go("profile");
  },
  
  goProfileEdit: () => {
    // Ensure state is populated before entering edit mode
    S.editName       = DATA.user.name;
    S.editEmail      = S.currentUserEmail || DATA.user.email;
    S.editPhone      = DATA.user.phone || "";
    S.editBirthday   = DATA.user.birthday || "";
    S.editChurch     = DATA.user.church || "";
    S.editOccupation = DATA.user.occupation || "";
    S.editPassword   = "";
    go("profileEdit");
  },
  
  backProfile: () => go("profile"),

  saveProfileChanges: () => {
    const newName       = S.editName.trim();
    const newEmail      = S.editEmail.trim();
    const newPhone      = (S.editPhone || "").trim();
    const newBirthday   = (S.editBirthday || "").trim();
    const newChurch     = (S.editChurch || "").trim();
    const newOccupation = (S.editOccupation || "").trim();
    const newPassword   = S.editPassword;

    if (!newName || !newEmail) {
      alert("Name and email cannot be empty.");
      return;
    }

    const payload = {
      oldEmail:   S.currentUserEmail,
      name:       newName,
      email:      newEmail,
      phone:      newPhone,
      birthday:   newBirthday,
      church:     newChurch,
      occupation: newOccupation,
      password:   newPassword,
      token:      readToken()
    };

    if (typeof google !== "undefined" && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((res) => {
          if (res.success) {
            S.currentUserEmail     = newEmail;
            DATA.user.name         = newName;
            DATA.user.initials     = getInitials(newName);
            DATA.user.email        = newEmail;
            DATA.user.phone        = newPhone;
            DATA.user.birthday     = newBirthday;
            DATA.user.church       = newChurch;
            DATA.user.occupation   = newOccupation;
            alert("Profile updated successfully!");
            go("profile");
          } else {
            alert("Failed to update profile: " + res.message);
          }
        })
        .updateUserProfile(payload);
    } else {
      DATA.user.name       = newName;
      DATA.user.initials   = getInitials(newName);
      DATA.user.phone      = newPhone;
      DATA.user.birthday   = newBirthday;
      DATA.user.church     = newChurch;
      DATA.user.occupation = newOccupation;
      S.currentUserEmail   = newEmail;
      go("profile");
    }
  }
});
</script>
