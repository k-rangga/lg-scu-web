<script>
/* ==========================================================================
   ATTENDANCE — the mentor's roll call for one event, opened from the card on
   the event detail screen (see attendanceCard in Events).

   Everyone starts unmarked; Save stays disabled until every member carries a
   P or an A, so a half-filled list can never be written. Saving does not wait
   on the server: the counts are applied locally and the screen pops straight
   back to the event, with the write following in the background (the pending
   entry in S is what keeps the summary from flickering back — see the merge
   in refreshData).
   ========================================================================== */

const ATT_PRESENT = "present";
const ATT_ABSENT  = "absent";

/* The mentor's own group. getData hands a mentor every user in `members` and a
   memberCount to match, so neither can be used here — the roster comes out of
   allGroups, matched on the user's groupId and falling back to the group name.
   A non-mentor (or a payload without allGroups) just gets DATA.members, which
   for them is already their own group. */
function mentorGroup(){
  const g = (DATA && DATA.group) || {};
  const name = String(g.name || "Your group");
  const groups = (DATA && DATA.allGroups) || [];
  const uid = String((DATA && DATA.user && DATA.user.groupId) || "").trim();

  const mine = groups.find(x => uid && String(x.groupId).trim() === uid)
            || groups.find(x => String(x.name || "").trim() === name.trim());

  if (mine) return { name: String(mine.name || name), members: mine.members || [] };
  if (groups.length) return { name: name, members: [] };
  return { name: name, members: (DATA && DATA.members) || [] };
}

/* Shared with the recorded-summary card in Events so the two bars can never
   disagree. Unmarked members leave a grey remainder. */
function attendanceBar(present, absent, total){
  const all = Math.max(Number(total || 0), present + absent, 1);
  const pct = n => (n / all) * 100;
  return `<div style="display:flex;height:7px;border-radius:100px;overflow:hidden;background:#e8ecf1;">
      <div style="width:${pct(present)}%;background:#16a34a;"></div>
      <div style="width:${pct(absent)}%;background:#dc2626;"></div>
    </div>`;
}

function attendanceTally(){
  const members = mentorGroup().members;
  let present = 0, absent = 0;
  members.forEach(m => {
    const st = S.attStatus[attMemberKey(m)];
    if (st === ATT_PRESENT) present++;
    else if (st === ATT_ABSENT) absent++;
  });
  return { present, absent, marked: present + absent, total: members.length };
}

/* userId is what the server stores against, but a Users row with a blank id
   would collapse every such member onto one key — fall back to the name so
   each row at least stays independent on screen. */
function attMemberKey(m){
  return String((m && m.userId) || "") || String((m && m.name) || "");
}

function attendanceIsEdit(){ return S.attMode === "edit"; }

/* How one member now differs from the saved record: "" when nothing has moved,
   otherwise "status" or "note". A member with no baseline row — they joined the
   group after the record was written — counts as changed the moment they are
   marked, which is also the moment they stop blocking the Update button. */
function attendanceRowChange(key){
  if (!attendanceIsEdit()) return "";
  const was = S.attBaseline[key] || { status: "", note: "" };
  const status = S.attStatus[key] || "";
  if (status !== (was.status || "")) return "status";
  if (String(S.attNotes[key] || "").trim() !== String(was.note || "").trim()) return "note";
  return "";
}

function attendanceChanges(){
  return mentorGroup().members
    .map(m => attMemberKey(m))
    .filter(key => attendanceRowChange(key));
}

/* "today at 8:52 PM" / "yesterday at ..." / "on 21 Aug at ...". A timestamp the
   sheet handed back in some unparseable shape yields "", and the banner simply
   drops the phrase rather than printing "Invalid Date". */
function attSavedLabel(iso){
  const d = new Date(iso);
  if (!iso || isNaN(d.getTime())) return "";

  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const midnight = t => new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
  const days = Math.round((midnight(new Date(nowMs())) - midnight(d)) / 86400000);

  if (days === 0) return `today at ${time}`;
  if (days === 1) return `yesterday at ${time}`;
  return `on ${d.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]} at ${time}`;
}

function attendanceMemberRows(query){
  const q = String(query || "").trim().toLowerCase();
  const members = mentorGroup().members.filter(m =>
    !q || String(m.name || "").toLowerCase().indexOf(q) !== -1
  );
  if (!members.length) return emptyRow(q ? "No members match that search" : "No members in this group");

  return members.map((m, i) => {
    const key = attMemberKey(m);
    const st = S.attStatus[key];
    const isAbsent = st === ATT_ABSENT;
    const last = i === members.length - 1;

    /* In edit mode a changed row is called out in blue, which outranks the pink
       an absent row otherwise carries — what moved since the save is the more
       useful signal. The note field still follows absence either way. */
    const change = attendanceRowChange(key);
    const wasStatus = (S.attBaseline[key] || {}).status;
    const subline = change === "status"
      ? `<div style="font-size:12px;font-weight:600;color:#2563eb;margin-top:2px;">Changed just now${wasStatus ? ` — was ${wasStatus === ATT_PRESENT ? 'Present' : 'Absent'}` : ''}</div>`
      : change === "note"
        ? `<div style="font-size:12px;font-weight:600;color:#2563eb;margin-top:2px;">Note changed just now</div>`
        : `<div style="font-size:12px;color:#8d8d8d;margin-top:2px;">${esc(m.role || 'Member')}</div>`;
    const rowBg = change ? '#eff6ff' : (isAbsent ? '#fef4f4' : '#ffffff');

    const seg = (label, value, onBg) => {
      const on = st === value;
      return `<div onclick="app.setAttStatus('${esc(key)}','${value}')" style="cursor:pointer;width:38px;height:30px;border-radius:100px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:${on ? onBg : 'transparent'};color:${on ? '#ffffff' : '#8d8d8d'};transition:background .15s ease;">${label}</div>`;
    };

    return `
      <div style="background:${rowBg};${last ? '' : 'border-bottom:1px solid #f2f2f2;'}">
        <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;">
          <div style="width:44px;height:44px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#ffffff;flex-shrink:0;">${esc(m.initials || getInitials(m.name))}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:15px;font-weight:700;color:#111820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(m.name)}</div>
            ${subline}
          </div>
          <div style="display:flex;gap:2px;padding:3px;border-radius:100px;background:#f2f2f2;flex-shrink:0;">
            ${seg("P", ATT_PRESENT, "#16a34a")}${seg("A", ATT_ABSENT, "#dc2626")}
          </div>
        </div>
        ${isAbsent ? `
        <div style="padding:0 16px 14px;">
          <textarea oninput="app.onAttNote('${esc(key)}', this.value)" placeholder="Add a note (optional)" rows="1" style="width:100%;border:1px solid #e2e8f0;border-radius:12px;background:#ffffff;padding:11px 14px;font-size:14px;color:#111820;resize:none;line-height:1.4;">${esc(S.attNotes[key] || "")}</textarea>
        </div>` : ""}
      </div>`;
  }).join("");
}

function attendanceScreen(){
  const e = S.selectedEvent || {};
  const group = mentorGroup();
  const t = attendanceTally();
  const complete = t.total > 0 && t.marked === t.total;

  const isEdit = attendanceIsEdit();
  const changes = isEdit ? attendanceChanges().length : 0;
  // Editing writes over a record that is already good, so it takes an actual
  // change as well as a complete roster.
  const canSave = complete && !S.attSaving && (!isEdit || changes > 0);

  const subtitle = [group.name, e.date, e.time].filter(Boolean).join(" · ");
  const savedLabel = isEdit ? attSavedLabel(S.attSavedAt) : "";

  const banner = !isEdit ? "" : `
      <div style="padding:0 22px;margin-bottom:14px;">
        <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;">
          <div style="flex-shrink:0;display:flex;margin-top:1px;">${micon('edit', 20, '#b45309')}</div>
          <div style="flex:1;min-width:0;font-size:13px;color:#92400e;line-height:1.45;">
            <span style="font-weight:700;">Editing a saved record.</span>${savedLabel ? ` Saved ${esc(savedLabel)}.` : ""}
          </div>
          <div onclick="app.discardAttendanceEdits()" style="cursor:pointer;flex-shrink:0;font-size:14px;font-weight:700;color:#b45309;">Discard</div>
        </div>
      </div>`;

  /* Fill mode only: searching a roster you are filling from scratch helps, and
     "All present" is the fast path into it. Neither belongs over a saved record,
     where one tap on "All present" would overwrite the lot. */
  const searchRow = isEdit ? "" : `
      <div style="padding:0 22px;margin-top:14px;display:flex;align-items:center;gap:10px;">
        <div style="flex:1;position:relative;min-width:0;">
          <div style="position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;pointer-events:none;">${micon('search', 18, '#8d8d8d')}</div>
          <input id="attSearchInput" oninput="app.onAttSearch(this.value)" value="${esc(S.attSearch)}" placeholder="Search members" style="width:100%;height:46px;background:#ffffff;border:1px solid #d1d1d1;border-radius:14px;padding:0 14px 0 42px;font-size:14px;color:#111820;box-shadow:0 2px 8px -6px rgba(17,24,32,.1);"/>
        </div>
        <div onclick="app.markAllPresent()" style="cursor:pointer;flex-shrink:0;display:flex;align-items:center;gap:6px;height:46px;padding:0 16px;border-radius:14px;background:#eff6ff;color:#2563eb;font-size:14px;font-weight:600;">
          ${micon('check', 18, '#2563eb')}All present
        </div>
      </div>`;

  const footerNote = isEdit
    ? (changes ? `${changes} change${changes === 1 ? "" : "s"} since last save` : "No changes since last save")
    : `${t.marked} of ${t.total} marked`;

  return `<div class="screen" style="background:#ffffff;">
    <div style="background:#ffffff;color:#2b2b2b;padding:calc(16px + env(safe-area-inset-top)) 22px 16px;display:flex;align-items:center;gap:14px;flex-shrink:0;">
      <div onclick="app.backEventDetail()" style="cursor:pointer;width:38px;height:38px;border-radius:50%;background:#f4f6f9;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -8px rgba(17,24,32,.2);flex-shrink:0;">${I.back}</div>
      <div style="min-width:0;">
        <div style="font-size:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#8f8a80;">${isEdit ? "Edit attendance" : "Attendance"}</div>
        <div class="serif" style="font-size:24px;font-weight:700;color:#2b2b2b;line-height:1.2;letter-spacing:-.4px;margin-top:2px;">${esc(e.title)}</div>
        <div style="font-size:13px;color:#8f8a80;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(subtitle)}</div>
      </div>
    </div>

    <div id="scrollable-container" class="scr" style="flex:1;min-height:0;background:#f4f6f9;padding:16px 0 24px;overflow-y:auto;">
      ${banner}
      <div style="padding:0 22px;">
        <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;box-shadow:0 4px 16px -12px rgba(17,24,32,.15);">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;">
            <div style="font-size:16px;font-weight:700;">
              <span style="color:#16a34a;">${t.present} Present</span><span style="color:#8d8d8d;"> · </span><span style="color:#dc2626;">${t.absent} Absent</span>
            </div>
            <div style="font-size:13px;color:#8d8d8d;flex-shrink:0;">${t.marked} of ${t.total}</div>
          </div>
          <div style="margin-top:12px;">${attendanceBar(t.present, t.absent, t.total)}</div>
        </div>
      </div>

      ${searchRow}

      <div style="padding:0 22px;margin-top:14px;">
        <div id="attListContainer" style="background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px -10px rgba(17,24,32,.2);">${attendanceMemberRows(S.attSearch)}</div>
      </div>
    </div>

    <div style="flex-shrink:0;background:#ffffff;border-top:1px solid #e8ecf1;padding:14px 22px calc(14px + env(safe-area-inset-bottom));">
      <div onclick="app.saveEventAttendance()" style="cursor:${canSave ? 'pointer' : 'not-allowed'};height:56px;border-radius:14px;background:${canSave ? (isEdit ? '#1c3249' : '#2563eb') : '#8d8d8d'};color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:${canSave ? (isEdit ? '0 10px 24px rgba(28,50,73,0.35)' : '0 10px 24px rgba(37,99,235,0.4)') : 'none'};transition:background .2s ease;">
        <div style="font-size:16px;font-weight:700;">${S.attSaving ? 'Saving...' : (isEdit ? 'Update Attendance' : 'Save Attendance')}</div>
        <div style="font-size:12px;color:rgba(255,255,255,.85);margin-top:1px;">${footerNote}</div>
      </div>
    </div>
  </div>`;
}

SCREENS.attendance = attendanceScreen;

Object.assign(window.app, {
  /* Opens the screen for one event, from a clean slate. */
  startAttendance: (ev) => {
    if (!ev) return;
    S.selectedEvent = ev;
    S.attStatus = {}; S.attNotes = {}; S.attSearch = ""; S.attSaving = false;
    S.attMode = "fill"; S.attBaseline = {}; S.attSavedAt = "";
    go("attendance");
  },

  /* Re-opens a saved record. The fetch happens before navigating so the screen
     never paints a half-filled roster — the mentor sees one loading state on
     the Edit link they just tapped instead. */
  openAttendanceEdit: (ev) => {
    if (!ev || S.attLoadingEdit) return;
    const eventId = String(ev.eventId || "");
    if (!eventId) return;

    const seed = (record) => {
      S.selectedEvent = ev;
      S.attStatus = {}; S.attNotes = {}; S.attBaseline = {};
      (record.marks || []).forEach(m => {
        const key = String(m.userId || "");
        if (!key) return;
        S.attStatus[key] = m.status === ATT_ABSENT ? ATT_ABSENT : ATT_PRESENT;
        S.attNotes[key] = String(m.note || "");
        S.attBaseline[key] = { status: S.attStatus[key], note: S.attNotes[key] };
      });
      S.attSavedAt = String(record.savedAt || "");
      S.attSearch = ""; S.attSaving = false; S.attMode = "edit";
      go("attendance");
    };

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      seed({ marks: [], savedAt: "" });   // standalone preview, no server to ask
      return;
    }

    S.attLoadingEdit = true;
    render();
    google.script.run
      .withSuccessHandler((record) => {
        S.attLoadingEdit = false;
        if (!record || !record.recorded) {
          render();
          alert("That attendance record could not be found.");
          return;
        }
        seed(record);
      })
      .withFailureHandler((err) => {
        S.attLoadingEdit = false;
        render();
        alert("Could not open the saved record: " + (err && err.message ? err.message : err));
      })
      .getEventAttendance({ userEmail: S.currentUserEmail, eventId: eventId });
  },

  /* Puts every row back the way it was saved. The change count falls to zero on
     its own, which is what disables Update again. */
  discardAttendanceEdits: () => {
    S.attStatus = {}; S.attNotes = {};
    Object.keys(S.attBaseline).forEach(key => {
      S.attStatus[key] = S.attBaseline[key].status;
      S.attNotes[key] = S.attBaseline[key].note;
    });
    render();
  },

  backEventDetail: () => go("eventDetail"),

  /* Tapping the side a member is already on clears it, so a misplaced tap can
     be taken back rather than forcing a choice. */
  setAttStatus: (key, status) => {
    S.attStatus[key] = S.attStatus[key] === status ? undefined : status;
    if (!S.attStatus[key]) delete S.attStatus[key];
    render();
  },

  markAllPresent: () => {
    mentorGroup().members.forEach(m => { S.attStatus[attMemberKey(m)] = ATT_PRESENT; });
    render();
  },

  /* Typing must not re-render: a full render would drop the caret and close
     the keyboard mid-word. Both of these patch state only — the search box
     repaints just the list it filters (same approach as onCommunitySearch). */
  onAttSearch: (v) => {
    S.attSearch = v;
    const list = document.getElementById("attListContainer");
    if (list) list.innerHTML = attendanceMemberRows(v);
  },

  onAttNote: (key, v) => { S.attNotes[key] = v; },

  /* Records what was marked and leaves immediately — the server write follows
     in the background. S.pendingAttendance holds the counts until a refresh
     comes back carrying them (see refreshData in Core); on failure everything
     is rolled back and the mentor is told. */
  saveEventAttendance: () => {
    if (S.attSaving) return;

    const ev = S.selectedEvent || {};
    const members = mentorGroup().members;
    const t = attendanceTally();
    if (!t.total || t.marked !== t.total) return;
    // Nothing moved since the record was written — there is nothing to write.
    if (attendanceIsEdit() && !attendanceChanges().length) return;

    const eventId = String(ev.eventId || "");
    if (!eventId) { alert("This event has no saved date and time yet, so attendance cannot be recorded against it."); return; }

    const marks = members.map(m => {
      const key = attMemberKey(m);
      return { userId: String(m.userId || ""), status: S.attStatus[key], note: S.attNotes[key] || "" };
    });

    // What to restore if the write fails: null on a first save, the counts the
    // record already carried when this was an edit.
    const prevSummary = ev.attendance || null;

    const summary = { recorded: true, present: t.present, absent: t.absent, total: t.total,
                      myStatus: prevSummary ? prevSummary.myStatus || "" : "" };
    S.pendingAttendance[eventId] = summary;
    applyAttendanceSummary(eventId, summary);

    S.attMode = "fill"; S.attBaseline = {}; S.attSavedAt = "";
    go("eventDetail");

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withFailureHandler((err) => {
          delete S.pendingAttendance[eventId];
          applyAttendanceSummary(eventId, prevSummary);
          render();
          alert("Attendance could not be saved: " + (err && err.message ? err.message : err));
        })
        .saveEventAttendance({ userEmail: S.currentUserEmail, eventId: eventId, marks: marks });
    }
  }
});

/* The same event object is reachable as DATA.nextEvent, inside DATA.events and
   as S.selectedEvent — usually the very same reference, but not after a
   refresh has swapped DATA out underneath. Stamp all three by id. */
function applyAttendanceSummary(eventId, summary){
  if (S.selectedEvent && String(S.selectedEvent.eventId) === String(eventId)) {
    S.selectedEvent.attendance = summary;
  }
  if (!DATA) return;
  if (DATA.nextEvent && String(DATA.nextEvent.eventId) === String(eventId)) {
    DATA.nextEvent.attendance = summary;
  }
  (DATA.events || []).forEach(ev => {
    if (String(ev.eventId) === String(eventId)) ev.attendance = summary;
  });
}
</script>
