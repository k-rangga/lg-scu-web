<script>
/* ==========================================================================
   REFLECTION — shared reflections across groups: the feed (All / Mine),
   a reflection thread with quoted replies and @mentions, the new-reflection
   composer with file attachment, and the file-error modal.
   ========================================================================== */

/* Feed cards clamp the body to PREVIEW_LINES via -webkit-line-clamp, then park
   "...read more" on top of the tail of the last visible line — the link cannot live
   inside the clamped box because the clamp would cut it off with the text.
   PREVIEW_LINE_HEIGHT keeps the overlay sitting exactly on that line. */
const PREVIEW_LINES = 4;
const PREVIEW_FONT_SIZE = 15;
const PREVIEW_LINE_HEIGHT = 1.55;

/* Whether the clamp actually hid anything is only knowable once the browser has laid
   the text out, so the overlay ships hidden and this reveals it post-render.
   Called from render() in Core. */
function applyReadMoreClamps(){
  const bodies = document.querySelectorAll('.refBody');
  for (let i = 0; i < bodies.length; i++) {
    const el = bodies[i];
    const more = el.parentNode.querySelector('.refMore');
    if (!more) continue;
    more.style.display = el.scrollHeight > el.clientHeight + 1 ? 'inline-block' : 'none';
  }
}

/* Ownership drives the kebab menu. The server stamps `mine` on reflections and a
   `userId` on replies, but an optimistically-posted item and the mock DATA in Init
   carry neither — hence the author-name fallback on both. */
function isMyReflection(r){
  if (!r) return false;
  const currentUserName = DATA && DATA.user ? DATA.user.name : "";
  return !!r.mine || !!(r.author && currentUserName && r.author.toLowerCase() === currentUserName.toLowerCase());
}

function isMyReply(rp){
  if (!rp || !DATA || !DATA.user) return false;
  if (rp.userId && DATA.user.userId) return String(rp.userId) === String(DATA.user.userId);
  return !!(rp.author && DATA.user.name && rp.author.toLowerCase() === DATA.user.name.toLowerCase());
}

/* The kebab sits inside cards whose body and footer already open the thread, so the
   tap must not bubble. `id` is the reflection id for kind "reflection", the reply id
   for kind "reply". */
function kebabBtn(kind, id, refId){
  return `<div onclick="event.stopPropagation(); app.openPostActions('${kind}','${esc(id)}','${esc(refId || '')}')" style="cursor:pointer;width:32px;height:32px;margin:-6px -8px -6px 0;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#94a3b8;">${micon("more_vert", 20, "#94a3b8")}</div>`;
}

function reflectionScreen(){
  if (!DATA) return `<div class="screen"></div>`;
  const currentUserName = DATA.user ? DATA.user.name : "";
  const currentGroupName = DATA.group ? DATA.group.name : "";

  const list = DATA.reflections.filter(r => {
    const isMine = isMyReflection(r);
    const visibility = (r.visibility || "Public").toLowerCase();

    if (visibility === "private") {
      if (!isMine) return false;
    } else if (visibility === "group") {
      const postGroup = r.group || "";
      const isSameGroup = postGroup && currentGroupName && postGroup.toLowerCase() === currentGroupName.toLowerCase();
      if (!isSameGroup && !isMine) return false;
    }

    if (S.reflectionTab === "mine") {
      return isMine;
    }
    return true;
  });
  
  const rows = list.map((r) => {
    let visBg = r.visibility === "Public" ? '#dcfce7' : (r.visibility === "Group" ? '#dbeafe' : '#f1f5f9');
    let visColor = r.visibility === "Public" ? '#166534' : (r.visibility === "Group" ? '#1e40af' : '#475569');
    
    const isPosting = r.isPosting;
    const isBusy = isPosting || r.isDeleting;
    const cardOpacity = isBusy ? '0.65' : '1';
    const cardPointerEvents = isBusy ? 'none' : 'auto';
    const statusBadge = r.isDeleting
      ? `<span style="font-size:10px;font-weight:700;color:#b91c1c;background:#fee2e2;padding:4px 10px;border-radius:100px;animation:pulseAnim 1.2s infinite ease-in-out;">Deleting...</span>`
      : `<span style="font-size:11px;font-weight:700;color:${visColor};background:${visBg};padding:4px 10px;border-radius:100px;">${esc(r.visibility || "Public")}</span>`;
    const postingBadge = isPosting ? `<span style="font-size:10px;font-weight:700;color:#d97706;background:#fef3c7;padding:4px 10px;border-radius:100px;animation:pulseAnim 1.2s infinite ease-in-out;">Posting...</span>` : statusBadge;
    const cardKebab = (!isBusy && isMyReflection(r)) ? kebabBtn("reflection", r.id, r.id) : "";

    const displayText = r.text;
    const readMoreOverlay = isPosting ? "" : `<span class="refMore" onclick="app.openThread('${esc(r.id)}')" style="display:none;position:absolute;right:0;bottom:0;padding-left:34px;font-size:${PREVIEW_FONT_SIZE}px;line-height:${PREVIEW_LINE_HEIGHT};font-weight:600;color:#2563eb;cursor:pointer;background:linear-gradient(to right,rgba(255,255,255,0) 0,#ffffff 30px,#ffffff 100%);">...read more</span>`;

    const fileAttachment = r.fileName ? `
      <div onclick="${isPosting ? '' : `window.open('${esc(r.fileUrl || '#')}', '_blank')`}" style="cursor:${isPosting?'default':'pointer'};display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;">
        <div style="color:#2563eb;display:flex;align-items:center;">${I.doc}</div>
        <div style="font-size:13px;font-weight:600;color:#2563eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(r.fileName)}</div>
      </div>` : "";

    const replyCount = r.replies ? r.replies.length : 0;
    const replyText = replyCount > 0 ? `${replyCount} repl${replyCount===1?'y':'ies'}` : 'Reply to start a discussion';
    const replyColor = replyCount > 0 ? '#2563eb' : '#8d8d8d';
    const threadClickAttr = isPosting ? '' : `onclick="app.openThread('${esc(r.id)}')"`;

    return `<div style="background:#ffffff;border-radius:16px;padding:16px;box-shadow:0 4px 14px -10px rgba(17,24,32,.18);margin-bottom:12px;opacity:${cardOpacity};pointer-events:${cardPointerEvents};transition:opacity 0.3s ease;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:36px;height:36px;border-radius:50%;background:#e2e8f0;color:#1e293b;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;">${esc(r.initials)}</div>
          <div>
            <div style="font-size:15px;font-weight:700;color:#111820;">${esc(r.author)}</div>
            <div style="font-size:12px;color:#8d8d8d;margin-top:1px;">${esc(timeAgo(r.time))}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">${postingBadge}${cardKebab}</div>
      </div>
      <div class="serif" style="font-size:18px;font-weight:700;color:#111820;line-height:1.25;margin-top:10px;">${esc(r.title)}</div>
      <div style="position:relative;margin-top:8px;">
        <div class="refBody" style="font-size:${PREVIEW_FONT_SIZE}px;color:#475569;line-height:${PREVIEW_LINE_HEIGHT};white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:${PREVIEW_LINES};line-clamp:${PREVIEW_LINES};overflow:hidden;">${parseFormatting(displayText)}</div>
        ${readMoreOverlay}
      </div>
      ${fileAttachment}
      
      <div style="height:1px;background:#f1f5f9;margin:16px -16px 12px;"></div>
      <div ${threadClickAttr} style="display:inline-flex;align-items:center;gap:8px;color:${replyColor};font-size:14px;font-weight:600;cursor:${isPosting?'default':'pointer'};">
        ${I.messageCircle} ${replyText}
      </div>
    </div>`;
  }).join("");

  const tab = (fn,label,on) => `<div onclick="app.${fn}()" style="cursor:pointer;flex:1;text-align:center;padding:12px;border-radius:100px;font-size:14px;font-weight:600;background:${on?'#2563eb':'transparent'};color:${on?'#ffffff':'#64748b'};transition:all .2s ease;">${label}</div>`;

  return `<div class="screen" style="background:#ffffff;">
    <div id="scrollable-container" class="scr fill" onscroll="app.handleScroll(this)" style="flex:1;min-height:0;background:#f4f6f9;padding:0 0 140px;overflow-y:auto;">
      <div id="ptr-indicator"><div class="ptr-spinner"></div><span>Pull to refresh...</span></div>
      <div style="background:#ffffff;color:#2b2b2b;padding:calc(16px + env(safe-area-inset-top)) 22px 16px;display:flex;align-items:center;">
        <div>
          <div class="serif" style="font-size:26px;font-weight:700;letter-spacing:-.4px;color:#2b2b2b;">Reflections</div>
          <div style="font-size:14px;color:#8f8a80;margin-top:1px;">Shared reflections from every small group</div>
        </div>
      </div>
      <div style="padding:0 22px;margin-top:6px;">
        <div style="display:flex;background:#ffffff;padding:4px;border-radius:100px;box-shadow:0 2px 8px rgba(0,0,0,0.04);">
          ${tab("setTabAll","All reflections",S.reflectionTab==="all")}
          ${tab("setTabMine","Mine",S.reflectionTab==="mine")}
        </div>
      </div>
      <div style="padding:0 22px;margin-top:16px;display:flex;flex-direction:column;">
        ${rows||emptyRow("No reflections yet")}
      </div>
    </div>
    ${reflectionFab()}
  </div>`;
}

/* The "+" rotates 45° into an "x" — same glyph, no separate icon swap needed.
   The three options fan out above it with a pre-picked visibility each; the
   write screen still lets the author change it before submitting.

   render() replaces the whole screen's innerHTML on every pass, so a CSS
   `transition` never has a "before" state to animate from — every element is
   born already at its final style. The open state instead plays a @keyframes
   animation on mount (see .fab-icon-rotate / .fab-menu in Styles), and
   overlayAnim suppresses a replay if a background refresh re-renders while
   the menu is still open. Closing snaps instantly, same as every other sheet
   in this app. */
function reflectionFab(){
  const open = S.reflectionFabOpen;
  const iconAnim = fabIconAnim("reflectionFab", open);
  const anim = overlayAnim("reflectionFab", open);

  const option = (visibility, label, iconName) => `<div onclick="app.chooseReflectionType('${visibility}')" style="display:flex;align-items:center;justify-content:flex-end;gap:10px;cursor:pointer;">
      <span style="font-size:14px;font-weight:600;color:#2b2b2b;background:#ffffff;padding:9px 16px;border-radius:100px;box-shadow:0 6px 16px -10px rgba(17,24,32,.35);white-space:nowrap;">${label}</span>
      <div style="flex-shrink:0;width:44px;height:44px;border-radius:50%;background:#ffffff;color:#2563eb;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px -10px rgba(17,24,32,.35);">${micon(iconName, 20)}</div>
    </div>`;

  // Bottom offsets track env(safe-area-inset-bottom) the same way bottomNav's own
  // padding does (see NAV_CONTENT_HEIGHT there) — a fixed px bottom here would sit
  // fine on a home-indicator-less device and overlap the nav bar on one that has it.
  const menu = open ? `<div onclick="app.toggleReflectionFab()" style="position:absolute;inset:0;z-index:39;"></div>
    <div class="fab-menu${anim}" style="position:absolute;right:22px;bottom:calc(148px + env(safe-area-inset-bottom));z-index:41;display:flex;flex-direction:column;align-items:flex-end;gap:12px;">
      ${option("Private","Add private reflection","lock")}
      ${option("Group","Add group reflection","groups")}
      ${option("Public","Share to everyone","public")}
    </div>` : "";

  return `${menu}
    <div onclick="app.toggleReflectionFab()" style="position:absolute;right:22px;bottom:calc(76px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:#2563eb;color:#ffffff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 28px rgba(37,99,235,0.4);z-index:40;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="${iconAnim.trim()}" style="transform:rotate(${open?'45deg':'0deg'});"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </div>`;
}

function reflectionThreadScreen() {
  if (!DATA || !S.activeReflectionId) return `<div class="screen"></div>`;
  const r = DATA.reflections.find(x => x.id === S.activeReflectionId);
  if (!r) return `<div class="screen"></div>`;

  let visBg = r.visibility === "Public" ? '#dcfce7' : (r.visibility === "Group" ? '#dbeafe' : '#f1f5f9');
  let visColor = r.visibility === "Public" ? '#166534' : (r.visibility === "Group" ? '#1e40af' : '#475569');

  const fileAttachment = r.fileName ? `
    <div onclick="window.open('${esc(r.fileUrl || '#')}', '_blank')" style="cursor:pointer;display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;">
      <div style="color:#2563eb;display:flex;align-items:center;">${I.doc}</div>
      <div style="font-size:13px;font-weight:600;color:#2563eb;">${esc(r.fileName)}</div>
    </div>` : "";

  const mainPostHtml = `<div style="background:#ffffff;border-radius:16px;padding:20px;box-shadow:0 4px 14px -10px rgba(17,24,32,.15);margin:0 16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:36px;height:36px;border-radius:50%;background:#e2e8f0;color:#1e293b;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;">${esc(r.initials)}</div>
        <div>
          <div style="font-size:15px;font-weight:700;color:#111820;">${esc(r.author)}</div>
          <div style="font-size:12px;color:#8d8d8d;">${esc(timeAgo(r.time))}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <span style="font-size:11px;font-weight:700;color:${visColor};background:${visBg};padding:4px 10px;border-radius:100px;">${esc(r.visibility || "Public")}</span>
        ${(!r.isPosting && !r.isDeleting && isMyReflection(r)) ? kebabBtn("reflection", r.id, r.id) : ""}
      </div>
    </div>
    <div class="serif" style="font-size:20px;font-weight:700;color:#0f172a;line-height:1.25;">${esc(r.title)}</div>
    <div style="font-size:16px;color:#334155;line-height:1.6;margin-top:10px;white-space:pre-wrap;">${parseFormatting(r.fullText || r.text)}</div>
    ${fileAttachment}
  </div>`;

  const repliesHtml = (r.replies || []).map(rp => {
    const rawQuoteText = rp.quotedText || "";
    const quoteHtml = rawQuoteText ? `
      <div style="border-left:3px solid #2563eb;padding-left:10px;margin-bottom:8px;">
        <div style="font-size:11px;font-weight:700;color:#2563eb;margin-bottom:2px;">${esc(rp.quotedAuthor)}</div>
        <div style="font-size:12px;color:#64748b;line-height:1.4;white-space:pre-wrap;">${parseFormatting(rawQuoteText)}</div>
      </div>` : "";

    const safeAuthor = String(rp.author || "").replace(/'/g, "\\'");
    const safeText = String(rp.text || "").replace(/'/g, "\\'").replace(/\n/g, " ");

    /* A reply is only actionable once the server has handed back its ReplyID. */
    const replyKebab = (rp.id && !rp.isDeleting && isMyReply(rp)) ? kebabBtn("reply", rp.id, r.id) : "";
    const replyBusy = rp.isDeleting ? 'opacity:0.55;pointer-events:none;' : '';
    const isEditingThis = S.editingReplyId && String(S.editingReplyId) === String(rp.id);

    return `
    <div style="display:flex;gap:10px;margin-bottom:12px;padding:0 16px;${replyBusy}">
      <div style="width:32px;height:32px;border-radius:50%;background:#eff6ff;color:#2563eb;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;">${esc(rp.initials)}</div>
      <div style="flex:1;">
        <div style="background:#ffffff;border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px -4px rgba(17,24,32,.1);border:1px solid ${isEditingThis ? '#bfdbfe' : '#f1f5f9'};">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;">
            <div style="display:flex;align-items:baseline;gap:6px;min-width:0;">
              <span style="font-size:14px;font-weight:700;color:#0f172a;">${esc(rp.author)}</span>
              <span style="font-size:11px;color:#94a3b8;">${esc(timeAgo(rp.time))}</span>
            </div>
            ${replyKebab}
          </div>
          ${quoteHtml}
          <div style="font-size:14px;color:#334155;line-height:1.5;white-space:pre-wrap;">${formatMentions(rp.text)}</div>
          <div onclick="app.quoteReply('${safeAuthor}', '${safeText}')" style="display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;font-weight:600;color:#2563eb;cursor:pointer;">
            ${I.messageCircle} Reply
          </div>
        </div>
      </div>
    </div>`;
  }).join("");

  const totalRepliesCount = r.replies ? r.replies.length : 0;
  const replyCountStr = totalRepliesCount > 0 ? `${totalRepliesCount} repl${totalRepliesCount===1?'y':'ies'}` : 'Start a discussion';

  let quotePreview = "";
  if (S.editingReplyId) {
    quotePreview = `
    <div style="background:#eff6ff;border-left:3px solid #2563eb;padding:8px 12px;margin-bottom:8px;border-radius:4px;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:12px;font-weight:700;color:#2563eb;">Editing your reply</div>
      <div onclick="app.cancelEditReply()" style="cursor:pointer;font-size:12px;font-weight:700;color:#64748b;padding:2px 4px;">Cancel</div>
    </div>`;
  } else if (S.quoteContext) {
    quotePreview = `
    <div style="background:#f8fafc;border-left:3px solid #2563eb;padding:8px 12px;margin-bottom:8px;border-radius:4px;display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <div style="font-size:11px;font-weight:700;color:#2563eb;margin-bottom:2px;">Replying to ${esc(S.quoteContext.author)}</div>
        <div style="font-size:12px;color:#64748b;line-height:1.4;white-space:pre-wrap;">${parseFormatting(truncate(S.quoteContext.text, 50))}</div>
      </div>
      <div onclick="app.clearQuote()" style="cursor:pointer;padding:2px;color:#94a3b8;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </div>
    </div>`;
  }

  const hasText = S.replyText.trim().length > 0;
  const sendBg = hasText ? '#2563eb' : '#f2f2f2';
  const sendColor = hasText ? '#ffffff' : '#8d8d8d';

  return `<div class="screen" style="background:#ffffff;display:flex;flex-direction:column;height:100%;overflow:hidden;">
    <div style="flex-shrink:0;background:#ffffff;padding:calc(16px + env(safe-area-inset-top)) 22px 16px;display:flex;align-items:center;gap:14px;z-index:10;">
      <div onclick="app.backReflection()" style="cursor:pointer;width:38px;height:38px;border-radius:50%;background:#f4f6f9;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -8px rgba(17,24,32,.2);">${I.back}</div>
      <div>
        <div class="serif" style="font-size:26px;font-weight:700;color:#2b2b2b;letter-spacing:-.4px;">Thread</div>
        <div style="font-size:14px;color:#8f8a80;margin-top:1px;">${replyCountStr}</div>
      </div>
    </div>

    <div id="threadScroll" style="background:#f4f6f9;flex:1;overflow-y:auto;padding-top:8px;padding-bottom:24px;">
      ${mainPostHtml}
      <div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#94a3b8;margin:20px 0 12px 16px;">Discussion</div>
      ${repliesHtml || emptyRow("Be the first to reply")}
    </div>

    <!-- Sticky Bottom Bar (Flex child prevents mobile keyboard closing bug) -->
    <div style="flex-shrink:0;background:#ffffff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,0.08);z-index:40;border-top:1px solid #e2e8f0;position:relative;">
      <div id="mentionMenu" style="display:none;position:absolute;bottom:calc(100% + 10px);left:16px;right:16px;background:#ffffff;border-radius:20px;box-shadow:0 -8px 30px rgba(0,0,0,0.18);max-height:240px;overflow-y:auto;z-index:105;border:1px solid #e2e8f0;padding:6px 0;"></div>
      ${quotePreview}
      <div style="display:flex;align-items:flex-end;gap:10px;">
        <textarea id="replyInput" rows="1" oninput="app.onReplyInput(this)" placeholder="Write a reply... use @ to mention" style="flex:1;background:#f8fafc;border:1.5px solid #cbd5e1;border-radius:24px;outline:none;font-size:15px;color:#0f172a;resize:none;max-height:135px;line-height:1.4;padding:12px 18px;-webkit-appearance:none;">${esc(S.replyText)}</textarea>
        <div id="sendReplyBtn" onclick="app.submitReply()" style="background:${sendBg};color:${sendColor};width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.2s ease;margin-bottom:2px;">${I.send}</div>
      </div>
    </div>
  </div>`;
}

/* Visibility's badge palette — the same bg/color pairs the feed card and thread
   header spell out inline, plus the Material Symbol the FAB menu uses for each,
   so the composer's status bar reads as the same badge the post will carry. */
const VIS_STYLE = {
  Public:  { bg:'#dcfce7', color:'#166534', icon:'public' },
  Group:   { bg:'#dbeafe', color:'#1e40af', icon:'groups' },
  Private: { bg:'#f1f5f9', color:'#475569', icon:'lock' }
};

/* A writing surface, not a form: Cancel / options / Submit across the top, an
   untitled-note title and a body that takes the rest of the screen. Visibility
   and the attachment live in reflectionOptionsSheet() below, reachable from the
   "..." button and from the status bar pinned at the bottom.

   Three flex bands (header / scroller / status bar) rather than one tall
   scroller — same shape as the thread screen, and for the same reason: on iOS
   a bottom bar that is a flex *sibling* of the scroller stays put when the
   keyboard opens, where an absolutely positioned one gets shoved off-screen. */
function reflectionNewScreen(){
  const valid = S.rTitle.trim() && S.rDesc.trim();
  const isEditing = !!S.editingReflectionId;
  const busy = S.isSubmittingReflection;
  const vis = VIS_STYLE[S.rVisibility] || VIS_STYLE.Public;

  const submitBtnContent = busy
    ? `<div class="spinner"></div><span style="margin-left:8px;">${isEditing ? 'Saving...' : 'Submitting...'}</span>`
    : (isEditing ? `Save` : `Submit`);

  /* Attachments are not editable — the file stays exactly as posted — so the
     composer never advertises one on the edit path. */
  const fileChip = (!isEditing && S.rFile) ? `
        <span style="display:inline-flex;align-items:center;gap:5px;max-width:190px;background:#f1f5f9;color:#475569;border-radius:100px;padding:6px 12px;font-size:13px;font-weight:700;">
          ${micon("attach_file",15)}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(S.rFile.name)}</span>
        </span>` : "";

  /* With the sheet closed the attachment would otherwise be invisible from the
     header, so the "..." carries a dot when one is staged. */
  const attachDot = (!isEditing && S.rFile) ? `<span style="position:absolute;top:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:#2563eb;border:2px solid #ffffff;"></span>` : "";

  return `<div class="screen" style="background:#ffffff;">
    <div style="flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;background:#ffffff;">
      <div onclick="app.cancelCompose()" style="cursor:pointer;font-size:16px;color:#404040;padding:6px 2px;">Cancel</div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div onclick="app.openReflectionOptions()" class="icon-btn" style="position:relative;cursor:pointer;width:40px;height:40px;border-radius:50%;border:1.5px solid #d1d1d1;background:#ffffff;color:#8d8d8d;display:flex;align-items:center;justify-content:center;">
          ${micon("more_horiz",22)}${attachDot}
        </div>
        <div id="submitReflectionBtn" onclick="!S.isSubmittingReflection && app.submitReflection()" style="cursor:${!valid || busy ? 'not-allowed' : 'pointer'};height:44px;padding:0 22px;border-radius:100px;background:${!valid || busy ? '#b9c2cf' : '#2563eb'};color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;white-space:nowrap;box-shadow:${!valid || busy ? 'none' : '0 6px 16px rgba(37,99,235,0.35)'};">
          ${submitBtnContent}
        </div>
      </div>
    </div>

    <div class="scr" style="flex:1;min-height:0;overflow-y:auto;padding:8px 22px 20px;display:flex;flex-direction:column;">
      <input id="rTitleInput" oninput="app.onRTitle(this.value)" value="${esc(S.rTitle)}" placeholder="Title" style="flex-shrink:0;width:100%;border:none;background:transparent;padding:6px 0;font-size:32px;font-weight:700;letter-spacing:-.5px;color:#111820;"/>
      <textarea id="rDescInput" oninput="app.onRDesc(this.value)" placeholder="What did God speak to you through this session?" style="flex:1;min-height:220px;width:100%;border:none;background:transparent;padding:8px 0;font-size:18px;line-height:1.55;color:#111820;resize:none;">${esc(S.rDesc)}</textarea>
    </div>

    <div onclick="app.openReflectionOptions()" style="flex-shrink:0;cursor:pointer;display:flex;align-items:center;gap:8px;background:#ffffff;border-top:1px solid #f1f5f9;padding:10px 22px calc(10px + env(safe-area-inset-bottom));">
      <span style="display:inline-flex;align-items:center;gap:5px;background:${vis.bg};color:${vis.color};border-radius:100px;padding:6px 12px;font-size:13px;font-weight:700;">
        ${micon(vis.icon,15)}${esc(S.rVisibility)}
      </span>
      ${fileChip}
    </div>
  </div>`;
}

/* The composer's metadata, moved off the writing surface. Opened from the "..."
   in the header and from the status bar at the bottom of the same screen.
   Picking a visibility deliberately leaves the sheet up — the attachment is
   right below it, and closing on every tap would make staging both fiddly. */
function reflectionOptionsSheet(){
  // Swipe-back leaves reflectionNew via go() without passing through any of the
  // cancel handlers, so the screen itself — not the flag alone — gates this.
  const open = S.screen === "reflectionNew" && S.reflectionOptionsOpen;
  const anim = overlayAnim("reflectionOptions", open);
  if (!open) return "";

  const isEditing = !!S.editingReflectionId;
  const visBtn = (fn,label,on) => `<div onclick="app.${fn}()" style="cursor:pointer;flex:1;height:52px;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:15px;font-weight:600;background:${on?'#2563eb':'#ffffff'};color:${on?'#ffffff':'#404040'};border:1.5px solid ${on?'#2563eb':'#d1d1d1'};">${label}</div>`;

  const attachInner = S.rFile
    ? `<div style="display:flex;align-items:center;justify-content:center;gap:10px;">
         <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2563eb;font-weight:600;">${esc(S.rFile.name)}</span>
         <span onclick="event.stopPropagation();app.clearReflectionFile()" style="cursor:pointer;flex-shrink:0;color:#8d8d8d;display:flex;align-items:center;">
           <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
         </span>
       </div>`
    : `Attach a document &middot; max 12 MB`;

  /* Attachments are not editable — the file stays exactly as posted. */
  const attachBlock = isEditing ? "" : `
      <input type="file" id="rFileInput" style="display:none;" onchange="app.handleFileSelect(this)"/>
      <div onclick="document.getElementById('rFileInput').click()" style="cursor:pointer;margin-top:16px;border:1.5px dashed #d1d1d1;border-radius:14px;padding:16px;text-align:center;font-size:14px;color:#8d8d8d;">
        ${attachInner}
      </div>`;

  return `<div class="sheet-backdrop${anim}" onclick="app.closeReflectionOptions()">
    <div class="sheet${anim}" onclick="event.stopPropagation()" style="padding-bottom:calc(24px + env(safe-area-inset-bottom));">
      <div class="grab"></div>
      <div style="font-size:12px;font-weight:700;color:#8d8d8d;letter-spacing:.4px;text-transform:uppercase;margin:0 0 12px;">Who can see this</div>
      <div style="display:flex;gap:10px;">
        ${visBtn("setPublic","Public",S.rVisibility==="Public")}
        ${visBtn("setGroup","Group",S.rVisibility==="Group")}
        ${visBtn("setPrivate","Private",S.rVisibility==="Private")}
      </div>
      ${attachBlock}
    </div>
  </div>`;
}

function fileErrorModal(){
  if (!S.fileErrorModalOpen) return "";
  return `<div class="sheet-backdrop">
    <div class="sheet" style="text-align:center;padding-bottom:calc(30px + env(safe-area-inset-bottom));">
      <div class="grab"></div>
      <div style="width:48px;height:48px;border-radius:50%;background:#f2f2f2;color:#f39c12;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <div class="serif" style="font-size:20px;font-weight:700;color:#111820;margin-bottom:8px;">File Upload Notice</div>
      <div style="font-size:14px;color:#404040;line-height:1.5;margin-bottom:24px;">${esc(S.fileErrorMessage)}</div>
      <div onclick="app.closeFileErrorModal()" style="cursor:pointer;height:48px;background:#2563eb;color:#ffffff;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:15px;font-weight:600;box-shadow:0 8px 20px rgba(37,99,235,0.4);">Understand</div>
    </div>
  </div>`;
}

/* Author-only actions for a reflection, a reply, or a Community post (see
   kebabBtn's kind argument). Rendered on every screen from render() and
   self-suppressing, like every other sheet in the app — a dropdown anchored
   to the kebab would be destroyed by the next full innerHTML replace. */
function postActionSheet(){
  const anim = overlayAnim("postActions", !!S.actionSheet);
  if (!S.actionSheet) return "";
  const kind = S.actionSheet.kind;
  const noun = kind === "reply" ? "reply" : (kind === "post" ? "post" : "reflection");

  const row = (onclick, color, icon, label) => `
    <div onclick="${onclick}" style="cursor:pointer;display:flex;align-items:center;gap:14px;padding:15px 4px;color:${color};">
      ${icon}
      <span style="font-size:16px;font-weight:600;">${label}</span>
    </div>`;

  const pencil = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
  const trash = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`;

  return `<div class="sheet-backdrop${anim}" onclick="app.closePostActions()">
    <div class="sheet${anim}" onclick="event.stopPropagation()" style="padding-bottom:calc(20px + env(safe-area-inset-bottom));">
      <div class="grab"></div>
      ${row("app.startEditFromActions()", "#2563eb", pencil, "Edit " + noun)}
      <div style="height:1px;background:#f1f5f9;margin:0 -22px;"></div>
      ${row("app.askDeleteFromActions()", "#ef4444", trash, "Delete " + noun)}
      <div onclick="app.closePostActions()" style="cursor:pointer;margin-top:14px;height:48px;border-radius:14px;background:#f1f5f9;color:#64748b;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;">Cancel</div>
    </div>
  </div>`;
}

/* The app has no confirm helper — only native alert() — so deletion gets its own sheet. */
function confirmDeleteSheet(){
  const anim = overlayAnim("confirmDelete", !!S.confirmDelete);
  if (!S.confirmDelete) return "";
  const dKind = S.confirmDelete.kind;
  const noun = dKind === "reply" ? "reply" : (dKind === "post" ? "post" : "reflection");
  const extra = noun === "reflection" ? " Its replies will be removed too." : "";

  return `<div class="sheet-backdrop${anim}" onclick="app.cancelDelete()">
    <div class="sheet${anim}" onclick="event.stopPropagation()" style="text-align:center;padding-bottom:calc(30px + env(safe-area-inset-bottom));">
      <div class="grab"></div>
      <div style="width:48px;height:48px;border-radius:50%;background:#fee2e2;color:#ef4444;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </div>
      <div class="serif" style="font-size:20px;font-weight:700;color:#111820;margin-bottom:8px;">Delete this ${noun}?</div>
      <div style="font-size:14px;color:#404040;line-height:1.5;margin-bottom:22px;">This can't be undone.${extra}</div>
      <div style="display:flex;gap:10px;">
        <div onclick="app.cancelDelete()" style="cursor:pointer;flex:1;height:48px;background:#f1f5f9;color:#64748b;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:15px;font-weight:700;">Cancel</div>
        <div onclick="app.confirmDeleteNow()" style="cursor:pointer;flex:1;height:48px;background:#ef4444;color:#ffffff;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:15px;font-weight:700;box-shadow:0 8px 20px rgba(239,68,68,0.35);">Delete</div>
      </div>
    </div>
  </div>`;
}

SCREENS.reflection = reflectionScreen;
SCREENS.reflectionThread = reflectionThreadScreen;
SCREENS.reflectionNew = reflectionNewScreen;

Object.assign(window.app, {
  goReflection: () => { S.reflectionFabOpen = false; go("reflection"); },
  toggleReflectionFab: () => { S.reflectionFabOpen = !S.reflectionFabOpen; render(); },
  // Each option carries its own visibility straight into the composer;
  // the visibility picker there still lets the author change it before submitting.
  chooseReflectionType: (visibility) => {
    S.reflectionFabOpen = false;
    app.openReflectionForm(visibility);
  },
  openReflectionForm: (visibility) => {
    // A stale editing id here would make the composer overwrite the edited post.
    S.editingReflectionId = null;
    S.rTitle = ""; S.rDesc = ""; S.rVisibility = visibility || "Public"; S.rFile = null;
    S.reflectionOptionsOpen = false;
    go("reflectionNew");
  },
  backReflection: () => {
    const target = S.screen === "reflectionThread" ? (S.threadOrigin || "reflection") : "reflection";
    S.activeReflectionId = null; S.replyText = ""; S.quoteContext = null;
    S.editingReplyId = null;
    S.reflectionFabOpen = false;
    S.editingReflectionId = null;
    S.reflectionOptionsOpen = false;
    S.threadOrigin = "reflection";
    go(target);
  },

  /* One Cancel serves both ways into the composer — the FAB (new) and the
     kebab's Edit (existing post) — since each needs its own state cleanup. */
  cancelCompose: () => {
    if (S.editingReflectionId) app.cancelEditReflection();
    else app.backReflection();
  },

  openReflectionOptions: () => { S.reflectionOptionsOpen = true; render(); },
  closeReflectionOptions: () => { S.reflectionOptionsOpen = false; render(); },
  clearReflectionFile: () => { S.rFile = null; render(); },

  onRTitle: (v) => { S.rTitle = v; app.updateSubmitButtonState(); },
  onRDesc: (v) => { S.rDesc = v; app.updateSubmitButtonState(); },

  /* Poked directly instead of re-rendering: render() replaces the whole screen,
     which would drop focus and close the keyboard on every keystroke. Keep these
     values in step with the Submit pill in reflectionNewScreen(). */
  updateSubmitButtonState: () => {
    const valid = S.rTitle.trim() && S.rDesc.trim();
    const btn = document.getElementById("submitReflectionBtn");
    if (btn) {
      btn.style.background = valid ? '#2563eb' : '#b9c2cf';
      btn.style.boxShadow = valid ? '0 6px 16px rgba(37,99,235,0.35)' : 'none';
      btn.style.cursor = valid ? 'pointer' : 'not-allowed';
    }
  },

  openThread: (refId) => {
    const container = document.getElementById("scrollable-container");
    if (container) {
      S.scrollPositions[S.screen] = container.scrollTop;
    }
    S.threadOrigin = S.screen === "notifications" ? "notifications" : "reflection";
    S.activeReflectionId = refId;
    S.replyText = "";
    S.quoteContext = null;
    // Swipe-back leaves the thread without going through backReflection, so an
    // abandoned edit must not follow the user into the next thread.
    S.editingReplyId = null;
    go("reflectionThread");
  },

  /* ---- Author actions: kebab -> sheet -> edit / delete ---- */

  openPostActions: (kind, id, refId) => {
    S.actionSheet = { kind: kind, id: id, refId: refId };
    render();
  },

  closePostActions: () => { S.actionSheet = null; render(); },

  startEditFromActions: () => {
    const a = S.actionSheet;
    if (!a) return;
    S.actionSheet = null;
    if (a.kind === "reply") app.startEditReply(a.refId, a.id);
    else if (a.kind === "post") app.startEditPost(a.id);
    else app.startEditReflection(a.id);
  },

  askDeleteFromActions: () => {
    const a = S.actionSheet;
    if (!a) return;
    S.actionSheet = null;
    S.confirmDelete = a;
    render();
  },

  cancelDelete: () => { S.confirmDelete = null; render(); },

  confirmDeleteNow: () => {
    const d = S.confirmDelete;
    if (!d) return;
    S.confirmDelete = null;
    if (d.kind === "reply") app.deleteReplyNow(d.refId, d.id);
    else if (d.kind === "post") app.deletePostNow(d.id);
    else app.deleteReflectionNow(d.id);
  },

  startEditReflection: (refId) => {
    const r = DATA.reflections.find(x => x.id === refId);
    if (!r) return;
    S.editingReflectionId = refId;
    S.rTitle = r.title || "";
    S.rDesc = r.fullText || r.text || "";
    S.rVisibility = r.visibility || "Public";
    S.rFile = null;
    S.reflectionOptionsOpen = false;
    go("reflectionNew");
  },

  cancelEditReflection: () => {
    S.editingReflectionId = null;
    S.rTitle = ""; S.rDesc = ""; S.rVisibility = "Public"; S.rFile = null;
    S.reflectionOptionsOpen = false;
    go("reflection");
  },

  startEditReply: (refId, replyId) => {
    const r = DATA.reflections.find(x => x.id === refId);
    const rp = r && r.replies ? r.replies.find(x => String(x.id) === String(replyId)) : null;
    if (!rp) return;
    S.editingReplyId = replyId;
    S.replyText = rp.text || "";
    S.quoteContext = null;
    render();
    const input = document.getElementById("replyInput");
    if (input) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  },

  cancelEditReply: () => {
    S.editingReplyId = null;
    S.replyText = "";
    render();
  },

  /* Deletion is server-first: refreshData re-adds local-only reflections and keeps
     the longer local reply array, so removing an item before the write lands would
     make it reappear on the next navigation. */
  deleteReflectionNow: (refId) => {
    const r = DATA.reflections.find(x => x.id === refId);
    if (!r) return;

    const finishLocally = () => {
      const idx = DATA.reflections.findIndex(x => x.id === refId);
      if (idx !== -1) DATA.reflections.splice(idx, 1);
      if (S.activeReflectionId === refId) {
        S.activeReflectionId = null;
        S.replyText = ""; S.quoteContext = null; S.editingReplyId = null;
        go("reflection");
      } else {
        render();
      }
    };

    r.isDeleting = true;
    render();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(() => { finishLocally(); })
        .withFailureHandler((err) => {
          r.isDeleting = false;
          render();
          alert("Failed to delete reflection: " + err.message);
        })
        .deleteReflection({ userEmail: S.currentUserEmail, refId: refId });
    } else {
      finishLocally();
    }
  },

  deleteReplyNow: (refId, replyId) => {
    const r = DATA.reflections.find(x => x.id === refId);
    if (!r || !r.replies) return;
    const rp = r.replies.find(x => String(x.id) === String(replyId));
    if (!rp) return;

    const finishLocally = () => {
      const idx = r.replies.findIndex(x => String(x.id) === String(replyId));
      if (idx !== -1) r.replies.splice(idx, 1);
      if (String(S.editingReplyId) === String(replyId)) {
        S.editingReplyId = null;
        S.replyText = "";
      }
      render();
    };

    rp.isDeleting = true;
    render();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(() => { finishLocally(); })
        .withFailureHandler((err) => {
          rp.isDeleting = false;
          render();
          alert("Failed to delete reply: " + err.message);
        })
        .deleteReply({ userEmail: S.currentUserEmail, replyId: replyId });
    } else {
      finishLocally();
    }
  },

  quoteReply: (author, text) => {
    S.quoteContext = { author, text };
    render();
    const input = document.getElementById("replyInput");
    if (input) input.focus();
  },

  clearQuote: () => {
    S.quoteContext = null;
    render();
  },

  onReplyInput: (el) => {
    const val = el.value;
    S.replyText = val;
    
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 135) + 'px';

    const btn = document.getElementById('sendReplyBtn');
    if(btn) {
      const hasText = val.trim().length > 0;
      btn.style.background = hasText ? '#2563eb' : '#f2f2f2';
      btn.style.color = hasText ? '#ffffff' : '#8d8d8d';
    }

    const menu = document.getElementById('mentionMenu');
    if (!menu) return;

    const cursorPosition = el.selectionStart || val.length;
    const textBeforeCursor = val.substring(0, cursorPosition);
    const lastAtIndex = textBeforeCursor.lastIndexOf('@');

    if (lastAtIndex !== -1) {
      const charBefore = lastAtIndex > 0 ? textBeforeCursor[lastAtIndex - 1] : ' ';
      if (/\s/.test(charBefore) || lastAtIndex === 0) {
        const query = textBeforeCursor.substring(lastAtIndex + 1);
        if (!/\n/.test(query)) {
          const q = query.toLowerCase().trim();
          const membersList = (DATA && DATA.members) ? DATA.members : [];
          const members = q === "" ? membersList : membersList.filter(m => m.name.toLowerCase().includes(q));
          
          if (members.length > 0) {
            let html = `<div style="padding:10px 16px 6px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#8d8d8d;border-bottom:1px solid #f1f5f9;">MENTION SOMEONE</div>`;
            html += members.map(m => `
              <div onmousedown="event.preventDefault(); app.insertMention('${m.name.replace(/'/g, "\\'")}')" ontouchstart="event.preventDefault(); app.insertMention('${m.name.replace(/'/g, "\\'")}')" style="padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background 0.15s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='#ffffff'">
                <div style="width:38px;height:38px;border-radius:50%;background:#e2e8f0;color:#1e293b;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;">${esc(m.initials || getInitials(m.name))}</div>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:15px;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(m.name)}</div>
                  <div style="font-size:12px;color:#64748b;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(m.role || 'Member')}</div>
                </div>
              </div>`).join("");
            menu.innerHTML = html;
            menu.style.display = "block";
            return;
          }
        }
      }
    }
    menu.style.display = "none";
  },

  insertMention: (name) => {
    const input = document.getElementById('replyInput');
    if (!input) return;
    const val = input.value;
    const cursorPosition = input.selectionStart || val.length;
    const textBeforeCursor = val.substring(0, cursorPosition);
    const lastAtIndex = textBeforeCursor.lastIndexOf('@');
    
    if(lastAtIndex !== -1) {
      const textAfterCursor = val.substring(cursorPosition);
      const newVal = val.substring(0, lastAtIndex) + '@' + name + ' ' + textAfterCursor;
      S.replyText = newVal;
      input.value = newVal;
      const newCursorPos = lastAtIndex + name.length + 2;
      input.setSelectionRange(newCursorPos, newCursorPos);
    }
    const menu = document.getElementById('mentionMenu');
    if (menu) menu.style.display = 'none';
    input.focus();
    const btn = document.getElementById('sendReplyBtn');
    if(btn) {
      btn.style.background = '#2563eb';
      btn.style.color = '#ffffff';
    }
  },

  submitReply: () => {
    const text = S.replyText.trim();
    if (!text || !S.activeReflectionId) return;

    if (S.editingReplyId) {
      const replyId = S.editingReplyId;
      const ref = DATA.reflections.find(x => x.id === S.activeReflectionId);
      const rp = ref && ref.replies ? ref.replies.find(x => String(x.id) === String(replyId)) : null;
      const previousText = rp ? rp.text : "";
      if (rp) rp.text = text;
      S.editingReplyId = null;
      S.replyText = "";
      render();

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withFailureHandler((err) => {
            if (rp) rp.text = previousText;
            render();
            alert("Failed to save reply: " + err.message);
          })
          .updateReply({ userEmail: S.currentUserEmail, replyId: replyId, text: text });
      }
      return;
    }

    const payload = {
      userEmail: S.currentUserEmail, 
      refId: S.activeReflectionId,
      text: text,
      quotedAuthor: S.quoteContext ? S.quoteContext.author : "",
      quotedText: S.quoteContext ? S.quoteContext.text : "",
      timestamp: new Date().toISOString()
    };

    const r = DATA.reflections.find(x => x.id === S.activeReflectionId);
    if (r) {
      if (!r.replies) r.replies = [];
      r.replies.push({
        author: DATA.user.name,
        userId: DATA.user.userId,
        initials: getInitials(DATA.user.name),
        text: payload.text,
        time: "just now",
        quotedAuthor: payload.quotedAuthor,
        quotedText: payload.quotedText
      });
    }
    
    S.replyText = "";
    S.quoteContext = null;
    render();

    const threadScroll = document.getElementById("threadScroll");
    if (threadScroll) {
      threadScroll.scrollTop = threadScroll.scrollHeight;
      S.threadScrollTop = threadScroll.scrollHeight;
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((newReplyId) => {
          if (r && r.replies && r.replies.length > 0) {
            const posted = r.replies[r.replies.length - 1];
            posted.time = new Date().toISOString();
            // The id is what makes this reply addressable by the kebab menu.
            if (newReplyId) posted.id = newReplyId;
            render();
          }
        })
        .withFailureHandler((err) => {
          alert("Failed to post reply: " + err.message);
        })
        .saveReflectionReply(payload);
    }
  },

  setPublic: () => { S.rVisibility = "Public"; render(); },
  setGroup: () => { S.rVisibility = "Group"; render(); },
  setPrivate: () => { S.rVisibility = "Private"; render(); },
  expandReflection: (i) => { S.expandedReflections[i] = true; render(); },

  handleFileSelect: (input) => {
    const file = input.files[0];
    if (!file) return;
    
    if (file.size > 12 * 1024 * 1024) {
      input.value = "";
      S.rFile = null;
      S.fileErrorMessage = "The selected file is larger than 12MB. Please choose a smaller file and try again.";
      S.fileErrorModalOpen = true;
      render();
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      S.rFile = { name: file.name, data: e.target.result };
      // Safe to re-render here, unlike while typing: the user is coming back from
      // the OS file picker, so there is no caret or keyboard to preserve, and the
      // title/body text already lives in S.
      render();
    };
    reader.onerror = function() {
      input.value = "";
      S.rFile = null;
      S.fileErrorMessage = "Failed to read the file. Please try a different file.";
      S.fileErrorModalOpen = true;
      render();
    };
    reader.readAsDataURL(file);
  },

  closeFileErrorModal: () => {
    S.fileErrorModalOpen = false;
    S.fileErrorMessage = "";
    render();
  },

  submitReflection: () => {
    if(!S.rTitle.trim()||!S.rDesc.trim()||S.isSubmittingReflection) return;

    if (S.editingReflectionId) {
      const refId = S.editingReflectionId;
      const r = DATA.reflections.find(x => x.id === refId);
      if (!r) { app.cancelEditReflection(); return; }

      const before = { title: r.title, text: r.text, fullText: r.fullText, visibility: r.visibility };
      const newTitle = S.rTitle.trim();
      const newText = S.rDesc.trim();
      const newVisibility = S.rVisibility;

      r.title = newTitle;
      r.fullText = newText;
      r.text = newText.length > 250 ? newText.substring(0, 250) + "..." : newText;
      r.visibility = newVisibility;

      S.editingReflectionId = null;
      S.rTitle = ""; S.rDesc = ""; S.rVisibility = "Public"; S.rFile = null;
      S.reflectionOptionsOpen = false;
      go("reflection");

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withFailureHandler((err) => {
            r.title = before.title; r.text = before.text;
            r.fullText = before.fullText; r.visibility = before.visibility;
            render();
            alert("Failed to save reflection: " + err.message);
          })
          .updateReflection({
            userEmail: S.currentUserEmail,
            refId: refId,
            title: newTitle,
            text: newText,
            visibility: newVisibility
          });
      }
      return;
    }

    S.isSubmittingReflection = true;
    render();

    const payload = { 
      userEmail: S.currentUserEmail,
      title: S.rTitle.trim(), 
      text: S.rDesc.trim(), 
      visibility: S.rVisibility, 
      fileName: S.rFile ? S.rFile.name : "", 
      fileData: S.rFile ? S.rFile.data : "",
      timestamp: new Date().toISOString()
    };

    let fullTxt = payload.text;
    let truncTxt = fullTxt.length > 250 ? fullTxt.substring(0, 250) + "..." : fullTxt;
    
    const newRefObj = {
      id: 'ref_' + Date.now(),
      author: DATA.user.name,
      group: DATA.group ? DATA.group.name : "The Stewards",
      title: payload.title,
      text: truncTxt,
      fullText: fullTxt,
      time: payload.timestamp,
      initials: getInitials(DATA.user.name),
      visibility: payload.visibility,
      mine: true,
      fileName: payload.fileName,
      fileUrl: "#",
      replies: [],
      isPosting: true
    };

    DATA.reflections.unshift(newRefObj);
    S.rTitle=""; S.rDesc=""; S.rVisibility="Public"; S.rFile=null;
    S.reflectionOptionsOpen = false;
    S.reflectionTab = payload.visibility==="Public" || payload.visibility==="Group" ? "all" : "mine";
    S.isSubmittingReflection = false;
    go("reflection");

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((res) => {
          newRefObj.isPosting = false;
          if (res && res.newId) {
            newRefObj.id = res.newId;
            if (res.fileUrl) newRefObj.fileUrl = res.fileUrl;
          }
          render();
        })
        .withFailureHandler((err) => {
          newRefObj.isPosting = false;
          render();
          console.error("Failed to sync reflection to server: " + err.message);
        })
        .saveReflectionWithFile(payload);
    } else {
      setTimeout(() => {
        newRefObj.isPosting = false;
        render();
      }, 1000);
    }
  },

  setTabAll: () => { S.reflectionTab = "all"; render(); },
  setTabMine: () => { S.reflectionTab = "mine"; render(); }
});
</script>
