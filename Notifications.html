<script>
/* ==========================================================================
   NOTIFICATIONS — activity aimed at the current user: @mentions in a reply,
   replies on their reflection, and quoted replies to their comment.
   The list is built server-side in getData(); only read state round-trips.
   Entry point is the bell in the Home header.
   ========================================================================== */

function unreadNotifCount(){
  if (!DATA || !DATA.notifications) return 0;
  return DATA.notifications.filter(n => !n.read).length;
}

function notifBadge(type){
  if (type === "reaction") {
    return `<span style="position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:#6d5bd0;color:#ffffff;display:flex;align-items:center;justify-content:center;border:2px solid #ffffff;">${micon("favorite", 11, "#ffffff")}</span>`;
  }
  if (type === "mention") {
    return `<span style="position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:#2563eb;color:#ffffff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #ffffff;">@</span>`;
  }
  return `<span style="position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;border:2px solid #ffffff;">${micon("chat_bubble", 11, "#ffffff")}</span>`;
}

function notificationsScreen(){
  if (!DATA) return `<div class="screen"></div>`;

  const list = DATA.notifications || [];
  const unread = unreadNotifCount();
  const subtitle = unread > 0 ? `${unread} unread` : (list.length ? "You're all caught up" : "Nothing here yet");

  const markAll = unread > 0
    ? `<div onclick="app.markAllNotifsRead()" style="cursor:pointer;flex-shrink:0;font-size:13px;font-weight:700;color:#2563eb;">Mark all read</div>`
    : "";

  const rows = list.map(n => {
    const cardBg = n.read ? "#f8fafc" : "#ffffff";
    const dot = n.read
      ? ""
      : `<span style="flex-shrink:0;width:9px;height:9px;border-radius:50%;background:#2563eb;margin-top:6px;"></span>`;

    return `<div onclick="app.openNotification('${esc(n.id)}','${esc(n.refId)}')" style="cursor:pointer;background:${cardBg};border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 4px 16px -12px rgba(17,24,32,.25);border:1px solid ${n.read ? '#eef2f6' : '#e2e8f0'};">
      <div style="position:relative;flex-shrink:0;width:42px;height:42px;border-radius:50%;background:#e2e8f0;color:#1e293b;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;">
        ${esc(n.initials)}
        ${notifBadge(n.type)}
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;color:#404040;line-height:1.45;"><b style="color:#111820;">${esc(n.actor)}</b> ${esc(n.actionText)}</div>
        <div style="font-size:13px;color:#2563eb;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(n.context)}</div>
        <div style="font-size:12px;color:#8d8d8d;margin-top:4px;">${esc(timeAgo(n.time))}</div>
      </div>
      ${dot}
    </div>`;
  }).join("");

  const emptyState = `<div style="padding:60px 40px;text-align:center;">
    <div style="font-size:15px;font-weight:700;color:#404040;">No notifications</div>
    <div style="font-size:13px;color:#8d8d8d;margin-top:6px;line-height:1.5;">You'll be notified when someone replies to your reflection or mentions you.</div>
  </div>`;

  return `<div class="screen" style="background:#ffffff;">
    <div id="scrollable-container" class="scr fill" onscroll="app.handleScroll(this)" style="flex:1;min-height:0;background:#f4f6f9;padding:0 0 40px;overflow-y:auto;">
      <div id="ptr-indicator"><div class="ptr-spinner"></div><span>Pull to refresh...</span></div>
      <div style="background:#ffffff;color:#2b2b2b;padding:calc(16px + env(safe-area-inset-top)) 22px 16px;display:flex;align-items:center;gap:14px;">
        <div onclick="app.backHome()" style="cursor:pointer;flex-shrink:0;width:38px;height:38px;border-radius:50%;background:#f4f6f9;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -8px rgba(17,24,32,.2);">${I.back}</div>
        <div style="flex:1;min-width:0;">
          <div class="serif" style="font-size:26px;font-weight:700;color:#2b2b2b;letter-spacing:-.4px;">Notifications</div>
          <div style="font-size:14px;color:#8f8a80;margin-top:1px;">${esc(subtitle)}</div>
        </div>
        ${markAll}
      </div>
      <div style="padding:0 22px;margin-top:6px;">
        ${rows || emptyState}
      </div>
    </div>
  </div>`;
}

SCREENS.notifications = notificationsScreen;

Object.assign(window.app, {
  goNotifications: () => go("notifications"),

  openNotification: (notifId, refId) => {
    const n = (DATA.notifications || []).find(x => String(x.id) === String(notifId));
    if (n && !n.read) {
      n.read = true;
      if (S.readNotifIds.indexOf(String(notifId)) === -1) S.readNotifIds.push(String(notifId));
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withFailureHandler((err) => {
            console.error("Failed to mark notification read: " + err.message);
          })
          .markNotificationRead({ userEmail: S.currentUserEmail, notifId: String(notifId) });
      }
    }
    // openThread and go() render on their own; no separate render() needed for
    // the flag above. A reaction has no thread to open — it points at the
    // Community feed instead.
    if (n && n.type === "reaction") {
      go("community");
    } else if (refId) {
      app.openThread(refId);
    } else {
      render();
    }
  },

  markAllNotifsRead: () => {
    (DATA.notifications || []).forEach(n => {
      n.read = true;
      if (S.readNotifIds.indexOf(String(n.id)) === -1) S.readNotifIds.push(String(n.id));
    });
    render();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withFailureHandler((err) => {
          console.error("Failed to mark all read: " + err.message);
        })
        .markAllNotificationsRead({ userEmail: S.currentUserEmail });
    }
  }
});
</script>
