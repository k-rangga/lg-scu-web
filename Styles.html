<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">

<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html, body {
    width: 100%;
    height: 100%;
    background: #111820;
    color: #111820;
    overflow: hidden;
  }
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  a{color:#2563eb;text-decoration:none;}
  a:hover{color:#1d4ed8;}
  input,textarea,button{font-family:inherit;}
  input:focus,textarea:focus{outline:none;}
  button{border:none;background:none;cursor:pointer;}
  .serif{font-family:'Source Serif 4',Georgia,serif;}
  .scr::-webkit-scrollbar{width:0;height:0;}

  /* Material Symbols — the web-font equivalent of CardService IconImage/MaterialIcon.
     Size and color are set inline at each call site (see micon() in Core). */
  .msym{
    font-family:'Material Symbols Outlined';
    font-weight:normal;
    font-style:normal;
    line-height:1;
    letter-spacing:normal;
    text-transform:none;
    display:inline-block;
    white-space:nowrap;
    word-wrap:normal;
    direction:ltr;
    font-feature-settings:'liga';
    -webkit-font-feature-settings:'liga';
    -webkit-font-smoothing:antialiased;
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  }

  #app{
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 428px; 
    background: #f2f2f2;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  .screen{
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0; 
    display: flex;
    flex-direction: column;
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    overflow: hidden;
  }

  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes pulseAnim{0%{opacity:0.4;}50%{opacity:1;}100%{opacity:0.4;}}

  .sheet-backdrop{
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 50;
    background: rgba(17,24,32,.6);
    animation: fadeIn .2s ease;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .sheet{background:#ffffff;border-radius:26px 26px 0 0;padding:10px 22px 30px;animation:sheetUp .28s cubic-bezier(.2,.8,.2,1);}
  /* A sheet that was already open before this render — see overlayAnim() in Core. */
  .sheet-backdrop.no-anim, .sheet.no-anim{animation:none;}
  .grab{width:40px;height:5px;border-radius:100px;background:#8d8d8d;opacity:0.3;margin:0 auto 16px;}
  
  .spinner {
    width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #ffffff; animation: spin 1s ease-in-out infinite;
  }

  /* Light pill fields on the dark login screen. The autofill rule keeps Safari
     and Chrome from repainting a filled field pale yellow. */
  .login-input{ -webkit-appearance:none; appearance:none; }
  .login-input::placeholder{ color:#9aa4b2; }
  .login-input:-webkit-autofill,
  .login-input:-webkit-autofill:focus{
    -webkit-box-shadow: 0 0 0 1000px #e9edf9 inset;
    -webkit-text-fill-color: #111820;
    caret-color: #111820;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Skeleton placeholders for the gap between the lean sign-in payload and the
     extended keys — see skeletonList() in Core. */
  .sk-card{
    background:#ffffff;border-radius:20px;padding:18px 20px;margin-bottom:14px;
    border:1px solid #d1d1d1;box-shadow:0 4px 16px -12px rgba(17,24,32,.15);
    animation:pulseAnim 1.4s infinite ease-in-out;
  }
  .sk-bar{background:#e6e6e6;border-radius:6px;height:11px;}
  .sk-avatar{width:44px;height:44px;border-radius:50%;background:#e6e6e6;flex-shrink:0;}

  #ptr-indicator {
    position: absolute;
    top: -50px;
    left: 0;
    right: 0;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #2563eb;
    font-size: 13px;
    font-weight: 600;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 10;
  }
  .ptr-spinner {
    width: 18px; height: 18px; border: 2px solid rgba(37,99,235,0.2); border-radius: 50%; border-top-color: #2563eb; animation: spin 0.8s linear infinite;
  }
</style>
