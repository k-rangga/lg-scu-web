<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  :root{
    /* Kept in sync with the current screen by render() in Core (see the comment
       there) — "255 255 255" is #ffffff, the color almost every top bar uses now. */
    --bg-status-rgb: 255 255 255;
  }
  html, body {
    width: 100%;
    height: 100%;
    /* Matches the white every screen but welcome/login/pulseDone/profileEdit uses
       (see render()'s theme-color switch in Core) — this is what shows through on
       iOS Safari's elastic overscroll bounce and behind the safe-area inset, so it
       should read as a continuation of whatever screen is on top, not a mismatched
       color. */
    background: #ffffff;
    color: #111820;
    overflow-x: hidden;
    /* Not `hidden` — Safari only tints its status bar/toolbar with theme-color
       once the *document* has been scrolled at all; at scrollY 0 it shows its
       own default bar regardless of theme-color. lockStatusBarScroll() in Core
       nudges this a few px on load to trigger that, permanently. #app is
       `position:fixed` (below) so none of this is visible — it never moves. */
    overflow-y: auto;
  }
  body{
    font-family:'Geist',"Helvetica Neue",Helvetica,Arial,sans-serif;
    /* A few px taller than the viewport so there is something for
       lockStatusBarScroll() to actually scroll to. */
    min-height: calc(100% + 4px);
  }
  /* iOS's black-translucent status bar isn't painted by us at all — it's a hole
     that shows whatever page content is scrolled underneath it, which is why a
     header color change or a scroll bounce can leave a visible seam (or, worse,
     the notch/Dynamic Island area rendering as a plain black bar) right at the
     status bar boundary. This paints a matching strip over exactly the true
     status bar region (env(safe-area-inset-top) — the actual notch/island
     height on the device), tinted opaque to the current screen's color
     (--bg-status-rgb, updated by render() in Core), so it reads as one
     continuous surface with the header directly beneath it instead of a seam.
     (An earlier version of this rule tried to fake the coverage with a
     negative top + overflow:hidden clip, but the math left the whole strip
     positioned above y=0 — genuinely 0px of it ever painted anything.) */
  .statusbar{
    position: fixed;
    top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top, 44px);
    z-index: 100;
    pointer-events: none;
    background-color: rgb(var(--bg-status-rgb) / 1);
    transition: background-color .15s ease;
  }
  a{color:#2563eb;text-decoration:none;}
  a:hover{color:#1d4ed8;}
  input,textarea,button{font-family:inherit;}
  input:focus,textarea:focus{outline:none;}
  button{border:none;background:none;cursor:pointer;}
  .serif{font-family:'Geist',"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .scr::-webkit-scrollbar{width:0;height:0;}

  /* Material Symbols — the web-font equivalent of CardService IconImage/MaterialIcon.
     Size and color are set inline at each call site (see micon() in Core). */
  .msym{
    font-family:'Material Symbols Outlined';
    font-weight:normal;
    font-style:normal;
    line-height:1;
    letter-spacing:normal;
    text-transform:none;
    display:inline-block;
    white-space:nowrap;
    word-wrap:normal;
    direction:ltr;
    font-feature-settings:'liga';
    -webkit-font-feature-settings:'liga';
    -webkit-font-smoothing:antialiased;
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  }

  #app{
    /* fixed, not absolute — the html/body scroll lock in lockStatusBarScroll()
       (Core) moves the document by a few px on load, and an absolutely
       positioned box would shift by that same amount. Fixed never moves. */
    position: fixed;
    top: 0; bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 428px;
    background: #f4f6f9;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  .screen{
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0; 
    display: flex;
    flex-direction: column;
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    overflow: hidden;
  }

  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes pulseAnim{0%{opacity:0.4;}50%{opacity:1;}100%{opacity:0.4;}}
  @keyframes fabRotateOpen{from{transform:rotate(0deg);}to{transform:rotate(45deg);}}
  /* The mirror of fabRotateOpen, played on the render where a FAB just closed
     (see fabIconAnim() in Core) — without it the "x" snapped straight back to
     "+" with no motion, since a freshly-closed render is otherwise unanimated
     like every other sheet in this app. */
  @keyframes fabRotateClose{from{transform:rotate(45deg);}to{transform:rotate(0deg);}}
  @keyframes fabMenuIn{from{opacity:0;transform:scale(.85) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}

  .sheet-backdrop{
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 50;
    background: rgba(17,24,32,.6);
    animation: fadeIn .2s ease;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .sheet{background:#ffffff;border-radius:26px 26px 0 0;padding:10px 22px 30px;animation:sheetUp .28s cubic-bezier(.2,.8,.2,1);}
  .fab-icon-rotate{animation:fabRotateOpen .2s cubic-bezier(.2,.8,.2,1) forwards;transform-origin:center;}
  .fab-icon-close{animation:fabRotateClose .22s cubic-bezier(.2,.8,.2,1) forwards;transform-origin:center;}
  .fab-menu{animation:fabMenuIn .18s cubic-bezier(.2,.8,.2,1);transform-origin:bottom right;}
  /* A sheet (or FAB menu) that was already open before this render — see overlayAnim() in Core. */
  .sheet-backdrop.no-anim, .sheet.no-anim, .fab-icon-rotate.no-anim, .fab-menu.no-anim{animation:none;}

  /* Tap feedback for circular header icon buttons (back/info/etc.) — a quick,
     smooth press so the button itself feels responsive even though sheets in
     this app open with no other transition on the trigger. */
  .icon-btn{transition:transform .15s cubic-bezier(.2,.8,.2,1), background-color .15s ease;}
  .icon-btn:active{transform:scale(.9);background-color:#e9edf2 !important;}
  .grab{width:40px;height:5px;border-radius:100px;background:#8d8d8d;opacity:0.3;margin:0 auto 16px;}
  
  .spinner {
    width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #ffffff; animation: spin 1s ease-in-out infinite;
  }

  /* Light pill fields on the dark login screen. The autofill rule keeps Safari
     and Chrome from repainting a filled field pale yellow. */
  .login-input{ -webkit-appearance:none; appearance:none; }
  .login-input::placeholder{ color:#9aa4b2; }
  .login-input:-webkit-autofill,
  .login-input:-webkit-autofill:focus{
    -webkit-box-shadow: 0 0 0 1000px #e9edf9 inset;
    -webkit-text-fill-color: #111820;
    caret-color: #111820;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* First-time reaction: the tapped icon "flies" from the tap point to the new
     chip that just appeared in the post's reaction bar, then that chip pops
     (see flyReactionIcon in Community). Removed from the DOM once it lands. */
  .rx-fly{
    position:fixed;
    top:0; left:0;
    z-index:200;
    pointer-events:none;
    transform-origin:center;
    transition:transform .55s cubic-bezier(.2,.8,.2,1), opacity .4s ease .2s;
    will-change:transform,opacity;
  }
  @keyframes rxPop{
    0%{transform:scale(1);}
    45%{transform:scale(1.35);}
    100%{transform:scale(1);}
  }
  .rx-pop{animation:rxPop .4s cubic-bezier(.2,.8,.2,1);}

  /* Add-reaction button: highlight on hover (desktop) and hold (touch, via
     :active) so it reads as tappable before the picker opens. */
  .rx-add-btn{transition:background-color .15s ease, border-color .15s ease;}
  .rx-add-btn:hover, .rx-add-btn:active{background-color:#e4e4e4;border-color:#c7c7c7;}

  #ptr-indicator {
    position: absolute;
    top: -50px;
    left: 0;
    right: 0;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #2563eb;
    font-size: 13px;
    font-weight: 600;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 10;
  }
  .ptr-spinner {
    width: 18px; height: 18px; border: 2px solid rgba(37,99,235,0.2); border-radius: 50%; border-top-color: #2563eb; animation: spin 0.8s linear infinite;
  }
</style>
