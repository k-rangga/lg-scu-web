<script>
/* ==========================================================================
   CORE — shared foundation for every feature module.
   Defines: DATA, S (state), utility helpers, icon set, SCREENS registry,
   the app handler object, render(), the bottom nav, swipe-to-go-back, and
   the navigation/scroll handlers shared across screens.
   Feature files register themselves into SCREENS and app after this loads.
   ========================================================================== */

let DATA = null;

const S = {
  screen: "welcome", 
  selectedEvent: null,
  composeOpen: false, composeType: "Praise", composeText: "", composeVisibility: "Public",
  attendanceOpen: false, attMarks: {},
  reflectionTab: "all",
  rTitle: "", rDesc: "", rVisibility: "Public", rFile: null,
  isSubmittingReflection: false,
  isSigningIn: false,
  isRestoring: false,
  isRefreshing: false,
  // True between the lean sign-in/resume payload and the extended keys landing.
  // Distinguishes "posts/reflections/notifications not fetched yet" from "empty".
  isLoadingExtended: false,
  expandedReflections: {},
  activeReflectionId: null,
  replyText: "", quoteContext: null,
  actionSheet: null, confirmDelete: null,
  editingReflectionId: null, editingReplyId: null,
  pulseAnswers: {}, pulseOE: "",
  fileErrorModalOpen: false, fileErrorMessage: "",
  pulseAlreadySubmittedModalOpen: false,
  communitySearchQuery: "",
  loginEmail: "",
  loginPassword: "",
  currentUserEmail: "",
  editName: "",
  editEmail: "",
  editPassword: "",
  scrollPositions: {},
  threadScrollTop: 0,
  threadOrigin: "reflection",
  readNotifIds: []
};

/* Screen registry + global handler object.
   Feature modules add to these once Core has run. */
const SCREENS = {};
window.app = {};

/* ---- Remembered sign-in ------------------------------------------------
   The session token issued by verifyLogin is kept in localStorage so a
   refresh can rehydrate the session instead of returning to the login screen
   (see the boot path in Init).

   Cookies are no use here: Apps Script serves this page from a
   *.googleusercontent.com iframe inside script.google.com, so document.cookie
   is a third-party cookie and gets dropped. localStorage in that same frame is
   partitioned but survives refreshes.

   Every access is wrapped because reading localStorage *throws* in a
   third-party frame under some Safari / private-mode settings. A throw just
   means "not remembered" — the user sees the login screen, nothing breaks.
   ---------------------------------------------------------------------- */

const SESSION_KEY = "lg_session";

function readToken(){  try { return window.localStorage.getItem(SESSION_KEY) || ""; } catch(e){ return ""; } }
function saveToken(t){ try { window.localStorage.setItem(SESSION_KEY, t); } catch(e){} }
function clearToken(){ try { window.localStorage.removeItem(SESSION_KEY); } catch(e){} }

function getInitials(name) {
  if (!name) return "US";
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) {
    return (parts[0][0] + parts[0][0]).toUpperCase();
  }
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function refreshData(callback) {
  if (typeof google !== 'undefined' && google.script && google.script.run && S.currentUserEmail) {
    google.script.run.withSuccessHandler((newData) => {
      // This is the full getData, so its payload carries the keys lean mode omits.
      S.isLoadingExtended = false;
      if (newData) {
        if (DATA && DATA.reflections) {
          newData.reflections = newData.reflections.map(serverRef => {
            const localRef = DATA.reflections.find(r => r.id === serverRef.id);
            if (localRef && localRef.replies && localRef.replies.length > (serverRef.replies ? serverRef.replies.length : 0)) {
              return { ...serverRef, replies: localRef.replies };
            }
            return serverRef;
          });

          const existingIds = new Set(newData.reflections.map(r => r.id));
          const localOnlyReflections = DATA.reflections.filter(r => {
            if (existingIds.has(r.id)) return false;
            const matchOnServer = newData.reflections.some(sr => sr.title === r.title && sr.text === r.text && sr.author === r.author);
            if (matchOnServer) return false;
            return true;
          });
          newData.reflections = [...localOnlyReflections, ...newData.reflections];
        }

        // A refresh can outrun the markNotificationRead write, which would flip a
        // just-tapped row back to unread. Re-apply what this session already read.
        if (newData.notifications && S.readNotifIds.length) {
          newData.notifications.forEach(n => {
            if (S.readNotifIds.indexOf(String(n.id)) !== -1) n.read = true;
          });
          newData.notifUnread = newData.notifications.filter(n => !n.read).length;
        }

        DATA = newData;
        // A background refresh must not remount the compose sheet underneath the
        // user — that replays its slide-up and drops the textarea caret. The
        // repaint happens on the next render (closeCompose / submitPost).
        if (!S.composeOpen) render();
      }
      if (callback) callback();
    }).withFailureHandler((err) => {
      // A dropped refresh must not leave the skeletons pulsing forever.
      S.isLoadingExtended = false;
      render();
      if (callback) callback();
    }).getData(S.currentUserEmail);
  } else {
    if (callback) callback();
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refreshData();
});
window.addEventListener("focus", refreshData);

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function parseFormatting(text) {
  if (!text) return "";
  let escaped = esc(text);
  escaped = escaped.replace(/\*([^\*]+)\*/g, '<strong>$1</strong>');
  return escaped;
}

const truncate = (str, len = 150) => {
  if (!str) return "";
  return str.length > len ? str.substring(0, len) + "..." : str;
};

function timeAgo(dateParam) {
  if (!dateParam) return "posted just now";
  if (typeof dateParam === 'string' && (dateParam.toLowerCase().includes('ago') || dateParam.toLowerCase().includes('yesterday') || dateParam.toLowerCase().includes('posting'))) return dateParam;
  
  const date = new Date(dateParam);
  if (isNaN(date.getTime())) return dateParam;

  const diffSec = Math.floor((new Date() - date) / 1000);
  if (diffSec < 60) return "1m ago";
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHour = Math.floor(diffMin / 60);
  if (diffHour < 24) return `${diffHour}h ago`;
  const diffDay = Math.floor(diffHour / 24);
  if (diffDay < 7) return `${diffDay}d ago`;
  const diffWeek = Math.floor(diffDay / 7);
  return `${diffWeek}w ago`;
}

function formatMentions(text) {
  const membersList = (DATA && DATA.members) ? DATA.members : [];
  let parsed = parseFormatting(text);
  membersList.forEach(m => {
    const regex = new RegExp(`@${m.name}\\b`, 'gi');
    parsed = parsed.replace(regex, `<span style="color:#2563eb;font-weight:600;">@${m.name}</span>`);
  });
  return parsed;
}

const SCREENS_WITH_BACK = ["login", "eventDetail", "community", "reflectionNew", "reflectionThread", "pulse", "pulseForm", "profileEdit", "group", "events", "resources", "notifications"];

function getBackScreenForCurrent() {
  if (S.screen === "login") return "welcome";
  if (S.screen === "eventDetail") return "events";
  if (S.screen === "reflectionNew") return "reflection";
  // A thread can be opened from the feed or from a notification — go back to whichever.
  if (S.screen === "reflectionThread") return S.threadOrigin || "reflection";
  if (S.screen === "pulseForm") return "pulse";
  if (S.screen === "profile") return "home";
  if (S.screen === "profileEdit") return "profile";
  if (S.screen === "group") return "home";
  if (S.screen === "events") return "home";
  if (S.screen === "resources") return "home";
  return "home";
}

const NAV_HIDDEN = ["restoring","welcome","login","eventDetail","community","resources","reflectionNew","reflectionThread","pulse","pulseForm","pulseDone","pulseAlreadySubmitted","profileEdit", "group", "notifications"];

function go(screen){ 
  S.screen = screen; 
  render(); 
  if (S.currentUserEmail && screen !== "welcome" && screen !== "login") {
    refreshData();
  }
}

/* Material Symbols glyph — the web equivalent of a CardService MaterialIcon.
   Renders the icon name as a ligature; `color` defaults to the parent's color. */
function micon(name, size, color){
  return `<span class="msym" style="font-size:${size}px;color:${color||'currentColor'};">${name}</span>`;
}

const I = {
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111820" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8d8d8d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  pin:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  cal:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2.5"/><path d="M4 9.5h16"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>',
  doc:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg>',
  download:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>',
  messageCircle:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
  send:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
  book:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v13"/><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4H9a3 3 0 0 1 3 3 3 3 0 0 1 3-3h4.5A1.5 1.5 0 0 1 21 5.5v11a1.5 1.5 0 0 1-1.5 1.5H15a3 3 0 0 0-3 2 3 3 0 0 0-3-2H4.5A1.5 1.5 0 0 1 3 16.5Z"/></svg>'
};

/* ---- Small shared UI helpers used by multiple feature screens ---- */

function subHeader(backFn,title,sub){
  return `<div style="display:flex;align-items:center;gap:14px;"><div onclick="app.${backFn}()" style="cursor:pointer;width:38px;height:38px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -8px rgba(17,24,32,.2);">${I.back}</div><div><div class="serif" style="font-size:24px;font-weight:600;color:#111820;">${esc(title)}</div><div style="font-size:13px;color:#8d8d8d;">${esc(sub)}</div></div></div>`;
}
function emptyRow(msg){ return `<div style="padding:40px 20px;text-align:center;color:#8d8d8d;font-size:14px;">${esc(msg)}</div>`; }

/* Placeholder cards held while the lean sign-in payload's missing keys are
   still in flight (see S.isLoadingExtended). Shaped like the real card so
   nothing jumps when the data lands. */
function skeletonList(count){
  const bar = (w, mt) => `<div class="sk-bar" style="width:${w};margin-top:${mt};"></div>`;
  return Array.from({length: count || 3}, () => `<div class="sk-card">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="sk-avatar"></div>
      <div style="flex:1;">${bar("45%","0")}${bar("30%","8px")}</div>
    </div>
    ${bar("100%","16px")}${bar("85%","8px")}${bar("60%","8px")}
  </div>`).join("");
}

/* Sheets are re-emitted from scratch on every render(), so their CSS entry
   animation replays on any render that happens while they are open — which
   looks like the sheet opening a second time. Remember what was mounted last
   pass and suppress the animation for a sheet that is merely staying open.
   Each sheet builder must call this exactly once per render, before its
   early return, so the flag clears when the sheet closes. */
const mountedOverlays = {};
function overlayAnim(key, isOpen){
  const wasOpen = !!mountedOverlays[key];
  mountedOverlays[key] = isOpen;
  return (isOpen && wasOpen) ? " no-anim" : "";
}

function bottomNav(){
  if (NAV_HIDDEN.includes(S.screen)) return "";
  const item = (fn,label,iconName,active) => `<div onclick="app.${fn}()" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:4px 0;color:${active?'#2563eb':'#8d8d8d'};">${micon(iconName,26)}<span style="font-size:12px;font-weight:600;">${label}</span></div>`;
  return `<div style="position:absolute;left:0;right:0;bottom:0;z-index:35;display:flex;padding:12px 12px calc(26px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-top:1px solid #d1d1d1;">
    ${item("goHome","Home","home",S.screen==="home")}
    ${item("goEvents","Events","calendar_month",S.screen==="events")}
    ${item("goReflection","Reflection","lightbulb",S.screen==="reflection")}
    ${item("goProfile","Profile","account_circle",S.screen==="profile")}
  </div>`;
}

function render(){ 
  try {
    const appEl = document.getElementById("app");
    if (!appEl) return;
    
    const oldContainer = document.getElementById("scrollable-container");
    if (oldContainer) {
      S.scrollPositions[S.screen] = oldContainer.scrollTop;
    }
    const oldThread = document.getElementById("threadScroll");
    if (oldThread) {
      S.threadScrollTop = oldThread.scrollTop;
    }

    const metaTheme = document.getElementById("theme-color-meta");
    if (metaTheme) {
      if (["restoring", "welcome", "home", "profile"].includes(S.screen)) {
        metaTheme.content = '#111820';
      } else if (["login", "pulseDone", "pulseAlreadySubmitted"].includes(S.screen)) {
        metaTheme.content = '#1c3249';
      } else {
        metaTheme.content = '#f2f2f2';
      }
    }

    const screenFn = SCREENS[S.screen] || welcomeScreen;
    appEl.innerHTML = screenFn() + bottomNav() + composeSheet() + attendanceSheet() + fileErrorModal() + postActionSheet() + confirmDeleteSheet();

    const newContainer = document.getElementById("scrollable-container");
    if (newContainer && S.scrollPositions[S.screen] !== undefined) {
      newContainer.scrollTop = S.scrollPositions[S.screen];
    }
    const newThread = document.getElementById("threadScroll");
    if (newThread) {
      newThread.scrollTop = S.threadScrollTop;
    }

    // Text clamping can only be measured once the new markup is laid out.
    if (typeof applyReadMoreClamps === "function") applyReadMoreClamps();
  } catch (err) {
    document.getElementById("app").innerHTML = `<div style="padding:24px;color:#d94545;font-size:14px;overflow-y:auto;background:#ffffff;height:100%;"><b>Critical Render Error</b><br/><br/>${err.message}<br/><br/><pre style="white-space:pre-wrap;">${err.stack}</pre></div>`;
  }
}

/* ---- Swipe-from-left-edge to go back ---- */

let touchStartX = 0;
let touchStartY = 0;
let isSwipeActive = false;

document.addEventListener('touchstart', (e) => {
  if (!SCREENS_WITH_BACK.includes(S.screen)) return;
  if (e.touches.length === 1 && e.touches[0].clientX < 40) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    isSwipeActive = true;
  }
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (!isSwipeActive) return;
  const currentX = e.touches[0].clientX;
  const currentY = e.touches[0].clientY;
  const diffX = currentX - touchStartX;
  const diffY = Math.abs(currentY - touchStartY);

  if (diffY > Math.abs(diffX)) {
    isSwipeActive = false;
    const screenEl = document.querySelector('.screen');
    if (screenEl) screenEl.style.transform = '';
    return;
  }

  if (diffX > 0) {
    const screenEl = document.querySelector('.screen');
    if (screenEl) {
      screenEl.style.transition = 'none';
      screenEl.style.transform = `translateX(${diffX}px)`;
    }
  }
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!isSwipeActive) return;
  isSwipeActive = false;
  const screenEl = document.querySelector('.screen');
  if (!screenEl) return;

  const endX = e.changedTouches[0].clientX;
  const diffX = endX - touchStartX;

  screenEl.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
  if (diffX > 100) {
    screenEl.style.transform = 'translateX(100%)';
    setTimeout(() => {
      const target = getBackScreenForCurrent();
      go(target);
    }, 200);
  } else {
    screenEl.style.transform = 'translateX(0)';
  }
}, { passive: true });

/* ---- Core handlers: bottom-nav destinations + shared pull-to-refresh ---- */

Object.assign(window.app, {
  goHome: () => go("home"),
  goGroup: () => go("group"),
  goEvents: () => go("events"),
  goResources: () => go("resources"),
  backHome: () => go("home"),

  handleScroll: (el) => {
    if (S.screen === "reflection") {
      S.scrollPositions[S.screen] = el.scrollTop;
    } else if (S.screen === "reflectionThread") {
      S.threadScrollTop = el.scrollTop;
    }
    const indicator = document.getElementById("ptr-indicator");
    if (!indicator) return;

    if (el.scrollTop < -20) {
      const pullDist = Math.min(Math.abs(el.scrollTop), 70);
      indicator.style.transform = `translateY(${pullDist}px)`;
      
      if (el.scrollTop < -55 && !S.isRefreshing) {
        S.isRefreshing = true;
        indicator.innerHTML = `<div class="ptr-spinner"></div><span>Refreshing data...</span>`;
        refreshData(() => {
          S.isRefreshing = false;
          indicator.style.transform = `translateY(0px)`;
          setTimeout(() => {
            indicator.innerHTML = `<div class="ptr-spinner"></div><span>Pull to refresh...</span>`;
          }, 300);
        });
      }
    } else {
      indicator.style.transform = `translateY(0px)`;
    }
  }
});
</script>
