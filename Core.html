/* ==========================================================================
   CORE — shared foundation for every feature module.
   Defines: DATA, S (state), utility helpers, icon set, SCREENS registry,
   the app handler object, render(), the bottom nav, swipe-to-go-back, and
   the navigation/scroll handlers shared across screens.
   Feature files register themselves into SCREENS and app after this loads.
   ========================================================================== */

let DATA = null;

const S = {
  screen: "welcome", 
  selectedEvent: null,
  composeOpen: false, composeType: "Praise", composeText: "", composeVisibility: "Public",
  // Mentor attendance screen (Attendance.html): marks and notes keyed by userId,
  // plus the counts of a save the server has not confirmed yet — keyed by
  // eventId and merged back over every refresh, like pendingReactions below.
  attStatus: {}, attNotes: {}, attSearch: "", attSaving: false,
  pendingAttendance: {},
  // Edit mode re-opens a saved record: attBaseline is that record, and every
  // change the screen reports is measured against it.
  attMode: "fill", attBaseline: {}, attSavedAt: "", attLoadingEdit: false,
  reflectionTab: "all",
  reflectionFabOpen: false,
  // The composer's visibility + attachment sheet (see reflectionOptionsSheet in
  // Reflection) — the compose screen itself only shows the writing surface.
  reflectionOptionsOpen: false,
  rTitle: "", rDesc: "", rVisibility: "Public", rFile: null,
  isSubmittingReflection: false,
  isSigningIn: false,
  isRestoring: false,
  isRefreshing: false,
  expandedReflections: {},
  activeReflectionId: null,
  replyText: "", quoteContext: null,
  actionSheet: null, confirmDelete: null,
  editingReflectionId: null, editingReplyId: null, editingPostId: null,
  pulseAnswers: {}, pulseOE: "",
  fileErrorModalOpen: false, fileErrorMessage: "",
  pulseAlreadySubmittedModalOpen: false,
  communitySearchQuery: "",
  communityFabOpen: false,
  // Which post's reaction picker is open, and the reaction writes this session
  // is still waiting on the server for — { postId: { type: true|false } },
  // true meaning "should be on" (see the merge in refreshData).
  reactionPickerFor: null, reactionInfoOpen: false, reactionInfoThen: null,
  pendingReactions: {},
  loginEmail: "",
  loginPassword: "",
  currentUserEmail: "",
  editName: "",
  editEmail: "",
  editPassword: "",
  scrollPositions: {},
  threadScrollTop: 0,
  threadOrigin: "reflection",

  announcementShareCopied: false

/* Screen registry + global handler object.
   Feature modules add to these once Core has run. */
const SCREENS = {};
window.app = {};

/* ---- Remembered sign-in ------------------------------------------------
   The session token issued by verifyLogin is kept in localStorage so a
   refresh can rehydrate the session instead of returning to the login screen
   (see the boot path in Init).

   Cookies are no use here: Apps Script serves this page from a
   *.googleusercontent.com iframe inside script.google.com, so document.cookie
   is a third-party cookie and gets dropped. localStorage in that same frame is
   partitioned but survives refreshes.

   Every access is wrapped because reading localStorage *throws* in a
   third-party frame under some Safari / private-mode settings. A throw just
   means "not remembered" — the user sees the login screen, nothing breaks.
   ---------------------------------------------------------------------- */

const SESSION_KEY = "lg_session";

function readToken(){  try { return window.localStorage.getItem(SESSION_KEY) || ""; } catch(e){ return ""; } }
function saveToken(t){ try { window.localStorage.setItem(SESSION_KEY, t); } catch(e){} }
function clearToken(){ try { window.localStorage.removeItem(SESSION_KEY); } catch(e){} }

/* The reaction meanings are explained once, the first time a member opens the
   picker. Same best-effort wrapping as the token above: a throw just means the
   explainer is shown again, which is harmless. The ⓘ in the Community header
   re-opens it any time. */
const RX_INTRO_KEY = "lg_rx_intro";
function reactionIntroSeen(){ try { return !!window.localStorage.getItem(RX_INTRO_KEY); } catch(e){ return false; } }
function markReactionIntroSeen(){ try { window.localStorage.setItem(RX_INTRO_KEY, "1"); } catch(e){} }

/* ---- Server clock ------------------------------------------------------
   Anything that gates on "is it time yet" must not trust the device clock: a
   phone in another timezone, or with the time set by hand, would open the
   mentor attendance card (see Events) at the wrong moment. Every getData
   payload carries serverNow, so we keep the offset against it and read the
   time through nowMs() instead of Date.now().

   A payload without serverNow — the standalone mock, or a build served before
   this field existed — leaves the offset at 0, i.e. plain device time.
   ---------------------------------------------------------------------- */
let SERVER_SKEW_MS = 0;
function noteServerClock(d){ if (d && d.serverNow) SERVER_SKEW_MS = Number(d.serverNow) - Date.now(); }
function nowMs(){ return Date.now() + SERVER_SKEW_MS; }

function getInitials(name) {
  if (!name) return "US";
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) {
    return (parts[0][0] + parts[0][0]).toUpperCase();
  }
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function refreshData(callback) {
  if (typeof google !== 'undefined' && google.script && google.script.run && S.currentUserEmail) {
    google.script.run.withSuccessHandler((newData) => {
      if (newData) {
        if (DATA && DATA.reflections) {
          newData.reflections = newData.reflections.map(serverRef => {
            const localRef = DATA.reflections.find(r => r.id === serverRef.id);
            if (localRef && localRef.replies && localRef.replies.length > (serverRef.replies ? serverRef.replies.length : 0)) {
              return { ...serverRef, replies: localRef.replies };
            }
            return serverRef;
          });

          const existingIds = new Set(newData.reflections.map(r => r.id));
          const localOnlyReflections = DATA.reflections.filter(r => {
            if (existingIds.has(r.id)) return false;
            const matchOnServer = newData.reflections.some(sr => sr.title === r.title && sr.text === r.text && sr.author === r.author);
            if (matchOnServer) return false;
            return true;
          });
          newData.reflections = [...localOnlyReflections, ...newData.reflections];
        }

        // A refresh can outrun the markNotificationRead write, which would flip a
        // just-tapped row back to unread. Re-apply what this session already read.
        if (newData.notifications && S.readNotifIds.length) {
          newData.notifications.forEach(n => {
            if (S.readNotifIds.indexOf(String(n.id)) !== -1) n.read = true;
          });
          newData.notifUnread = newData.notifications.filter(n => !n.read).length;
        }

        // Same race one step further: a refresh can outrun a saveReaction write
        // and flip a just-tapped chip back. Re-apply whatever types this session
        // toggled that the server hasn't caught up on yet, and adjust the counts
        // the server sent so they agree.
        if (newData.posts) {
          Object.keys(S.pendingReactions).forEach(postId => {
            const pendingTypes = S.pendingReactions[postId];
            const post = newData.posts.find(p => String(p.id) === String(postId));
            if (!post) { delete S.pendingReactions[postId]; return; }

            post.reactions = post.reactions || { amen:0, love:0, praise:0, hope:0 };
            post.myReactions = post.myReactions || [];
            const serverHas = new Set(post.myReactions);

            Object.keys(pendingTypes).forEach(type => {
              const wantOn = pendingTypes[type];
              if (serverHas.has(type) === wantOn) {
                delete pendingTypes[type]; // the server caught up
                return;
              }
              if (wantOn) {
                post.reactions[type] = (post.reactions[type] || 0) + 1;
                post.myReactions.push(type);
              } else {
                post.reactions[type] = Math.max(0, (post.reactions[type] || 0) - 1);
                post.myReactions = post.myReactions.filter(t => t !== type);
              }
            });

            if (Object.keys(pendingTypes).length === 0) delete S.pendingReactions[postId];
          });
        }

        /* And once more for attendance: saving navigates back to the event
           detail screen straight away, which kicks off this very refresh, so
           the payload in flight can easily predate the write. Re-apply the
           counts this session recorded until the server reports them itself,
           otherwise the summary card would flip back to "not taken yet".
           Keyed by eventId, which every event in the payload carries. */
        Object.keys(S.pendingAttendance).forEach(eventId => {
          const pending = S.pendingAttendance[eventId];
          const matches = [newData.nextEvent].concat(newData.events || [])
                            .filter(ev => ev && String(ev.eventId) === String(eventId));
          if (!matches.length) { delete S.pendingAttendance[eventId]; return; }

          if (matches.some(ev => ev.attendance && ev.attendance.recorded)) {
            delete S.pendingAttendance[eventId];   // the server caught up
            return;
          }
          matches.forEach(ev => { ev.attendance = pending; });
        });

        DATA = newData;
        noteServerClock(newData);
        // A background refresh must not remount the compose sheet underneath the
        // user — that replays its slide-up and drops the textarea caret. The
        // repaint happens on the next render (closeCompose / submitPost).
        if (!S.composeOpen) render();
      }
      if (callback) callback();
    }).withFailureHandler((err) => {
      render();
      if (callback) callback();
    }).getData(S.currentUserEmail);
  } else {
    if (callback) callback();
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refreshData();
});
window.addEventListener("focus", () => refreshData());

/* iOS Safari only tints its status bar/toolbar with <meta name="theme-color">
   once the document itself has been scrolled — at the very top (scrollY 0) it
   shows its own default bar no matter what theme-color says. body is a few px
   taller than the viewport (see Styles) purely to give this something to
   scroll to; #app and .statusbar are `position:fixed` so nothing here is ever
   visible on screen. Re-armed on every scroll event in case anything (a
   resize, a stray gesture reaching past a scrollable container) bounces it
   back to 0. */
function lockStatusBarScroll(){
  if (window.scrollY < 1) window.scrollTo(0, 1);
}
lockStatusBarScroll();
window.addEventListener("load", lockStatusBarScroll);
window.addEventListener("scroll", lockStatusBarScroll, { passive: true });
window.addEventListener("orientationchange", () => setTimeout(lockStatusBarScroll, 50));

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function parseFormatting(text) {
  if (!text) return "";
  let escaped = esc(text);
  escaped = escaped.replace(/\*([^\*]+)\*/g, '<strong>$1</strong>');
  return escaped;
}

const truncate = (str, len = 150) => {
  if (!str) return "";
  return str.length > len ? str.substring(0, len) + "..." : str;
};

function timeAgo(dateParam) {
  if (!dateParam) return "posted just now";
  if (typeof dateParam === 'string' && (dateParam.toLowerCase().includes('ago') || dateParam.toLowerCase().includes('yesterday') || dateParam.toLowerCase().includes('posting'))) return dateParam;
  
  const date = new Date(dateParam);
  if (isNaN(date.getTime())) return dateParam;

  const diffSec = Math.floor((new Date() - date) / 1000);
  if (diffSec < 60) return "1m ago";
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHour = Math.floor(diffMin / 60);
  if (diffHour < 24) return `${diffHour}h ago`;
  const diffDay = Math.floor(diffHour / 24);
  if (diffDay < 7) return `${diffDay}d ago`;
  const diffWeek = Math.floor(diffDay / 7);
  return `${diffWeek}w ago`;
}

function formatMentions(text) {
  const membersList = (DATA && DATA.members) ? DATA.members : [];
  let parsed = parseFormatting(text);
  membersList.forEach(m => {
    const regex = new RegExp(`@${m.name}\\b`, 'gi');
    parsed = parsed.replace(regex, `<span style="color:#2563eb;font-weight:600;">@${m.name}</span>`);
  });
  return parsed;
}

const SCREENS_WITH_BACK = ["login", "eventDetail", "attendance", "community", "reflectionNew", "reflectionThread", "pulse", "pulseForm", "profileEdit", "group", "events", "resources", "notifications", "announcements", "announcementDetail"];

function getBackScreenForCurrent() {
  if (S.screen === "login") return "welcome";
  if (S.screen === "eventDetail") return "events";
  if (S.screen === "attendance") return "eventDetail";
  if (S.screen === "reflectionNew") return "reflection";
  // A thread can be opened from the feed or from a notification — go back to whichever.
  if (S.screen === "reflectionThread") return S.threadOrigin || "reflection";
  if (S.screen === "pulseForm") return "pulse";
  if (S.screen === "profile") return "home";
  if (S.screen === "profileEdit") return "profile";
  if (S.screen === "group") return "home";
  if (S.screen === "events") return "home";
  if (S.screen === "resources") return "home";
  // The detail view can be reached straight from Home's carousel too, but it
  // always backs out to the full list — matches "See All" being the other entry point.
  if (S.screen === "announcementDetail") return "announcements";
  if (S.screen === "announcements") return "home";
  return "home";
}

const NAV_HIDDEN = ["restoring","welcome","login","eventDetail","attendance","community","resources","reflectionNew","reflectionThread","pulse","pulseForm","pulseDone","pulseAlreadySubmitted","profileEdit", "group", "notifications", "announcements", "announcementDetail"];

function go(screen, opts){
  S.screen = screen;
  render();
  // skipRefresh: DATA just arrived from a full getData() call (sign-in/session
  // resume), so an immediate refreshData() here would be a redundant re-read.
  if (S.currentUserEmail && screen !== "welcome" && screen !== "login" && !(opts && opts.skipRefresh)) {
    refreshData();
  }
}

/* Material Symbols glyph — the web equivalent of a CardService MaterialIcon.
   Renders the icon name as a ligature; `color` defaults to the parent's color. */
function micon(name, size, color){
  return `<span class="msym" style="font-size:${size}px;color:${color||'currentColor'};">${name}</span>`;
}

  messageCircle:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',

};

/* ---- Small shared UI helpers used by multiple feature screens ---- */

function subHeader(backFn,title,sub){
  return `<div style="display:flex;align-items:center;gap:14px;"><div onclick="app.${backFn}()" style="cursor:pointer;width:38px;height:38px;border-radius:50%;background:#f4f6f9;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -8px rgba(17,24,32,.2);">${I.back}</div><div><div class="serif" style="font-size:26px;font-weight:700;letter-spacing:-.4px;color:#2b2b2b;">${esc(title)}</div><div style="font-size:14px;color:#8f8a80;">${esc(sub)}</div></div></div>`;
}
function emptyRow(msg){ return `<div style="padding:40px 20px;text-align:center;color:#8d8d8d;font-size:14px;">${esc(msg)}</div>`; }

/* Sheets are re-emitted from scratch on every render(), so their CSS entry
   animation replays on any render that happens while they are open — which
   looks like the sheet opening a second time. Remember what was mounted last
   pass and suppress the animation for a sheet that is merely staying open.
   Each sheet builder must call this exactly once per render, before its
   early return, so the flag clears when the sheet closes. */
const mountedOverlays = {};
function overlayAnim(key, isOpen){
  const wasOpen = !!mountedOverlays[key];
  mountedOverlays[key] = isOpen;
  return (isOpen && wasOpen) ? " no-anim" : "";
}

/* Companion to overlayAnim() for a FAB's own "+" -> "x" glyph: picks the class
   that plays the right one-shot rotation on the render where the FAB's open
   state actually flips, in either direction, so the icon reads as a single
   continuous rotation instead of animating open but snapping shut. Must be
   called before overlayAnim() runs for the same key (it peeks the same
   mountedOverlays[key] that overlayAnim is about to overwrite). */
function fabIconAnim(key, isOpen){
  const wasOpen = !!mountedOverlays[key];
  if (isOpen) return wasOpen ? "" : " fab-icon-rotate";
  return wasOpen ? " fab-icon-close" : "";
}

function bottomNav(){
  if (NAV_HIDDEN.includes(S.screen)) return "";
  const item = (fn,label,iconName,active) => `<div onclick="app.${fn}()" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:${active?'#2563eb':'#8d8d8d'};">${micon(iconName,26)}<span style="font-size:12px;font-weight:600;">${label}</span></div>`;
  // NAV_CONTENT_HEIGHT (Reflection's FAB reads this same number to clear the bar).
  return `<div style="position:absolute;left:0;right:0;bottom:0;z-index:35;display:flex;padding:6px 12px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-top:1px solid #d1d1d1;">
    ${item("goHome","Home","home",S.screen==="home")}
    ${item("goEvents","Events","calendar_month",S.screen==="events")}
    ${item("goReflection","Reflection","lightbulb",S.screen==="reflection")}
    ${item("goProfile","Profile","account_circle",S.screen==="profile")}
  </div>`;
}

function render(){ 
  try {
    const appEl = document.getElementById("app");
    if (!appEl) return;
    
    const oldContainer = document.getElementById("scrollable-container");
    if (oldContainer) {
      S.scrollPositions[S.screen] = oldContainer.scrollTop;
    }
    const oldThread = document.getElementById("threadScroll");
    if (oldThread) {
      S.threadScrollTop = oldThread.scrollTop;
    }
    // Dedicated (not S.screen-keyed) so a trip through another screen — e.g.
    // opening the share sheet's backdrop — can never clobber it the way the
    // generic scrollPositions map above does when S.screen has already flipped.
    const oldAnnDetail = document.getElementById("announcementScroll");
    if (oldAnnDetail) {
      S.announcementScrollTop = oldAnnDetail.scrollTop;
    }

    // Same branches drive both: the meta tag tints Android Chrome's/Safari's own
    // toolbar, while --bg-status-rgb feeds the .statusbar overlay in Styles that
    // fakes a matching, blurred iOS status bar under black-translucent (see the
    // comment on .statusbar — black-translucent doesn't paint the bar itself,
    // it just makes it show whatever's scrolled underneath, so without this a
    // notched iPhone shows a seam between the true status bar and the header).
    const metaTheme = document.getElementById("theme-color-meta");
    // White is the default now (every top bar matches Home's) — only the
    // handful of screens with their own branded/dark header carve out an
    // exception below.
    let hex = '#ffffff', rgb = '255 255 255';
    if (["restoring", "welcome"].includes(S.screen)) {
      hex = '#112378'; rgb = '17 35 120';
    } else if (S.screen === "login") {
      hex = '#f4f6f9'; rgb = '244 246 249';
    } else if (["pulseDone", "pulseAlreadySubmitted"].includes(S.screen)) {
      hex = '#1c3249'; rgb = '28 50 73';
    } else if (S.screen === "profileEdit") {
      hex = '#f4f6f9'; rgb = '244 246 249';
    }
    if (metaTheme) metaTheme.content = hex;
    document.documentElement.style.setProperty('--bg-status-rgb', rgb);

    const screenFn = SCREENS[S.screen] || welcomeScreen;
    appEl.innerHTML = screenFn() + bottomNav() + composeSheet() + reactionInfoSheet() + fileErrorModal() + postActionSheet() + confirmDeleteSheet() + reflectionOptionsSheet() + announcementShareSheet();

    const newContainer = document.getElementById("scrollable-container");
    if (newContainer && S.scrollPositions[S.screen] !== undefined) {
      newContainer.scrollTop = S.scrollPositions[S.screen];
    }
    const newThread = document.getElementById("threadScroll");
    if (newThread) {
      newThread.scrollTop = S.threadScrollTop;
    }
    const newAnnDetail = document.getElementById("announcementScroll");
    if (newAnnDetail) {
      newAnnDetail.scrollTop = S.announcementScrollTop;
    }

    // Text clamping can only be measured once the new markup is laid out.
    if (typeof applyReadMoreClamps === "function") applyReadMoreClamps();
    if (typeof positionReactionPicker === "function") positionReactionPicker();
  } catch (err) {
    document.getElementById("app").innerHTML = `<div style="padding:24px;color:#d94545;font-size:14px;overflow-y:auto;background:#ffffff;height:100%;"><b>Critical Render Error</b><br/><br/>${err.message}<br/><br/><pre style="white-space:pre-wrap;">${err.stack}</pre></div>`;
  }
}

/* ---- Swipe-from-left-edge to go back ---- */

let touchStartX = 0;
let touchStartY = 0;
let isSwipeActive = false;

document.addEventListener('touchstart', (e) => {
  if (!SCREENS_WITH_BACK.includes(S.screen)) return;
  if (e.touches.length === 1 && e.touches[0].clientX < 40) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    isSwipeActive = true;
  }
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (!isSwipeActive) return;
  const currentX = e.touches[0].clientX;
  const currentY = e.touches[0].clientY;
  const diffX = currentX - touchStartX;
  const diffY = Math.abs(currentY - touchStartY);

  if (diffY > Math.abs(diffX)) {
    isSwipeActive = false;
    const screenEl = document.querySelector('.screen');
    if (screenEl) screenEl.style.transform = '';
    return;
  }

  if (diffX > 0) {
    const screenEl = document.querySelector('.screen');
    if (screenEl) {
      screenEl.style.transition = 'none';
      screenEl.style.transform = `translateX(${diffX}px)`;
    }
  }
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!isSwipeActive) return;
  isSwipeActive = false;
  const screenEl = document.querySelector('.screen');
  if (!screenEl) return;

  const endX = e.changedTouches[0].clientX;
  const diffX = endX - touchStartX;

  screenEl.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
  if (diffX > 100) {
    screenEl.style.transform = 'translateX(100%)';
    setTimeout(() => {
      const target = getBackScreenForCurrent();
      go(target);
    }, 200);
  } else {
    screenEl.style.transform = 'translateX(0)';
  }
}, { passive: true });

/* ---- Core handlers: bottom-nav destinations + shared pull-to-refresh ---- */

Object.assign(window.app, {
  goHome: () => go("home"),
  goGroup: () => go("group"),
  goEvents: () => go("events"),
  goResources: () => go("resources"),
  backHome: () => go("home"),

  handleScroll: (el) => {
    if (S.screen === "reflection") {
      S.scrollPositions[S.screen] = el.scrollTop;
    } else if (S.screen === "reflectionThread") {
      S.threadScrollTop = el.scrollTop;
    }
    const indicator = document.getElementById("ptr-indicator");
    if (!indicator) return;

    if (el.scrollTop < -20) {
      const pullDist = Math.min(Math.abs(el.scrollTop), 70);
      indicator.style.transform = `translateY(${pullDist}px)`;
      
      if (el.scrollTop < -55 && !S.isRefreshing) {
        S.isRefreshing = true;
        indicator.innerHTML = `<div class="ptr-spinner"></div><span>Refreshing data...</span>`;
        refreshData(() => {
          S.isRefreshing = false;
          indicator.style.transform = `translateY(0px)`;
          setTimeout(() => {
            indicator.innerHTML = `<div class="ptr-spinner"></div><span>Pull to refresh...</span>`;
          }, 300);
        });
      }
    } else {
      indicator.style.transform = `translateY(0px)`;
    }
  }
});
</script>
