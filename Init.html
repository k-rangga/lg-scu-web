<script>
/* ==========================================================================
   INIT — must be the LAST include.
   Every screen has registered itself into SCREENS and every handler into app
   by now, so it is safe to do the first render here.

   When served by Google Apps Script, google.script.run exists and real data
   loads after sign-in. When the file is opened standalone (no GAS), we seed a
   small mock DATA object so the UI can be previewed.

   On GAS, a token left in localStorage by a previous sign-in is replayed here
   so a refresh lands back on Home instead of the welcome screen.
   ========================================================================== */

const HAS_GAS = !(typeof google === 'undefined' || !google.script || !google.script.run);

if (!HAS_GAS) {
  DATA = {
    user: { name: "Kalaka Rangga", initials: "KR", greetingDate: "Wednesday, Aug 12", role: "Member", email: "kalakarangga@gmail.com" },
    serviceUpdate: { enabled: true, theme: "Immeasurably More", module: "Module 1", note: "Remember to review your workshop materials before Thursday." },
    verse: { text: "Trust in the Lord with all your heart.", ref: "Proverbs 3:5" },
    announcements: [],
    nextEvent: { title: "Gathering", date: "Aug 15", time: "7:00 PM", location: "Online", summary: "Weekly meeting", badge: "UPCOMING" },
    group: { name: "The Stewards" },
    members: [
      { name: "Rachel Ng", initials: "RN", role: "Co-leader", phone: "" },
      { name: "Sarah Lim", initials: "SL", role: "Member", phone: "" },
      { name: "Marcus Tan", initials: "MT", role: "Member", phone: "" },
      { name: "Priscilla Goh", initials: "PG", role: "Member", phone: "" },
      { name: "Daniel Koh", initials: "DK", role: "Member", phone: "" }
    ],
    events: [],
    resources: { featured: null, list: [] },
    posts: [],
    reflections: [
      { id: "ref_1", author: "Sarah Lim", initials: "SL", group: "The Stewards", title: "Nothing can separate us", text: "Reading verses 38-39 aloud together, it hit me that even in my father's illness God's love holds...", fullText: "Reading verses 38-39 aloud together, it hit me that even in my father's illness God's love holds.", visibility: "Public", time: "2026-08-12T10:00:00.000Z", fileName: "my-notes.pdf", fileUrl: "#", replies: [] },
      { id: "ref_2", author: "Kalaka Rangga", initials: "KR", group: "The Stewards", title: "test", text: "123456", fullText: "123456", visibility: "Public", time: "2026-08-11T10:00:00.000Z", replies: [] }
    ],
    notifications: [
      { id: "r_mock1", type: "mention", actor: "Sarah Lim", initials: "SL", actionText: "mentioned you in a reply", context: "Nothing can separate us", refId: "ref_1", time: "2026-08-12T12:00:00.000Z", read: false },
      { id: "r_mock2", type: "reply", actor: "Marcus Tan", initials: "MT", actionText: "replied to your reflection", context: "test", refId: "ref_2", time: "2026-08-11T18:00:00.000Z", read: true }
    ],
    notifUnread: 1,
    pulse: { windowTitle: "Week 1 Check-In", closes: "Closes Sunday", daysLeftNote: "3 days left", isUrgent: false, questionCount: 3, openQuestionCount: 1, estimatedMinutes: 2, submitted: false, questions: ["How are you?"], openQuestions: ["Anything else?"] }
  };
}

const savedToken = HAS_GAS ? readToken() : "";

if (savedToken) {
  S.isRestoring = true;
  S.screen = "restoring";
  render();

  google.script.run
    .withSuccessHandler((res) => {
      S.isRestoring = false;
      if (res && res.success && res.data) {
        S.currentUserEmail = res.user.email;
        S.editName     = res.user.name;
        S.editEmail    = res.user.email;
        S.editPassword = "";
        DATA = res.data;
        // Lean payload, same as sign-in. go("home") fires refreshData(), whose
        // full getData is what backfills the missing keys and clears this.
        S.isLoadingExtended = true;
        go("home");
      } else {
        // Token revoked, user removed, or the row went INACTIVE — start over.
        clearToken();
        if (res && res.message) alert(res.message);
        go("welcome");
      }
    })
    .withFailureHandler(() => {
      S.isRestoring = false;
      clearToken();
      go("welcome");
    })
    .resumeSession(savedToken);
} else {
  render();
}
</script>
